String languageSourceRevision = providers.gradleProperty('languageRevision')
    .orElse(providers.exec {
        workingDir(rootDir)
        commandLine('git', 'rev-parse', 'HEAD')
    }.standardOutput.asText)
    .map { String revision ->
        String normalized = revision.trim().toLowerCase(Locale.ROOT)
        if (!(normalized ==~ /[0-9a-f]{40}/)) {
            throw new GradleException('languageRevision must be a full 40-character Git commit SHA.')
        }
        normalized
    }
    .get()
List<File> languageSourceFiles = fileTree('src/main/resources') {
    include('*.toml')
}.files.toList().sort { File left, File right -> left.name <=> right.name }
Map<String, String> languageSourceHashes = new LinkedHashMap<>()
for (File languageSourceFile : languageSourceFiles) {
    String locale = languageSourceFile.name.substring(0, languageSourceFile.name.length() - '.toml'.length())
    byte[] digest = MessageDigest.getInstance('SHA-256').digest(Files.readAllBytes(languageSourceFile.toPath()))
    languageSourceHashes.put(locale, HexFormat.of().formatHex(digest))
}
def verifyLanguageSourceRevisionTask = tasks.register('verifyLanguageSourceRevision') {
    group = 'verification'
    description = 'Verifies that downloadable locale sources match the pinned Git revision.'
    inputs.files(languageSourceFiles)

    doLast {
        List<String> currentPaths = languageSourceFiles.collect { File source ->
            rootDir.toPath().relativize(source.toPath()).toString().replace(File.separatorChar, '/' as char)
        }
        List<String> committedPaths = providers.exec {
            workingDir(rootDir)
            commandLine('git', 'ls-tree', '-r', '--name-only', languageSourceRevision, '--', 'src/main/resources')
        }.standardOutput.asText.get().readLines().findAll { String path -> path.endsWith('.toml') }.sort()
        if (committedPaths != currentPaths) {
            throw new GradleException('Locale source files do not match the pinned Git revision.')
        }
        providers.exec {
            workingDir(rootDir)
            commandLine(['git', 'diff', '--quiet', languageSourceRevision, '--'] + currentPaths)
        }.result.get().assertNormalExitValue()
    }
}
def languageSourceManifestTask = tasks.register('generateLanguageSourceManifest', WriteProperties) {
    dependsOn(verifyLanguageSourceRevisionTask)
    destinationFile.set(layout.buildDirectory.file('generated/language-source/adapt-language-source.properties'))
    property('revision', languageSourceRevision)
    property('locales', languageSourceHashes.keySet().join(','))
    for (Map.Entry<String, String> languageSourceHash : languageSourceHashes.entrySet()) {
        property('sha256.' + languageSourceHash.key, languageSourceHash.value)
    }
}
