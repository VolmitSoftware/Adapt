def verifyLanguagePackagingTask = tasks.register('verifyLanguagePackaging') {
    group = 'verification'
    description = 'Verifies that locales are absent from the jar and its download revision is pinned.'
    dependsOn(shadowJarTask)

    doLast {
        File runtimeJar = shadowJarTask.get().archiveFile.get().asFile

        Set<String> embeddedLocales = new LinkedHashSet<>()
        new ZipFile(runtimeJar).withCloseable { ZipFile jar ->
            Enumeration<? extends ZipEntry> entries = jar.entries()
            while (entries.hasMoreElements()) {
                ZipEntry entry = entries.nextElement()
                if (!entry.isDirectory() && entry.name.toLowerCase(Locale.ROOT).endsWith('.toml')) {
                    embeddedLocales.add(entry.name)
                }
            }
        }
        if (!embeddedLocales.isEmpty()) {
            throw new GradleException("Runtime jar contains locale TOMLs: ${embeddedLocales}")
        }

        new ZipFile(runtimeJar).withCloseable { ZipFile jar ->
            ZipEntry manifestEntry = jar.getEntry('adapt-language-source.properties')
            if (manifestEntry == null) {
                throw new GradleException('Runtime jar is missing adapt-language-source.properties.')
            }
            Properties manifest = new Properties()
            jar.getInputStream(manifestEntry).withCloseable { InputStream input -> manifest.load(input) }
            if (manifest.getProperty('revision') != languageSourceRevision) {
                throw new GradleException('Runtime jar language revision does not match the build revision.')
            }
            if (manifest.getProperty('locales') != languageSourceHashes.keySet().join(',')) {
                throw new GradleException('Runtime jar language locale set does not match the source set.')
            }
            for (Map.Entry<String, String> languageSourceHash : languageSourceHashes.entrySet()) {
                if (manifest.getProperty('sha256.' + languageSourceHash.key) != languageSourceHash.value) {
                    throw new GradleException('Runtime jar language hash does not match ' + languageSourceHash.key + '.')
                }
            }
        }
    }
}

