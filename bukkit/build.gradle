shadowJarTask.configure {
    archiveClassifier.set('')
    archiveFileName.set("Adapt v${project.version} [CraftBukkit] ${bukkitMinecraftRange}.jar")
    manifest.attributes('paperweight-mappings-namespace': 'mojang')
    minimize {
        exclude(dependency('de.crazydev22.slimjar.helper:.*:.*'))
        exclude(dependency('com.github.VolmitSoftware.VolmLib:.*:.*'))
        exclude(project(':core'))
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude('net/kyori/**')
    exclude('com/google/gson/**')
    exclude('com/fren_gor/ultimateAdvancementAPI/nms/v*/**')
    exclude { FileTreeElement entry ->
        String nativePrefix = 'art/arcane/volmlib/nativelib/'
        String path = entry.path
        if (!path.startsWith(nativePrefix) || !path.endsWith('.class')) {
            return false
        }
        String relative = path.substring(nativePrefix.length())
        return relative.contains('/') && !relative.matches('(?:common/|v26_[23]_R1/)?(?:(?:player|entity|advancement)/.*|chunk/(?:GeneratedChunkStructures|ChunkPosition).*)')
    }
}

