def verifyPublicApiCompatibility = tasks.register('verifyPublicApiCompatibility', JavaExec) {
    group = 'verification'
    description = 'Fails when a pre-port public API member in api-baseline.txt does not link against the built plugin jar.'
    dependsOn(shadowJarTask)
    inputs.file(apiBaselineFile).withPathSensitivity(PathSensitivity.NONE)
    inputs.files(shadowJarTask.flatMap { it.archiveFile }).withPathSensitivity(PathSensitivity.NONE)
    outputs.file(apiCompatibilityReport)
    classpath = sourceSets.apiCompat.runtimeClasspath
    mainClass = 'art.arcane.adapt.apicompat.ApiCompatibilityCheck'
    argumentProviders.add({
        [apiBaselineFile.path, shadowJarTask.get().archiveFile.get().asFile.path, apiCompatibilityReport.path]
    } as CommandLineArgumentProvider)
}

