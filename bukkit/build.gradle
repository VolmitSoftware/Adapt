def weaveApiBridges = tasks.register('weaveApiBridges', JavaExec) {
    group = 'build'
    description = 'Adds the pre-port Bukkit-typed API bridges to the core classes packed into the plugin jar.'
    dependsOn(tasks.named('compileJava'))
    inputs.files(configurations.apiCompatCore).withPathSensitivity(PathSensitivity.NONE)
    inputs.files(sourceSets.main.java.classesDirectory).withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.file(wovenCoreJar)
    classpath = sourceSets.apiCompat.runtimeClasspath
    mainClass = 'art.arcane.adapt.apicompat.ApiBridgeWeaver'
    argumentProviders.add({
        [configurations.apiCompatCore.singleFile.path, sourceSets.main.java.classesDirectory.get().asFile.path,
         wovenCoreJar.path]
    } as CommandLineArgumentProvider)
}

def apiCompatStubJar = tasks.register('apiCompatStubJar', JavaExec) {
    group = 'verification'
    description = 'Writes a compile-only jar with exactly the pre-port API surface from api-baseline.txt.'
    inputs.file(apiBaselineFile).withPathSensitivity(PathSensitivity.NONE)
    outputs.file(apiStubJarFile)
    classpath = sourceSets.apiCompat.runtimeClasspath
    mainClass = 'art.arcane.adapt.apicompat.ApiStubJar'
    args(apiBaselineFile.path, apiStubJarFile.path)
}

