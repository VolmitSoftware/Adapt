import java.util.regex.Matcher
import java.util.regex.Pattern

plugins {
    id 'java-library'
    id 'java-test-fixtures'
    id 'io.freefair.lombok'
}

String volmLibCoordinate = providers.gradleProperty('volmLibCoordinate')
    .orElse('com.github.VolmitSoftware:VolmLib:master-SNAPSHOT')
    .get()

dependencies {
    api(project(':api'))
    compileOnly(volmLibCoordinate) {
        changing = true
        transitive = false
    }
    compileOnly(libs.gson)
    compileOnly(libs.toml4j) {
        transitive = false
    }
    compileOnly('org.jetbrains:annotations:26.0.2-1')

    testImplementation(project(':content'))
    testImplementation(volmLibCoordinate) {
        changing = true
        transitive = false
    }
    testImplementation(libs.gson)
    testCompileOnly('org.jetbrains:annotations:26.0.2-1')
    testImplementation(libs.toml4j) {
        transitive = false
    }
    testFixturesCompileOnly(volmLibCoordinate) {
        changing = true
        transitive = false
    }
    testFixturesImplementation('org.mockito:mockito-core:5.14.2')

    testImplementation('org.junit.jupiter:junit-jupiter:5.11.4')
    testImplementation('org.assertj:assertj-core:3.26.3')
    testImplementation('org.mockito:mockito-core:5.14.2')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

tasks.named('test', Test) {
    useJUnitPlatform()
    jvmArgs('-Dnet.bytebuddy.experimental=true')
    if (providers.gradleProperty('updatePlatformCatalog').isPresent()) {
        systemProperty('adapt.updatePlatformCatalog', 'true')
    }
    if (providers.gradleProperty('updateAdaptationCosts').isPresent()) {
        systemProperty('adapt.updateAdaptationCosts', 'true')
    }
    testLogging {
        events('failed')
        exceptionFormat = 'full'
    }
}

FileTree coreSources = fileTree('src/main/java') { include('**/*.java') }
def verifyCorePurity = tasks.register('verifyCorePurity') {
    group = 'verification'
    description = 'Fails when core sources reference Bukkit, Paper, Adventure, Minecraft or Bukkit-bound VolmLib types.'
    inputs.files(coreSources).withPathSensitivity(PathSensitivity.RELATIVE)
    File report = layout.buildDirectory.file('reports/core-purity.txt').get().asFile
    outputs.file(report)

    doLast {
        Pattern forbidden = Pattern.compile('\\b(?:org\\.bukkit|io\\.papermc|com\\.destroystokyo|net\\.minecraft|net\\.kyori|net\\.md_5'
            + '|art\\.arcane\\.volmlib\\.(?:integration|projection|nativelib'
            + '|util\\.(?:bukkit|inventorygui|scheduling|hud|board|event|entity|metrics|uniques|director\\.(?:compat\\.BukkitDirectorContext|help|visual))))\\b')
        List<String> violations = []
        coreSources.files.sort { File source -> source.path }.each { File source ->
            source.readLines('UTF-8').eachWithIndex { String line, int index ->
                Matcher matcher = forbidden.matcher(line)
                if (matcher.find()) {
                    violations.add("${projectDir.toPath().relativize(source.toPath())}:${index + 1}: ${matcher.group()}".toString())
                }
            }
        }
        report.parentFile.mkdirs()
        report.setText(violations.join('\n'), 'UTF-8')
        if (!violations.isEmpty()) {
            throw new GradleException("Core sources reference platform types:\n${violations.join('\n')}")
        }
    }
}

/*
 * The engine loads built-in content like any addon: through the AdaptAddon a host installs, never by naming a content
 * class or package.
 */
def verifyCoreNamesNoContent = tasks.register('verifyCoreNamesNoContent') {
    group = 'verification'
    description = 'Fails when engine sources name a built-in content class or package.'
    inputs.files(coreSources).withPathSensitivity(PathSensitivity.RELATIVE)
    File report = layout.buildDirectory.file('reports/core-content-refs.txt').get().asFile
    outputs.file(report)

    doLast {
        Pattern reference = Pattern.compile('\\bart[.]arcane[.]adapt[.]content\\b')
        List<String> violations = []
        coreSources.files.sort { File source -> source.path }.each { File source ->
            source.readLines('UTF-8').eachWithIndex { String line, int index ->
                if (reference.matcher(line).find()) {
                    violations.add("${projectDir.toPath().relativize(source.toPath())}:${index + 1}".toString())
                }
            }
        }
        report.parentFile.mkdirs()
        report.setText(violations.join('\n'), 'UTF-8')
        if (!violations.isEmpty()) {
            throw new GradleException("Engine sources name built-in content:\n${violations.join('\n')}")
        }
    }
}

tasks.named('check').configure {
    dependsOn(verifyCorePurity)
    dependsOn(verifyCoreNamesNoContent)
}
