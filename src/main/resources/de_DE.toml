[mutation.domain]
body = "Körper"
hunt = "Jagd"
industry = "Industrie"
wild = "Wild"
craft = "Gewerbefahrt"
anomaly = "Anomalien"

[mutation.type.gale_lung]
name = "Gale Lung"
benefit = "Bei vollem Momentum drückt oder setzt der nächste Schlag das Ziel zurück."
burden = "Die Feinde drängen dich stärker, während der Momentum voll ist."
perfect = "Die Feinde drängen dich nicht mehr, blockieren still Momentum."
tell = "Teelwind sammelt sich um deine Füße und deine Waffe."
control = "Bewegt euch weiter, um Momentum zu füllen, dann kommt ein Hit."

[mutation.type.bastion_spine]
name = "Bastion-Spinhaut"
benefit = "Der nächste Schild, Axt oder unbewaffnete Schlag sendet einen kurzen Schub."
burden = "Wenn man sich auf dem Sprint befindet, kann man nicht springen oder springen."
perfect = "Man kann springen und springen, während man sich befestigt hat."
tell = "Steinribben und helle Risse zeigen deine gespeicherte Kraft."
control = "Stehen Sie still auf dem Boden und schlagen Sie dann mit einem Schild, einer Axt oder mit leeren Händen."

[mutation.type.verdant_molt]
name = "Verdant Molt"
benefit = "Schleichen Sie sich ohne sich auf natürlichen Boden zu bewegen, um schädliche Auswirkungen zu beseitigen."
burden = "Es beseitigt auch hilfreiche Wirkungen, verhindert Hunger und blockiert kurzfristig neue Wirkungen."
perfect = "Die wirksamen Wirkungen und der Hunger sind nicht mehr verloren gegangen."
tell = "Blätter, Schuppen oder Sporen sprengen von dir weg."
control = "Bleib still und schleicht dich nicht auf dem natürlichen Boden."

[mutation.type.temperbound]
name = "Gewichtsschränkt"
benefit = "Ein Panzer setzt sich zusammen, damit die Teile die Dauerhaftigkeit teilen."
burden = "Wenn man ein verknüpftes Stück entfernt oder austauscht, wird das Set kurzfristig deaktiviert."
perfect = "Die Schaltung der Rüstung deaktiviert das Set nicht mehr."
tell = "Glänzende Linien verbinden die verbundenen Rüstungsstücke."
control = "auf einem Adapt-Buchregal, tragen Sie vier handwerkliche Rüstungsstücke und wählen Sie eine Linke-Stromrüstung."

[mutation.type.paradox_scar]
name = "Paradox-Schar"
benefit = "Ein langer Zug oder Teleport verlässt einen Rückkehrpunkt."
burden = "Der Rückstandspunkt ist sichtbar, blockiert die Bildung eines anderen, und die Feinde können ihn brechen."
perfect = "Die anderen Mutations-Rückwirkung blockiert sie nicht mehr."
tell = "Ein helle Nachbilde markiert den Rückkehrpunkt."
control = "Nach einer langen Bewegung oder Teleportation schleicht man sich und tauscht sich die Hände um, um zurückzukehren."

[mutation.type.arsenal_cortex]
name = "Arsenal-Kortex"
benefit = "Wenn man zwischen den Schlägen Waffen oder Werkzeugtypen wechselt, wird ein Kontrolleffekt in den nächsten Schlag verursacht."
burden = "Mit dem gleichen Typ wird die Kombination kurzzeitig verschlossen."
perfect = "Die Wiederholung eines Typs schließt die Kombination nicht mehr ein."
tell = "Ein sich veränderndes Symbol dreht sich um das gehaltete Gegenstand."
control = "Landschläge mit verschiedenen Waffen oder Werkzeugen."

[mutation.type.packmind]
name = "Packmind"
benefit = "Haustiere und Verbündete bauen Tempo auf, indem sie auch schlagen."
burden = "Der Schaden ist gering, bis jemand anderes mitkommt."
perfect = "Der Schaden wird nicht mehr abgenommen, während Tempo noch einen Teilnehmer braucht."
tell = "Amberlinien verbinden die Gruppe mit dem markierten Ziel."
control = "Schlagen Sie ein Ziel, dann lassen Sie ein Haustier oder einen gewählten Verbündeten es auch angreifen."

[mutation.type.trophy_crucible]
name = "Trophäe Kreuzung"
benefit = "Natürliche Mobs können Trophäen fallen lassen, um eine Kontrolle gegen diese Mob zu bereiten."
burden = "Dieser Mob sieht dich leichter und sieht durch Mutations-Stealth."
perfect = "Die zusätzliche Erkennung ist entfernt, Sie können nur einen Trophäeneffekt speichern."
tell = "Eine Maske zeigt den Typ der gespeicherten Mob hinter dir."
control = "Schleichen Sie rechts auf einen Crafting-Tisch und halten Sie eine natürliche Trophäe."

[mutation.type.umbral_echo]
name = "Umbrale Echo"
benefit = "Angriff aus einem neuen Winkel oder mit einem neuen Waffentypen, um nach einer Verzögerung einen schwächen Kontrolleffekt zu wiederholen."
burden = "Wenn man den gleichen Ansatz wiederholt, wird man offenbart und die Stealth kurzzeitig abgeschaltet."
perfect = "Wenn man sich wiederholt, wird man nicht mehr offenbart."
tell = "Ein dunkelpurpuriges Nachbild wiederholt den Kontrolleffekt."
control = "Ändern Sie Ihren Angriffshalt oder den Waffentypen zwischen den Schlägen."

[mutation.type.living_lattice]
name = "Lebende Lattice"
benefit = "Die Ernte und Wiederaufpflanzung verdient Wurzelgeld."
burden = "Feuer und Lava können Ihre Ladung löschen, und ein Zwangskollaps kostet Hunger."
perfect = "Feuer und Lava löschen die Ladung nicht mehr aus."
tell = "Grüne Wurzeln werden braun, bevor der Weg verschwindet."
control = "Ernten und erneut pflanzen, dann drücken Sie rechts und halten Sie einen Sack."

[mutation.type.masterwork_bond]
name = "Die Verbindung mit Meisterwerk"
benefit = "Bind ein Werkzeug, das du selbst erstellt hast, anstatt zu brechen, hält es an einer einzigen Haltbarkeit und muss vor dem Gebrauch repariert werden."
burden = "Wenn man das gebundene Werkzeug verliert, muss man warten, bis man ein anderes gebunden hat."
perfect = "Andere Werkzeuge funktionieren normalerweise mit Mutations-Effekten."
tell = "Es läuft auf dem Werkzeug, wenn es sich knallt."
control = "Sie können sich in einem Adapt-Buchregal ein Werkzeug halten, das Sie selbst erstellt haben und dann das gebundene Werkzeug auswählen."

[mutation.type.deepblood]
name = "Tiefschwund"
benefit = "Das Bergbauen von Naturblöcken tief im Boden baut eine tiefe Ladung auf. Es gibt Heilung und spart ein gebundenes Werkzeug."
burden = "Die unterirdische Heilung verbraucht tiefe Ladung, und die Ladung fließt langsam über dem Boden."
perfect = "Die unterirdische Heilung funktioniert mit Nullladung."
tell = "Rote Risse breiten sich über dich und das gebundene Werkzeug aus, während sich die Ladung baut."
control = "Ich bin natürlich tief in den Blöcken und binde ein Werkzeug an einem Adapt Bücherregal."

[mutation.type.mycelial_nerve]
name = "Myzelienerven"
benefit = "Die hilfreichen Effekte, die Sie sich selbst geben, verbreiten sich schwächer an die in der Nähe befindlichen Spieler und Haustiere."
burden = "Dein eigener Effekt dauert weniger Zeit und Brandschäden brechen die Verbindung."
perfect = "Ihr Effekt hält seine volle Zeit und Feuer brecht nicht mehr den Link."
tell = "Spore-Spuren tragen kopierte Effekte an die nahe gelegenen Verbündeten."
control = "Geben Sie sich einen hilfreichen Effekt bei ausgewählten Spielern oder Besitztieren."

[mutation.type.gravebloom]
name = "Grabeblume"
benefit = "Wenn man einen natürlichen feindlichen Mob tötet, kann es eine kurzlebige Blüte erzeugen, die Pflanzen wachsen und deine Haustiere heilen kann."
burden = "Aktives Blüten schwächt die natürliche Heilung, und ältere Blüten ziehen feindliche Mädels an."
perfect = "Die Blüten schwächen die Heilung nicht mehr, sie verschwinden nach kurzer Zeit."
tell = "Bleichblumen und Seelenpartikel steigen aus dem Todesort auf."
control = "Töten Sie eine natürliche feindliche Menge auf natürlichen Boden."

[mutation.type.resonant_formula]
name = "Resonanzformel"
benefit = "Schmieren, brauen und verzaubern Sie einmal, um eine Kombination vorzubereiten."
burden = "Wenn Sie den gleichen Vorbereitungsschritt wiederholen, wird die Kombination gebrochen und Ihr ältestes hilfreiches Effekt entfernt."
perfect = "Wenn man einen Schritt wiederholt, wird die Kombination nicht mehr gebrochen."
tell = "Drei Symbole verbinden sich, wenn die Kombination fertig ist."
control = "Schmied, Brau und Zauber, jeder einmal, in jeder Reihenfolge."

