name: ${name}
main: art.arcane.adapt.Adapt
version: ${version}
authors:
  - NextdoorPsycho
  - Cyberpwn
  - Vatuu
api-version: '${apiVersion}'
folia-supported: true
softdepend:
  - PlaceholderAPI
  - WorldGuard
  - Factions
  - ChestProtect
  - Residence
  - HiddenOre

commands:
  adapt: { }

