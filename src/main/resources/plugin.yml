name: ${name}
main: art.arcane.adapt.Adapt
version: ${version}
authors:
  - NextdoorPsycho
  - Cyberpwn
  - Vatuu
website: VolmitSoftware.com
api-version: '${apiVersion}'
folia-supported: true
softdepend:
  - Gloss
  - PlaceholderAPI
  - WorldGuard
  - Factions
  - ChestProtect
  - Residence
  - GriefDefender
  - GriefPrevention
  - LockettePro
  - HiddenOre
  - Iris
  - Vault
  - AdvancedChests
  - MagicCosmetics

commands:
  adapt: { }

permissions:
  adapt.debugdump:
    description: Allows creating and optionally uploading diagnostic reports.
    default: op
  adapt.language.self:
    description: Allows choosing your own language for this plugin.
    default: true
  adapt.idontknowwhatimdoingiswear:
    description: This is for the Adapt Testing command DEVELOPERS ONLY
    default: op
  adapt.cheatitem:
    description: Allows for you to create a Cheat Item (one time use Xp Items)
    default: op
  adapt.boost:
    description: Allows for you to use the Boost command to boost XP gains
    default: op
  adapt.boost.global:
    description: Allows boosting XP gains for every player on the server
    default: op
  adapt.main:
    description: Allows for you to use the main command
    default: op
  adapt.gui:
    description: Allows opening the Adapt GUI via /adapt gui
    default: op
  adapt.determine:
    description: Allows directly assigning skill lines and adaptations to players
    default: op
  adapt.debug:
    description: Allows Adapt debug tools including debug mode and config migration
    default: op
  adapt.configurator:
    description: Allows using the config editor and resetting configs to defaults
    default: op
  adapt.effects:
    description: Allows toggling Adapt effect visibility for yourself
    default: true
  adapt.mutations:
    description: Allows using personal experimental Mutations after the server opts in
    default: true
  adapt.mutations.admin:
    description: Allows inspecting and managing experimental Mutation state
    default: op
  adapt.clear:
    description: Allows clearing player progression data
    default: op
