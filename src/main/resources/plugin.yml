  adapt.idontknowwhatimdoingiswear:
    description: This is for the Adapt Testing command DEVELOPERS ONLY
    default: op
  adapt.listboosts:
    description: Allows for you to view the boosts on a player
    default: op
  adapt.opengui:
    description: Open the GUI without needing a Bookshelf
    default: op
  adapt.cheatitem:
    description: Allows for you to create a Cheat Item (one time use Xp Items)
    default: op
  adapt.boost:
    description: Allows for you to use the Boost command to boost XP gains
    default: op
  adapt.main:
    description: Allows for you to use the main command
    default: op
  adapt.configurator:
    description: Allows opening and using the in-game Adapt config editor
    default: op
  adapt.config:
    description: Legacy alias for adapt.configurator
    default: false
    children:
      adapt.configurator: true
  adapt.clear:
    description: Allows clearing player progression data
    default: op
