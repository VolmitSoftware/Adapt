# Adapt — fr_FR
#
# === Modification du fichier ===
# plugins/Adapt/languages/fr_FR.toml
# Modifiez ce fichier directement. Les modifications locales sont conservées ; les entrées manquantes ou invalides utilisent l'anglais intégré.
# /adapt language server edit fr_FR
#
# === Préfixe ===
# Les préfixes de commande sont appliqués par le moteur de commandes. {prefix} est le préfixe d'une valeur statistique.
#
# === Formatage ===
# Couleurs : &0-&f, &k-&r, &#RRGGBB et MiniMessage. Les dégradés entre crochets suivent automatic-gradients.
# Les listes conservent l'ordre de leurs lignes ; les tables de pluriels utilisent les formes fournies dans le catalogue anglais.
#
# === Variables ===
# Conservez les noms de variables inchangés et utilisez uniquement les variables appartenant à chaque message.
#   {adaptation}  Nom de l'Adaptation
#   {after}  Valeur après modification
#   {amount}  Montant de monnaie, de Connaissance ou d'expérience
#   {argument}  Argument de commande inattendu
#   {available}  Puissance ou Connaissance disponible
#   {before}  Valeur avant modification
#   {block}  Bloc nommé dans les instructions de progrès
#   {bonus}  Montant du bonus de Chef-d'œuvre
#   {category}  Nom de la catégorie de configuration
#   {chance}  Probabilité d'activation
#   {combo}  Combinaison de déclenchement de Rappel Instantané
#   {command}  Chemin de la commande
#   {cost}  Coût en Connaissance
#   {count}  Nombre d'objets, de fichiers ou de messages
#   {damage}  Montant des dégâts ajoutés
#   {danger}  Avertissement de danger du Portail de Faille
#   {description}  Description du progrès
#   {direction}  Direction vers une structure
#   {distance}  Distance vers une structure en blocs
#   {duration}  Durée ou temps de recharge formaté
#   {effect}  Nom de l'effet de potion
#   {enchantment}  Nom de l'enchantement
#   {environment}  Environnement affectant une capacité
#   {error}  Détails de l'erreur de configuration
#   {experience}  Expérience stockée dans un orbe
#   {file}  Nom du fichier de configuration
#   {first}  Premier groupe de compétences ou composant de déclenchement
#   {from}  Premier index d'entrée sur une page
#   {group}  Catégorie de l'éditeur de langue
#   {hits}  Recherches fructueuses dans le cache
#   {instruction}  Instruction de déblocage du progrès
#   {key}  Clé de message ou de configuration
#   {knowledge}  Montant de Connaissance
#   {label}  Libellé du paramètre ou de la statistique
#   {level}  Niveau de Compétence, d'Adaptation ou d'effet
#   {levels}  Niveaux d'expérience économisés
#   {line}  Numéro de ligne du message de langue
#   {locale}  Code de langue
#   {maximum}  Valeur maximale autorisée ou limite de Puissance
#   {microsPerCheck}  Microsecondes passées par vérification de capacité
#   {millisPerSecond}  Millisecondes passées à vérifier les capacités par seconde
#   {minimum}  Valeur minimale autorisée
#   {misses}  Recherches dans le cache sans résultat stocké
#   {multiplier}  Multiplicateur de bonus d'expérience
#   {needed}  Puissance ou Connaissance requise
#   {newValue}  Nouvelle valeur de configuration
#   {nextLevel}  Affichage du prochain niveau de compétence
#   {oldValue}  Ancienne valeur de configuration
#   {page}  Numéro de la page actuelle
#   {pages}  Nombre total de pages
#   {parameter}  Nom du paramètre de commande
#   {parameters}  Paramètres de commande ignorés
#   {particle}  Nom du type de particule
#   {path}  Chemin de configuration
#   {perMinute}  Vérifications de capacité par minute
#   {perSecond}  Vérifications de capacité par seconde
#   {percent}  Pourcentage du budget temporel ou bonus d'expérience
#   {permission}  Nœud de permission requis
#   {personal}  Code de langue personnelle
#   {player}  Joueur recevant l'action
#   {plugin}  Nom du plugin
#   {power}  Montant ou consommation de Puissance
#   {prefix}  Préfixe de valeur statistique
#   {progress}  Affichage de la progression de la compétence
#   {range}  Portée de recherche ou de capacité en blocs
#   {ratio}  Taux de réussite du cache
#   {reason}  Explication de l'erreur de l'éditeur
#   {refund}  Connaissance remboursée lors de l'oubli
#   {remaining}  Nombre de modifications de configuration omises
#   {second}  Second groupe de compétences ou composant de déclenchement
#   {seconds}  Durée en secondes
#   {section}  Section de l'éditeur de langue
#   {separator}  Séparateur entre la valeur statistique et le libellé
#   {skill}  Nom de la Compétence
#   {slots}  Nombre d'emplacements de sac à dos
#   {stacks}  Cumuls d'effet ou capacité de piles du sac à dos
#   {state}  État d'activation
#   {strength}  Solidité d'armure ajoutée
#   {structure}  Nom de la structure localisée
#   {surface}  Surface affectant le déclenchement
#   {symbol}  Symbole indicateur de structure
#   {target}  Joueur cible ou plugin de langue
#   {timestamp}  Horodatage de l'archive de configuration
#   {to}  Dernier index d'entrée sur une page
#   {total}  Nombre total d'entrées ou d'emplacements
#   {trigger}  Condition d'activation de la capacité
#   {type}  Type de paramètre ou de valeur attendu
#   {used}  Puissance utilisée ou emplacements occupés
#   {value}  Valeur actuelle du paramètre ou de la statistique
#   {values}  Valeurs de paramètre autorisées
#   {variables}  Variables de message autorisées
#   {window}  Fenêtre de mesure des performances en millisecondes
#   {x}  Coordonnée X cible
#   {xp}  Montant d'expérience
#   {z}  Coordonnée Z cible

