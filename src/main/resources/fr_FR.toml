# Adapt language overlay: fr_FR

[mutation.domain]
body = "Corps"
hunt = "Chasse"
industry = "Industrie"
wild = "Nature"
craft = "Artisanat"
anomaly = "Anomalie"

[mutation.type.gale_lung]
name = "Poumon de Bourrasque"
benefit = "Se déplacer remplit l'Élan. Lorsque l'Élan est au maximum, votre prochaine attaque repousse ou repositionne la cible."
burden = "Les ennemis vous repoussent plus violemment tant que l'Élan est au maximum. Bloquer une attaque vide l'Élan."
perfect = "Les ennemis ne vous repoussent plus violemment. Bloquer une attaque vide toujours l'Élan."
tell = "Un vent turquoise se rassemble autour de vos pieds et de votre arme."
control = "Restez en mouvement pour remplir l'Élan, puis portez un coup."

[mutation.type.bastion_spine]
name = "Échine du Bastion"
benefit = "Rester immobile accumule de la Stabilité. Votre prochain coup porté avec un bouclier, une hache ou à mains nues déclenche une courte poussée."
burden = "Lorsque vous êtes ancré, vous ne pouvez ni sprinter ni sauter. Un coup dans le dos rompt votre posture."
perfect = "Vous pouvez sprinter et sauter tout en restant ancré. Les coups dans le dos peuvent encore rompre votre posture."
tell = "Des côtes de pierre et des fissures lumineuses révèlent la force emmagasinée."
control = "Restez immobile au sol, puis frappez avec un bouclier, une hache ou à mains nues."

[mutation.type.verdant_molt]
name = "Mue Verdoyante"
benefit = "Accroupissez-vous sans bouger sur un sol naturel pour dissiper les effets néfastes."
burden = "Cela dissipe aussi les effets bénéfiques, consomme des points de faim et empêche brièvement l'application de nouveaux effets."
perfect = "Les effets bénéfiques et les points de faim ne sont plus perdus. Le bref blocage des effets demeure."
tell = "Des feuilles, des écailles ou des spores jaillissent de votre corps."
control = "Restez accroupi et immobile sur un sol naturel."

[mutation.type.temperbound]
name = "Lien Trempé"
benefit = "Liez un ensemble d'armure afin que ses pièces partagent leur durabilité. Une pièce qui devrait se briser devient Fissurée à la place."
burden = "Retirer ou remplacer une pièce liée désactive brièvement l'ensemble."
perfect = "Changer d'armure ne désactive plus l'ensemble. Un seul ensemble peut rester lié."
tell = "Des lignes lumineuses relient les pièces d'armure liées."
control = "Dans une bibliothèque Adapt, portez quatre pièces d'armure que vous avez fabriquées et choisissez « Lier l'armure actuelle »."

[mutation.type.paradox_scar]
name = "Cicatrice Paradoxale"
benefit = "Un déplacement long ou une téléportation laisse un point de retour. Vous pouvez y revenir une fois."
burden = "Le point de retour est visible, empêche la formation d'un autre point et peut être détruit par les ennemis."
perfect = "Il ne bloque plus les autres effets de retour de Mutation. Les ennemis peuvent toujours le détruire."
tell = "Une rémanence lumineuse marque le point de retour."
control = "Après un long déplacement ou une téléportation, accroupissez-vous et permutez vos mains pour revenir."

[mutation.type.arsenal_cortex]
name = "Cortex de l'Arsenal"
benefit = "Changer de type d'arme ou d'outil entre deux coups transmet un effet de contrôle au coup suivant."
burden = "Utiliser deux fois de suite le même type verrouille brièvement l'enchaînement."
perfect = "Répéter un type ne verrouille plus l'enchaînement. Il faut toujours changer de type pour l'accumuler."
tell = "Un symbole changeant tourne autour de l'objet tenu."
control = "Portez des coups avec différents types d'armes ou d'outils."

[mutation.type.packmind]
name = "Esprit de Meute"
benefit = "Votre premier coup marque une cible. Vos familiers et les alliés ayant choisi de participer accumulent du Tempo en la frappant eux aussi."
burden = "Vos dégâts sont réduits jusqu'à ce qu'un autre participant se joigne à vous. Le Tempo accumulé en solo se dissipe rapidement."
perfect = "Vos dégâts ne sont plus réduits pendant l'attente. Le Tempo nécessite toujours un autre participant."
tell = "Des lignes ambrées relient le groupe à la cible marquée."
control = "Frappez une cible, puis faites-la attaquer par un familier ou un allié ayant choisi de participer."

[mutation.type.trophy_crucible]
name = "Creuset de Trophées"
benefit = "Les créatures apparues naturellement peuvent laisser tomber des trophées. Utilisez-en un pour préparer un effet de contrôle contre ce type de créature."
burden = "Ce type de créature vous repère plus facilement et voit à travers la furtivité de Mutation."
perfect = "La détection supplémentaire est supprimée. Vous ne pouvez toujours conserver qu'un seul effet de trophée."
tell = "Un masque représentant le type de créature conservé apparaît derrière vous."
control = "Accroupissez-vous et faites un clic droit sur un établi en tenant un trophée naturel."

[mutation.type.umbral_echo]
name = "Écho Ombral"
benefit = "Attaquer sous un nouvel angle ou avec un nouveau type d'arme répète, après un délai, un effet de contrôle affaibli."
burden = "Répéter la même approche vous révèle et désactive brièvement la furtivité."
perfect = "Répéter une approche ne vous révèle plus. De nouveaux angles ou types d'armes restent nécessaires."
tell = "Une rémanence violet foncé répète l'effet de contrôle."
control = "Changez d'angle d'attaque ou de type d'arme entre deux coups."

[mutation.type.living_lattice]
name = "Treillis Vivant"
benefit = "Récolter et replanter génère de la Charge Racinaire. Dépensez-la pour faire pousser un court chemin temporaire."
burden = "Le feu et la lave peuvent vider votre charge, et un effondrement forcé consomme des points de faim."
perfect = "Le feu et la lave ne vident plus la charge. Les chemins disparaissent toujours."
tell = "Les racines vertes brunissent avant que le chemin disparaisse."
control = "Récoltez et replantez, puis accroupissez-vous et faites un clic droit en tenant une pousse d'arbre."

[mutation.type.masterwork_bond]
name = "Lien de Chef-d'œuvre"
benefit = "Liez un outil que vous avez fabriqué. Au lieu de se briser, il s'arrête à un point de durabilité et doit être réparé avant de servir de nouveau."
burden = "Seul l'outil lié est protégé. Si vous le perdez, vous devez attendre avant d'en lier un autre."
perfect = "Les autres outils fonctionnent normalement avec les effets de Mutation. Seul le Chef-d'œuvre évite de se briser."
tell = "Les runes de l'outil se fissurent lorsqu'il approche de la rupture."
control = "Dans une bibliothèque Adapt, tenez un outil que vous avez fabriqué et choisissez « Lier l'outil tenu »."

[mutation.type.deepblood]
name = "Sang des Profondeurs"
benefit = "Miner des blocs naturels dans les grandes profondeurs accumule de la Charge des Profondeurs. Elle alimente la guérison et sauve un outil lié."
burden = "Se soigner sous terre consomme de la Charge des Profondeurs, et la charge diminue lentement à la surface."
perfect = "La guérison sous terre fonctionne même sans charge. Sauver l'outil lié consomme toujours de la charge."
tell = "Des fissures rouges se répandent sur vous et l'outil lié à mesure que la charge augmente."
control = "Minez des blocs naturels dans les grandes profondeurs et liez un outil dans une bibliothèque Adapt."

[mutation.type.mycelial_nerve]
name = "Nerf Mycélien"
benefit = "Les effets bénéfiques que vous vous appliquez se propagent, sous une forme atténuée, aux joueurs proches ayant choisi de participer et à vos familiers."
burden = "Votre propre effet dure moins longtemps, et subir des dégâts de feu rompt le lien."
perfect = "Votre effet conserve toute sa durée et le feu ne rompt plus le lien."
tell = "Des traînées de spores transmettent les effets copiés aux alliés proches."
control = "Appliquez-vous un effet bénéfique près de joueurs ayant choisi de participer ou de familiers qui vous appartiennent."

[mutation.type.gravebloom]
name = "Floraison Funéraire"
benefit = "Tuer une créature hostile apparue naturellement peut créer une floraison éphémère qui fait pousser les cultures et soigne vos familiers."
burden = "Les floraisons actives réduisent votre guérison naturelle, et les plus anciennes attirent les créatures hostiles."
perfect = "Les floraisons ne réduisent plus votre guérison. Elles disparaissent toujours après un court moment."
tell = "Des fleurs pâles et des particules d'âme s'élèvent du lieu de la mort."
control = "Tuez une créature hostile apparue naturellement sur un sol naturel."

[mutation.type.resonant_formula]
name = "Formule Résonante"
benefit = "Effectuez une fabrication, une préparation de potion et un enchantement pour préparer un enchaînement. Votre prochain effet d'Anomalie non offensif se répète à mi-puissance."
burden = "Répéter la même étape de préparation rompt l'enchaînement et supprime votre effet bénéfique le plus ancien."
perfect = "Répéter une étape ne rompt plus l'enchaînement. Les trois étapes différentes restent nécessaires."
tell = "Trois symboles se rejoignent lorsque l'enchaînement est prêt."
control = "Effectuez une fabrication, une préparation de potion et un enchantement, dans l'ordre de votre choix."

