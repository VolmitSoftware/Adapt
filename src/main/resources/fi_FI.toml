# Adapt language overlay: fi_FI

[mutation.domain]
body = "Keho"
hunt = "Metsästys"
industry = "Teollisuus"
wild = "Luonnonvaraiset"
craft = "Alus"
anomaly = "Anomalia"

[mutation.type.gale_lung]
name = "Gale Lung"
benefit = "Liikkuminen täyttää hetken. Täydellä hetkellä seuraava osuma työntää tai asettaa kohteen uudelleen."
burden = "Viholliset työntävät kovemmin kun Momentum on täynnä. Estäminen tyhjentää sen."
perfect = "Viholliset eivät enää työnnä sinua kovemmaksi."
tell = "Teal tuuli kerääntyy ympärille jalat ja aseet."
control = "Jatka matkaa täyttääksesi Momentumin, sitten osuma."

[mutation.type.bastion_spine]
name = "Bastion Spine"
benefit = "Seisominen lisää vakautta. Seuraava kilpi, kirves tai aseeton osuma lähettää lyhyen työn."
burden = "Kun olet varustettu, et voi juosta tai hypätä. Hitti takaa rikkoo asentoa."
perfect = "Voit hypätä ja sprintata, kun olet varustunut."
tell = "Kivikyljet ja kirkkaat halkeamat osoittavat tallennetun voiman."
control = "Seiso paikallasi, iske sitten kilvellä, kirveellä tai tyhjällä kädellä."

[mutation.type.verdant_molt]
name = "Verdant Molt"
benefit = "Livahda liikkumatta luonnollisella maalla selvittää haitallisia vaikutuksia."
burden = "Se myös poistaa hyödyllisiä vaikutuksia, maksaa nälkää ja estää lyhyesti uusia vaikutuksia."
perfect = "Hyödylliset vaikutukset ja nälkä eivät enää katoa. Lyhyt vaikutuskatkos pysyy."
tell = "Lehdet, suomut tai itiöt puhkesivat sinusta."
control = "Pidä vartioituna ja pysy rauhassa."

[mutation.type.temperbound]
name = "Karkea"
benefit = "Yhdistäkää yksi panssari, jotta palaset jakaisivat kestävyyden."
burden = "Yhdistetyn kappaleen poistaminen tai vaihtaminen poistaa sarjan käytöstä lyhyeksi ajaksi."
perfect = "Vaihtoehtoinen panssari ei enää toimi."
tell = "Glowing linjat liittää linkeissä panssari kappaletta."
control = "Adapt-kirjastoilla, käytä neljä käsityötehtävää panssaria ja valitse linkkivirtainen panssari."

[mutation.type.paradox_scar]
name = "Paradoksaalinen arpi"
benefit = "Pitkä liikkuvuus tai teleportti jättää palautumispisteen."
burden = "Palautuspiste on näkyvissä, estää toisen muodostaa, ja viholliset voivat rikkoa sen."
perfect = "Se ei enää estä muuttiomahdollisuuksia."
tell = "Kirkas jälkikuva merkitsee paluupaikan."
control = "Pitkän siirron tai teleportauksen jälkeen livahtaa ja vaihtaa kädet palata."

[mutation.type.arsenal_cortex]
name = "Arsenal Cortex"
benefit = "Ase- tai työkalutyyppien muuttaminen osumien välillä kuljettaa yhden hallintavaikutuksen seuraavaan osumaan."
burden = "Käyttämällä samaa tyyppiä kahdesti lukitsee yhdistelmä lyhyen aikaa."
perfect = "Toistan tyypin, joka ei enää lukitse yhdistelmää. Sen rakentamiseen tarvitaan vielä vaihtotyyppejä."
tell = "Muuttuva symboli pyörii hallussa olevan kohteen ympäri."
control = "Maahyökkäykset eri ase- tai työkalutyypeillä."

[mutation.type.packmind]
name = "Pakkaus"
benefit = "Ensimmäinen isku merkitsee kohteen."
burden = "Vaurioita on pienempi, kunnes joku muu liittyy."
perfect = "Tempo tarvitsee vielä toisen osallistujan."
tell = "Amber-linjat liittävät ryhmän merkittyyn kohteeseen."
control = "Osuma kohde, sitten lemmikki tai valittu liittolainen hyökkää sitä myös."

[mutation.type.trophy_crucible]
name = "Trophy Crucible"
benefit = "Luonnollinen väkijoukko voi pudottaa palkintoja. Käytä yhtä valmistaaksesi kontrollivaikutuksen tuota mobityyppiä vastaan."
burden = "Se mafiotyyppi havaitsee sinut helpommin ja näkee mutation stealthin läpi."
perfect = "Lisähavainto poistetaan. Voit silti säilyttää vain yhden palkintovaikutuksen."
tell = "Peitto, joka näyttää varastoitujen mobin tyyppiä, näkyy taakse."
control = "Napsauta oikealle käsityöpöytää pidellessäsi luonnollista palkintoa."

[mutation.type.umbral_echo]
name = "Umbral Echo"
benefit = "Hyökkäys uudesta kulmasta tai uudella asetyypillä, joka toistaa heikomman kontrollivaikutuksen viivästymisen jälkeen."
burden = "Toistamalla samaa lähestymistapaa paljastetaan sinut ja suljetaan lyhyen ajan piiloudelu."
perfect = "Toistaessa lähestymistapa ei enää paljasta sinua."
tell = "Tumman violetti jälkikuva toistaa kontrolliefektin."
control = "Muuta hyökkäyskulmaa tai asetyyppiä osumien välillä."

[mutation.type.living_lattice]
name = "Living Lattice"
benefit = "Sadonkorjuu ja uudelleenistutus ansaitsee juurimaksua. Käytä se kasvaa lyhyt väliaikainen polku."
burden = "Tuli ja laava voivat pyyhkiä laskusi, - ja pakko romahtaminen maksaa nälkää."
perfect = "Tuli ja laava eivät enää pyyhki latausta."
tell = "Vihreät juuret muuttuvat ruskeiksi ennen kuin polku katoaa."
control = "Sadonkorjuu ja uudelleenistutus, sitten napsauta oikeaa napsauttamalla pidellessäsi taimia."

[mutation.type.masterwork_bond]
name = "Masterwork Bond"
benefit = "Se pysähtyy yhden kestävyyden sijaan, että se rikkoisi ja sen on korjattava ennen käyttöä."
burden = "Vain sidottu työkalu saa suojan. Jos se katoaa, sinun on odotettava ennen sitomista toiseen."
perfect = "Muut työkalut toimivat normaalisti mutaation vaikutuksesta. Vain Masterwork välttelee murtumia."
tell = "Runs on työkalu halkeama kun se lähestyy rikkoa."
control = "Adapt-kirjastolassa, pidä työkalu jonka olet tehnyt ja valitse sitoutunut työkalu."

[mutation.type.deepblood]
name = "Syväveri"
benefit = "Kaivos luonnon lohkot syvällä maanalainen rakentaa syvä maksu. Se voi parantaa ja pelastaa yhden sidotun työkalun."
burden = "Maanalainen paraneminen kuluttaa Deep Chargen ja lataus valuu hitaasti maan päälle."
perfect = "Maanalainen paraneminen toimii nollalatauksella. Sidotun työkalun pelastaminen maksaa edelleen."
tell = "Punaiset reiät leviää sinuun ja sidottu työkalu, kun laite rakentaa."
control = "Oma luonnollinen syvä lohkoja ja sitoa yksi työkalu at Adapt kirjahylly."

[mutation.type.mycelial_nerve]
name = "Mycelial Nerve"
benefit = "Hyödyllisiä vaikutuksia annat itse levitä heikompi muodossa lähellä valittu-pelaajia ja lemmikkejä."
burden = "Oma vaikutus kestää vähemmän aikaa, ja ottaa palovahingot murtaa linkin."
perfect = "Sinun vaikutus pitää koko ajan eikä tuli enää riko linkkiä."
tell = "Isännät kuljettavat kopioituja tehosteita läheisille liittolaisille."
control = "Anna itsellesi hyödyllinen vaikutus lähellä valittu-in pelaajia tai omistanut lemmikkejä."

[mutation.type.gravebloom]
name = "Haudankukki"
benefit = "Luonnollisen vihamielisen mobin tappaminen voi luoda lyhytikäisen kukan, joka kasvattaa kasveja ja parantaa lemmikkisi."
burden = "Aktiiviset kukat heikentävät luonnollista paranemista, ja vanhemmat kukat houkuttelevat vihamielisiä väkijoukkoja."
perfect = "Kukkaset eivät enää heikentä paranemista, vaan häviävät vielä lyhyen ajan kuluttua."
tell = "Kalpeat kukat ja sielun hiukkaset nousevat kuolinpaikalta."
control = "Tappaa luonnollinen vihamielinen mobi luonnon maassa."

[mutation.type.resonant_formula]
name = "Resonantin kaava"
benefit = "Craft, olut ja lumous kerran kukin valmistaa yhdistelmä. Seuraava ei-vahingollinen Anomaly vaikutus toistuu puoli voimaa."
burden = "Toistaen saman prep askel rikkoo combo ja poistaa vanhin hyödyllinen vaikutus."
perfect = "Toistan askelta ei enää riko yhdistelmä. Tarvitset vielä kaikki kolme eri vaihetta."
tell = "Kolme symbolia yhdistyvät, kun yhdistelmä on valmis."
control = "Käsityö, olut ja lumous kerran kukin, missä tahansa järjestyksessä."

