[mutation.domain]
body = "Kūnas"
hunt = "Medžioklė"
industry = "Pramonė"
wild = "Laukinė gamta"
craft = "Amatas"
anomaly = "Anomalija"

[mutation.type.gale_lung]
name = "Vėtros plautis"
benefit = "Judėdami kaupiate Pagreitį. Kai Pagreitis pilnas, kitas jūsų smūgis nustumia taikinį arba pakeičia jo padėtį."
burden = "Kai Pagreitis pilnas, priešai jus nustumia stipriau. Blokavimas jį ištuština."
perfect = "Priešai jūsų nebestumia stipriau. Blokavimas vis tiek ištuština Pagreitį."
tell = "Žalsvai mėlynas vėjas renkasi aplink jūsų kojas ir ginklą."
control = "Nesustokite judėti, kad pripildytumėte Pagreitį, tada smogkite."

[mutation.type.bastion_spine]
name = "Bastiono stuburas"
benefit = "Stovint vietoje kaupiasi Stabilumas. Kitas smūgis skydu, kirviu arba plika ranka sukelia trumpą nustūmimą."
burden = "Įsitvirtinę negalite sprintuoti ar šokinėti. Smūgis iš nugaros nutraukia stovėseną."
perfect = "Įsitvirtinę galite sprintuoti ir šokinėti. Smūgiai iš nugaros vis tiek gali nutraukti stovėseną."
tell = "Akmeniniai šonkauliai ir ryškūs įtrūkimai parodo sukauptą jėgą."
control = "Stovėkite vietoje ant žemės, tada smogkite skydu, kirviu arba plika ranka."

[mutation.type.verdant_molt]
name = "Žaliasis nėrimasis"
benefit = "Pritūpkite nejudėdami ant natūralaus paviršiaus, kad pašalintumėte žalingus efektus."
burden = "Tai taip pat pašalina naudingus efektus, sunaudoja alkio taškų ir trumpam neleidžia gauti naujų efektų."
perfect = "Naudingi efektai ir alkio taškai nebeprarandami. Trumpas efektų blokavimas išlieka."
tell = "Lapai, žvynai arba sporos išsiveržia nuo jūsų kūno."
control = "Laikykite pritūpimo klavišą ir nejudėkite ant natūralaus paviršiaus."

[mutation.type.temperbound]
name = "Grūdintas ryšys"
benefit = "Susiekite vieną šarvų komplektą, kad jo dalys dalytųsi patvarumu. Dalis, kuri turėtų sulūžti, vietoj to tampa Įtrūkusi."
burden = "Nusiėmus arba pakeitus susietą dalį, komplektas trumpam išjungiamas."
perfect = "Keičiant šarvus komplektas nebeišjungiamas. Susietas gali likti tik vienas komplektas."
tell = "Švytinčios linijos sujungia susietas šarvų dalis."
control = "Prie Adapt knygų lentynos apsivilkite keturias savo pagamintas šarvų dalis ir pasirinkite „Susieti dabartinius šarvus“."

[mutation.type.paradox_scar]
name = "Paradokso randas"
benefit = "Tolimas judėjimas arba teleportacija palieka grįžimo tašką. Į jį galite sugrįžti vieną kartą."
burden = "Grįžimo taškas yra matomas, neleidžia susidaryti kitam, o priešai gali jį sunaikinti."
perfect = "Jis nebetrukdo kitiems Mutacijos grįžimo efektams. Priešai vis tiek gali jį sunaikinti."
tell = "Ryškus atvaizdas žymi grįžimo tašką."
control = "Po tolimo judėjimo ar teleportacijos pritūpkite ir sukeiskite rankas, kad grįžtumėte."

[mutation.type.arsenal_cortex]
name = "Arsenalo žievė"
benefit = "Tarp smūgių pakeitus ginklo ar įrankio tipą, vienas valdymo efektas perkeliamas į kitą smūgį."
burden = "Du kartus iš eilės panaudojus tą patį tipą, kombinacija trumpam užrakinama."
perfect = "Pakartojus tipą kombinacija nebeužrakinama. Jai kaupti vis tiek reikia keisti tipus."
tell = "Besikeičiantis simbolis sukasi aplink laikomą daiktą."
control = "Smogkite skirtingų tipų ginklais arba įrankiais."

[mutation.type.packmind]
name = "Gaujos protas"
benefit = "Pirmasis jūsų smūgis pažymi taikinį. Augintiniai ir dalyvauti sutikę sąjungininkai taip pat jį puldami kaupia Tempą."
burden = "Jūsų žala mažesnė, kol neprisijungia kas nors kitas. Vienumoje sukauptas Tempas greitai išblėsta."
perfect = "Laukiant jūsų žala nebesumažėja. Tempui vis tiek reikia dar vieno dalyvio."
tell = "Gintarinės linijos sujungia grupę su pažymėtu taikiniu."
control = "Smogkite taikiniui, tada leiskite jį pulti augintiniui arba dalyvauti sutikusiam sąjungininkui."

[mutation.type.trophy_crucible]
name = "Trofėjų tiglis"
benefit = "Natūraliai atsiradę padarai gali palikti trofėjų. Panaudokite vieną, kad paruoštumėte valdymo efektą prieš tos rūšies padarus."
burden = "Tos rūšies padarai jus lengviau pastebi ir mato pro Mutacijos suteiktą slaptumą."
perfect = "Papildomas aptikimas pašalinamas. Vis tiek galite saugoti tik vieną trofėjaus efektą."
tell = "Už jūsų pasirodo kaukė, rodanti išsaugotą padaro rūšį."
control = "Laikydami natūralų trofėjų pritūpkite ir dešiniuoju pelės mygtuku spustelėkite darbastalį."

[mutation.type.umbral_echo]
name = "Ūksmės aidas"
benefit = "Atakuojant nauju kampu arba naujo tipo ginklu, po delsos pakartojamas silpnesnis valdymo efektas."
burden = "Pakartojus tą patį puolimo būdą, tampate matomi ir trumpam prarandate slaptumą."
perfect = "Pakartojus puolimo būdą nebepasirodote. Vis tiek reikia naujų kampų arba ginklų tipų."
tell = "Tamsiai violetinis atvaizdas pakartoja valdymo efektą."
control = "Tarp smūgių pakeiskite puolimo kampą arba ginklo tipą."

[mutation.type.living_lattice]
name = "Gyvasis tinklas"
benefit = "Derliaus nuėmimas ir atsodinimas kaupia Šaknų krūvį. Išleiskite jį, kad išaugintumėte trumpą laikiną taką."
burden = "Ugnis ir lava gali panaikinti visą krūvį, o priverstinė tako griūtis kainuoja alkio taškų."
perfect = "Ugnis ir lava krūvio nebepanaikina. Takai vis tiek išnyksta."
tell = "Žalios šaknys paruduoja prieš takui išnykstant."
control = "Nuimkite derlių ir atsodinkite, tada laikydami sodinuką pritūpkite ir spustelėkite dešiniuoju pelės mygtuku."

[mutation.type.masterwork_bond]
name = "Šedevro ryšys"
benefit = "Susiekite vieną savo pagamintą įrankį. Užuot sulūžęs, jis sustoja ties vienu patvarumo tašku ir prieš vėl naudojant turi būti sutaisytas."
burden = "Apsaugomas tik susietas įrankis. Jį praradę turite palaukti prieš susiedami kitą."
perfect = "Kiti įrankiai su Mutacijos efektais veikia įprastai. Tik Šedevras nesulūžta."
tell = "Įrankiui artėjant prie lūžimo, jo runos suskyla."
control = "Prie Adapt knygų lentynos laikykite savo pagamintą įrankį ir pasirinkite „Susieti laikomą įrankį“."

[mutation.type.deepblood]
name = "Gelmių kraujas"
benefit = "Kasant natūralius blokus giliai po žeme kaupiasi Gelmių krūvis. Jis suteikia gydymą ir išgelbsti vieną susietą įrankį."
burden = "Gydymas po žeme naudoja Gelmių krūvį, o virš žemės krūvis lėtai senka."
perfect = "Gydymas po žeme veikia ir be krūvio. Susieto įrankio išgelbėjimas vis tiek naudoja krūvį."
tell = "Kaupiantis krūviui, raudoni įtrūkimai plinta per jus ir susietą įrankį."
control = "Kaskite natūralius blokus giliai po žeme ir susiekite vieną įrankį prie Adapt knygų lentynos."

[mutation.type.mycelial_nerve]
name = "Grybienos nervas"
benefit = "Naudingi efektai, kuriuos suteikiate sau, silpnesni išplinta netoliese esantiems dalyvauti sutikusiems žaidėjams ir augintiniams."
burden = "Jūsų efektas trunka trumpiau, o ugnies žala nutraukia ryšį."
perfect = "Jūsų efektas išlaiko visą trukmę, o ugnis ryšio nebenutraukia."
tell = "Sporų pėdsakai perduoda nukopijuotus efektus netoliese esantiems sąjungininkams."
control = "Suteikite sau naudingą efektą šalia dalyvauti sutikusių žaidėjų arba savo augintinių."

[mutation.type.gravebloom]
name = "Kapų žiedas"
benefit = "Nužudžius natūraliai atsiradusį priešišką padarą gali trumpam pražysti žiedas, kuris augina pasėlius ir gydo jūsų augintinius."
burden = "Aktyvūs žiedai susilpnina natūralų jūsų gydymą, o senesni pritraukia priešiškus padarus."
perfect = "Žiedai jūsų gydymo nebesusilpnina. Jie vis tiek greitai išnyksta."
tell = "Blyškios gėlės ir sielų dalelės kyla iš žūties vietos."
control = "Nužudykite natūraliai atsiradusį priešišką padarą ant natūralaus paviršiaus."

[mutation.type.resonant_formula]
name = "Rezonansinė formulė"
benefit = "Po vieną kartą ką nors pagaminkite, išvirkite eliksyrą ir užkerėkite, kad paruoštumėte kombinaciją. Kitas žalos nedarantis Anomalijos efektas pasikartoja puse galios."
burden = "Pakartojus tą patį paruošimo veiksmą, kombinacija nutrūksta ir pašalinamas seniausias naudingas efektas."
perfect = "Pakartojus veiksmą kombinacija nebenutrūksta. Vis tiek reikia visų trijų skirtingų veiksmų."
tell = "Paruošus kombinaciją trys simboliai susijungia."
control = "Bet kokia tvarka po vieną kartą ką nors pagaminkite, išvirkite eliksyrą ir užkerėkite."

