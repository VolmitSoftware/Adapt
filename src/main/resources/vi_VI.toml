# Adapt language overlay: vi_VI

[mutation.domain]
body = "Cơ thể"
hunt = "Săn bắt"
industry = "Công nghiệp"
wild = "Hoang dã"
craft = "Chế tác"
anomaly = "Dị thường"

[mutation.type.gale_lung]
name = "Phổi Cuồng Phong"
benefit = "Di chuyển sẽ tích Đà. Khi Đà đầy, đòn đánh tiếp theo của bạn sẽ đẩy hoặc đổi vị trí mục tiêu."
burden = "Khi Đà đầy, kẻ địch đẩy lùi bạn mạnh hơn. Đỡ đòn sẽ xóa hết Đà."
perfect = "Kẻ địch không còn đẩy lùi bạn mạnh hơn. Đỡ đòn vẫn xóa hết Đà."
tell = "Gió xanh ngọc tụ lại quanh chân và vũ khí của bạn."
control = "Tiếp tục di chuyển để tích đầy Đà, sau đó đánh trúng mục tiêu."

[mutation.type.bastion_spine]
name = "Cột Sống Pháo Đài"
benefit = "Đứng yên sẽ tích Ổn Định. Đòn tiếp theo bằng khiên, rìu hoặc tay không sẽ tạo một cú đẩy ngắn."
burden = "Khi đang trụ thế, bạn không thể chạy nước rút hoặc nhảy. Bị đánh từ phía sau sẽ phá thế."
perfect = "Bạn có thể chạy nước rút và nhảy khi đang trụ thế. Đòn đánh từ phía sau vẫn có thể phá thế."
tell = "Các xương sườn bằng đá và vết nứt sáng cho thấy sức mạnh bạn đã tích trữ."
control = "Đứng yên trên mặt đất, sau đó đánh bằng khiên, rìu hoặc tay không."

[mutation.type.verdant_molt]
name = "Lột Xác Xanh Tươi"
benefit = "Cúi người mà không di chuyển trên nền đất tự nhiên để xóa hiệu ứng bất lợi."
burden = "Việc này cũng xóa hiệu ứng có lợi, tiêu hao thanh đói và tạm thời ngăn hiệu ứng mới."
perfect = "Hiệu ứng có lợi và thanh đói không còn bị mất. Khoảng chặn hiệu ứng ngắn vẫn còn."
tell = "Lá cây, vảy hoặc bào tử bung ra khỏi cơ thể bạn."
control = "Giữ tư thế cúi người và đứng yên trên nền đất tự nhiên."

[mutation.type.temperbound]
name = "Liên Kết Tôi Luyện"
benefit = "Liên kết một bộ giáp để các mảnh dùng chung độ bền. Mảnh đáng lẽ bị vỡ sẽ chuyển sang trạng thái Nứt."
burden = "Cởi hoặc đổi một mảnh đã liên kết sẽ tạm thời vô hiệu hóa cả bộ."
perfect = "Đổi giáp không còn vô hiệu hóa cả bộ. Chỉ một bộ có thể duy trì liên kết."
tell = "Các đường sáng nối những mảnh giáp đã liên kết với nhau."
control = "Tại kệ sách Adapt, hãy mặc bốn mảnh giáp do bạn chế tạo rồi chọn “Liên kết bộ giáp hiện tại”."

[mutation.type.paradox_scar]
name = "Sẹo Nghịch Lý"
benefit = "Di chuyển xa hoặc dịch chuyển tức thời sẽ để lại một điểm quay về. Bạn có thể quay lại đó một lần."
burden = "Điểm quay về có thể nhìn thấy, ngăn điểm khác hình thành và có thể bị kẻ địch phá hủy."
perfect = "Nó không còn chặn các hiệu ứng quay về khác của Đột biến. Kẻ địch vẫn có thể phá hủy nó."
tell = "Một dư ảnh sáng đánh dấu điểm quay về."
control = "Sau khi di chuyển xa hoặc dịch chuyển, hãy cúi người và đổi vật phẩm giữa hai tay để quay lại."

[mutation.type.arsenal_cortex]
name = "Vỏ Não Kho Vũ Khí"
benefit = "Đổi loại vũ khí hoặc công cụ giữa các đòn đánh sẽ chuyển một hiệu ứng khống chế sang đòn kế tiếp."
burden = "Dùng cùng một loại hai lần liên tiếp sẽ khóa chuỗi đòn trong thời gian ngắn."
perfect = "Lặp lại một loại không còn khóa chuỗi đòn. Bạn vẫn phải đổi loại để tích chuỗi."
tell = "Một biểu tượng biến đổi xoay quanh vật phẩm đang cầm."
control = "Đánh trúng mục tiêu bằng nhiều loại vũ khí hoặc công cụ khác nhau."

[mutation.type.packmind]
name = "Tâm Trí Bầy Đàn"
benefit = "Đòn đầu tiên của bạn đánh dấu mục tiêu. Thú nuôi và đồng minh đã chọn tham gia cũng tích Nhịp khi đánh mục tiêu đó."
burden = "Sát thương của bạn giảm cho đến khi có người khác tham gia. Nhịp tích một mình sẽ nhanh chóng mất đi."
perfect = "Sát thương của bạn không còn giảm trong lúc chờ. Vẫn cần một người tham gia khác để tích Nhịp."
tell = "Các đường màu hổ phách nối cả nhóm với mục tiêu đã đánh dấu."
control = "Đánh một mục tiêu, sau đó để thú nuôi hoặc đồng minh đã chọn tham gia cũng tấn công nó."

[mutation.type.trophy_crucible]
name = "Lò Luyện Chiến Tích"
benefit = "Sinh vật xuất hiện tự nhiên có thể rơi chiến tích. Dùng một chiến tích để chuẩn bị hiệu ứng khống chế chống lại loại sinh vật đó."
burden = "Loại sinh vật đó phát hiện bạn dễ hơn và nhìn xuyên hiệu ứng ẩn mình của Đột biến."
perfect = "Khả năng phát hiện thêm bị loại bỏ. Bạn vẫn chỉ có thể lưu một hiệu ứng chiến tích."
tell = "Một chiếc mặt nạ thể hiện loại sinh vật đã lưu xuất hiện sau lưng bạn."
control = "Cầm chiến tích tự nhiên, cúi người và nhấp chuột phải vào bàn chế tạo."

[mutation.type.umbral_echo]
name = "Tiếng Vọng U Ám"
benefit = "Tấn công từ góc mới hoặc bằng loại vũ khí mới sẽ lặp lại một hiệu ứng khống chế yếu hơn sau một khoảng trễ."
burden = "Lặp lại cùng một cách tấn công sẽ làm lộ bạn và tạm thời vô hiệu hóa khả năng ẩn mình."
perfect = "Lặp lại một cách tấn công không còn làm lộ bạn. Vẫn cần góc hoặc loại vũ khí mới."
tell = "Một dư ảnh tím sẫm lặp lại hiệu ứng khống chế."
control = "Đổi góc tấn công hoặc loại vũ khí giữa các đòn đánh."

[mutation.type.living_lattice]
name = "Mạng Lưới Sống"
benefit = "Thu hoạch và trồng lại sẽ tích Năng Lượng Rễ. Tiêu hao nó để mọc một lối đi tạm thời ngắn."
burden = "Lửa và dung nham có thể xóa hết năng lượng, còn việc lối đi bị ép sụp đổ sẽ tiêu hao thanh đói."
perfect = "Lửa và dung nham không còn xóa năng lượng. Các lối đi vẫn biến mất."
tell = "Rễ cây màu xanh chuyển nâu trước khi lối đi biến mất."
control = "Thu hoạch và trồng lại, sau đó cầm cây non, cúi người và nhấp chuột phải."

[mutation.type.masterwork_bond]
name = "Liên Kết Tuyệt Tác"
benefit = "Liên kết một công cụ do bạn chế tạo. Thay vì vỡ, nó dừng ở 1 điểm độ bền và phải được sửa trước khi dùng tiếp."
burden = "Chỉ công cụ đã liên kết được bảo vệ. Nếu làm mất nó, bạn phải chờ trước khi liên kết công cụ khác."
perfect = "Các công cụ khác vẫn hoạt động bình thường với hiệu ứng Đột biến. Chỉ công cụ Tuyệt Tác tránh bị vỡ."
tell = "Các ký tự rune trên công cụ nứt ra khi nó sắp vỡ."
control = "Tại kệ sách Adapt, hãy cầm công cụ do bạn chế tạo rồi chọn “Liên kết công cụ đang cầm”."

[mutation.type.deepblood]
name = "Huyết Mạch Sâu"
benefit = "Khai thác khối tự nhiên sâu dưới lòng đất sẽ tích Năng Lượng Tầng Sâu. Nó hỗ trợ hồi phục và cứu một công cụ đã liên kết khỏi bị vỡ."
burden = "Hồi phục dưới lòng đất tiêu hao Năng Lượng Tầng Sâu, còn năng lượng sẽ giảm dần trên mặt đất."
perfect = "Bạn vẫn hồi phục dưới lòng đất khi năng lượng bằng không. Cứu công cụ đã liên kết vẫn tốn năng lượng."
tell = "Các vết nứt đỏ lan trên bạn và công cụ đã liên kết khi năng lượng tăng lên."
control = "Khai thác các khối tự nhiên ở tầng sâu và liên kết một công cụ tại kệ sách Adapt."

[mutation.type.mycelial_nerve]
name = "Thần Kinh Sợi Nấm"
benefit = "Hiệu ứng có lợi bạn tự áp dụng sẽ lan dưới dạng yếu hơn tới người chơi gần đó đã chọn tham gia và thú nuôi."
burden = "Hiệu ứng của chính bạn tồn tại ngắn hơn, và sát thương lửa sẽ cắt đứt liên kết."
perfect = "Hiệu ứng của bạn giữ nguyên thời gian và lửa không còn cắt đứt liên kết."
tell = "Các vệt bào tử mang hiệu ứng sao chép tới đồng minh gần đó."
control = "Tự áp dụng một hiệu ứng có lợi khi ở gần người chơi đã chọn tham gia hoặc thú nuôi của bạn."

[mutation.type.gravebloom]
name = "Hoa Mộ"
benefit = "Giết một sinh vật thù địch xuất hiện tự nhiên có thể tạo ra cụm hoa tồn tại ngắn, giúp cây trồng lớn lên và hồi phục cho thú nuôi."
burden = "Các cụm hoa đang hoạt động làm yếu khả năng hồi phục tự nhiên của bạn, còn cụm hoa cũ thu hút sinh vật thù địch."
perfect = "Cụm hoa không còn làm yếu khả năng hồi phục của bạn. Chúng vẫn biến mất sau một thời gian ngắn."
tell = "Hoa nhợt màu và hạt linh hồn bay lên từ nơi sinh vật chết."
control = "Giết một sinh vật thù địch xuất hiện tự nhiên trên nền đất tự nhiên."

[mutation.type.resonant_formula]
name = "Công Thức Cộng Hưởng"
benefit = "Chế tạo, pha chế và phù phép mỗi việc một lần để chuẩn bị chuỗi kết hợp. Hiệu ứng Dị thường không gây sát thương tiếp theo của bạn sẽ lặp lại với nửa sức mạnh."
burden = "Lặp lại cùng một bước chuẩn bị sẽ phá chuỗi kết hợp và xóa hiệu ứng có lợi cũ nhất của bạn."
perfect = "Lặp lại một bước không còn phá chuỗi kết hợp. Bạn vẫn cần đủ ba bước khác nhau."
tell = "Ba biểu tượng kết hợp khi chuỗi đã sẵn sàng."
control = "Chế tạo, pha chế và phù phép mỗi việc một lần, theo thứ tự bất kỳ."

