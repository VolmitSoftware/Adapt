# Adapt language overlay: es_ES

[mutation.domain]
body = "Cuerpo"
hunt = "Caza"
industry = "Industria"
wild = "Naturaleza"
craft = "Artesanía"
anomaly = "Anomalía"

[mutation.type.gale_lung]
name = "Pulmón de Vendaval"
benefit = "Moverte llena Impulso. Cuando Impulso está al máximo, tu siguiente golpe empuja al objetivo o cambia su posición."
burden = "Mientras Impulso está al máximo, los enemigos te empujan con más fuerza. Bloquear lo vacía."
perfect = "Los enemigos ya no te empujan con más fuerza. Bloquear todavía vacía Impulso."
tell = "Un viento turquesa se reúne alrededor de tus pies y tu arma."
control = "Sigue moviéndote para llenar Impulso y luego asesta un golpe."

[mutation.type.bastion_spine]
name = "Espina de Bastión"
benefit = "Permanecer inmóvil acumula Estabilidad. Tu siguiente golpe con escudo, hacha o mano vacía provoca un empujón corto."
burden = "Mientras mantienes la postura, no puedes esprintar ni saltar. Un golpe por la espalda rompe la postura."
perfect = "Puedes esprintar y saltar mientras mantienes la postura. Los golpes por la espalda aún pueden romperla."
tell = "Unas costillas de piedra y grietas brillantes muestran la fuerza que has almacenado."
control = "Quédate inmóvil sobre el suelo y después golpea con un escudo, un hacha o la mano vacía."

[mutation.type.verdant_molt]
name = "Muda Frondosa"
benefit = "Agáchate sin moverte sobre terreno natural para eliminar los efectos perjudiciales."
burden = "También elimina los efectos beneficiosos, consume hambre y bloquea brevemente los efectos nuevos."
perfect = "Ya no pierdes los efectos beneficiosos ni el hambre. El breve bloqueo de efectos permanece."
tell = "Hojas, escamas o esporas salen despedidas de tu cuerpo."
control = "Mantente agachado e inmóvil sobre terreno natural."

[mutation.type.temperbound]
name = "Vínculo Templado"
benefit = "Vincula un conjunto de armadura para que sus piezas compartan durabilidad. Una pieza que fuera a romperse queda Agrietada en su lugar."
burden = "Quitarte o cambiar una pieza vinculada desactiva el conjunto durante un breve periodo."
perfect = "Cambiar de armadura ya no desactiva el conjunto. Solo un conjunto puede permanecer vinculado."
tell = "Unas líneas brillantes conectan las piezas de armadura vinculadas."
control = "En una estantería de Adapt, ponte cuatro piezas de armadura que hayas fabricado y elige «Vincular armadura actual»."

[mutation.type.paradox_scar]
name = "Cicatriz Paradójica"
benefit = "Un desplazamiento largo o un teletransporte deja un punto de retorno. Puedes volver a él una vez."
burden = "El punto de retorno es visible, impide que se forme otro y los enemigos pueden destruirlo."
perfect = "Ya no bloquea otros efectos de retorno de Mutación. Los enemigos todavía pueden destruirlo."
tell = "Una postimagen brillante señala el punto de retorno."
control = "Después de un desplazamiento largo o un teletransporte, agáchate e intercambia las manos para regresar."

[mutation.type.arsenal_cortex]
name = "Córtex del Arsenal"
benefit = "Cambiar de tipo de arma o herramienta entre golpes transfiere un efecto de control al siguiente golpe."
burden = "Usar dos veces seguidas el mismo tipo bloquea la combinación durante un breve periodo."
perfect = "Repetir un tipo ya no bloquea la combinación. Todavía debes cambiar de tipo para acumularla."
tell = "Un símbolo cambiante gira alrededor del objeto que sostienes."
control = "Asesta golpes con distintos tipos de arma o herramienta."

[mutation.type.packmind]
name = "Mente de Manada"
benefit = "Tu primer golpe marca un objetivo. Las mascotas y los aliados que hayan aceptado participar acumulan Ritmo al golpearlo también."
burden = "Tu daño se reduce hasta que alguien más se une. El Ritmo conseguido en solitario se desvanece rápidamente."
perfect = "Tu daño ya no se reduce mientras esperas. Para acumular Ritmo todavía hace falta otro participante."
tell = "Unas líneas de color ámbar conectan al grupo con el objetivo marcado."
control = "Golpea un objetivo y haz que una mascota o un aliado que haya aceptado participar también lo ataque."

[mutation.type.trophy_crucible]
name = "Crisol de Trofeos"
benefit = "Las criaturas que aparecen de forma natural pueden soltar trofeos. Usa uno para preparar un efecto de control contra ese tipo de criatura."
burden = "Ese tipo de criatura te detecta con más facilidad y ve a través del sigilo de Mutación."
perfect = "Se elimina la detección adicional. Todavía solo puedes guardar un efecto de trofeo."
tell = "Una máscara que muestra el tipo de criatura guardado aparece a tu espalda."
control = "Agáchate y haz clic derecho en una mesa de trabajo mientras sostienes un trofeo natural."

[mutation.type.umbral_echo]
name = "Eco Umbrío"
benefit = "Atacar desde un ángulo nuevo o con un nuevo tipo de arma repite, tras una demora, un efecto de control más débil."
burden = "Repetir el mismo enfoque te revela y desactiva brevemente el sigilo."
perfect = "Repetir un enfoque ya no te revela. Aún se requieren ángulos o tipos de arma nuevos."
tell = "Una postimagen morada oscura repite el efecto de control."
control = "Cambia el ángulo de ataque o el tipo de arma entre golpes."

[mutation.type.living_lattice]
name = "Entramado Viviente"
benefit = "Cosechar y replantar genera Carga de Raíz. Gástala para hacer crecer un camino corto y temporal."
burden = "El fuego y la lava pueden borrar tu carga, y un derrumbe forzado consume hambre."
perfect = "El fuego y la lava ya no borran la carga. Los caminos todavía desaparecen."
tell = "Las raíces verdes se vuelven marrones antes de que el camino desaparezca."
control = "Cosecha y replanta; después, agáchate y haz clic derecho mientras sostienes un brote."

[mutation.type.masterwork_bond]
name = "Vínculo de Obra Maestra"
benefit = "Vincula una herramienta que hayas fabricado. En vez de romperse, se detiene en un punto de durabilidad y no puede usarse hasta repararla."
burden = "Solo la herramienta vinculada recibe protección. Si la pierdes, debes esperar antes de vincular otra."
perfect = "Las demás herramientas funcionan con normalidad con los efectos de Mutación. Solo la Obra Maestra evita romperse."
tell = "Las runas de la herramienta se agrietan cuando está a punto de romperse."
control = "En una estantería de Adapt, sostén una herramienta que hayas fabricado y elige «Vincular herramienta en mano»."

[mutation.type.deepblood]
name = "Sangre Profunda"
benefit = "Minar bloques naturales a gran profundidad bajo tierra genera Carga Profunda. Sirve para curarte y salvar una herramienta vinculada."
burden = "Curarte bajo tierra gasta Carga Profunda, y la carga se consume lentamente en la superficie."
perfect = "La curación bajo tierra funciona aunque no quede carga. Salvar la herramienta vinculada todavía consume carga."
tell = "A medida que acumulas carga, unas grietas rojas se extienden por tu cuerpo y la herramienta vinculada."
control = "Mina bloques naturales a gran profundidad y vincula una herramienta en una estantería de Adapt."

[mutation.type.mycelial_nerve]
name = "Nervio Micelial"
benefit = "Los efectos beneficiosos que te aplicas se propagan de forma más débil a las mascotas y los jugadores cercanos que hayan aceptado participar."
burden = "Tu propio efecto dura menos, y recibir daño de fuego rompe el vínculo."
perfect = "Tu efecto conserva toda su duración y el fuego ya no rompe el vínculo."
tell = "Unos rastros de esporas llevan los efectos copiados hasta los aliados cercanos."
control = "Aplícate un efecto beneficioso cerca de jugadores que hayan aceptado participar o de mascotas que te pertenezcan."

[mutation.type.gravebloom]
name = "Floración Sepulcral"
benefit = "Matar una criatura hostil que haya aparecido de forma natural puede crear una floración breve que hace crecer cultivos y cura a tus mascotas."
burden = "Las floraciones activas reducen tu curación natural, y las más antiguas atraen criaturas hostiles."
perfect = "Las floraciones ya no reducen tu curación. Todavía desaparecen al poco tiempo."
tell = "Flores pálidas y partículas de alma se elevan desde el lugar de la muerte."
control = "Mata una criatura hostil que haya aparecido de forma natural sobre terreno natural."

[mutation.type.resonant_formula]
name = "Fórmula Resonante"
benefit = "Fabrica, prepara una poción y encanta una vez cada cosa para preparar una combinación. Tu siguiente efecto de Anomalía que no inflija daño se repite a media potencia."
burden = "Repetir el mismo paso de preparación rompe la combinación y elimina tu efecto beneficioso más antiguo."
perfect = "Repetir un paso ya no rompe la combinación. Aún necesitas los tres pasos diferentes."
tell = "Tres símbolos se unen cuando la combinación está preparada."
control = "Fabrica, prepara una poción y encanta una vez cada cosa, en cualquier orden."

