# Adapt language overlay: it_IT

[mutation.domain]
body = "Corpo"
hunt = "Caccia"
industry = "Industria"
wild = "Selvaggina"
craft = "Artigianato"
anomaly = "Anomalia"

[mutation.type.gale_lung]
name = "Gale Lung"
benefit = "Riempimento commovente Momentum. A pieno Momentum, il tuo prossimo colpo spinge o riposiziona l'obiettivo."
burden = "I nemici ti spingono più forte mentre Momentum è pieno. Bloccare i vuoti."
perfect = "I nemici non ti spingono più forte. Bloccaggio ancora vuoti Momentum."
tell = "Il vento teal si raduna intorno ai piedi e all'arma."
control = "Continuare a muoversi per riempire Momentum, poi atterrare un colpo."

[mutation.type.bastion_spine]
name = "Spina di bacino"
benefit = "In piedi ancora costruisce Stabilità. Il tuo prossimo scudo, l'ascia o il colpo disarmato invia una breve spinta."
burden = "Mentre braced, non si può sprint o salto. Un colpo da dietro rompe la posizione."
perfect = "Si può sprint e saltare mentre braced. Colpi da dietro possono ancora romperlo."
tell = "Le costole di pietra e le crepe luminose mostrano la vostra forza immagazzinata."
control = "Restare a terra, poi colpire con uno scudo, un'ascia o una mano vuota."

[mutation.type.verdant_molt]
name = "Verdant Molt"
benefit = "Sneak senza muoversi su terreno naturale per eliminare gli effetti nocivi."
burden = "Sgombera anche effetti utili, costa la fame e blocca brevemente nuovi effetti."
perfect = "Effetti utili e la fame non sono più persi. Il blocco a breve effetto rimane."
tell = "Le foglie, le scale o le spore sono scoppiate da te."
control = "Tenere sneak e rimanere ancora a terra naturale."

[mutation.type.temperbound]
name = "Temperato"
benefit = "Link un set di armatura in modo che i suoi pezzi condividono la durata. Un pezzo che si romperebbe diventa Cracked invece."
burden = "Rimuovere o scambiare un pezzo collegato disabilita il set per un breve periodo."
perfect = "Swapping armatura non disabilita più il set. Solo un set può rimanere collegato."
tell = "Le linee luminose collegano i pezzi di armatura collegati."
control = "su uno scaffale di libri Adapt, indossare quattro pezzi artigianali e scegliere un'armatura a corrente d'incontro."

[mutation.type.paradox_scar]
name = "Paradosso cicatrice"
benefit = "Una lunga mossa o teletrasporto lascia un punto di ritorno. Si può saltare indietro una volta."
burden = "Il punto di ritorno è visibile, blocca un altro dalla formazione e i nemici possono romperlo."
perfect = "Non blocca più gli effetti di ritorno delle mutazioni."
tell = "Un retroimmagine luminosa segna il punto di ritorno."
control = "Dopo una lunga mossa o teletrasporto, sneak e swap mani per tornare."

[mutation.type.arsenal_cortex]
name = "Arsenal Cortex"
benefit = "Cambiare armi o tipi di strumenti tra colpi porta un effetto di controllo nel prossimo colpo."
burden = "Utilizzando lo stesso tipo due volte blocca il combo per un breve tempo."
perfect = "Ripetere un tipo non blocca più la combo. I tipi di commutazione sono ancora necessari per costruirlo."
tell = "Un simbolo che cambia gira intorno all'oggetto tenuto."
control = "Colpi di terra con diversi tipi di armi o utensili."

[mutation.type.packmind]
name = "Packmind"
benefit = "Il tuo primo colpo segna un bersaglio."
burden = "Il tuo danno è inferiore fino a quando non si unisce qualcun altro."
perfect = "Il tuo danno non è più abbassato durante l'attesa. Tempo richiede ancora un altro partecipante."
tell = "Le linee ambra collegano il gruppo al bersaglio contrassegnato."
control = "Colpire un bersaglio, quindi avere un animale domestico o optato-in alleato attaccarlo troppo."

[mutation.type.trophy_crucible]
name = "Trofeo Crucis"
benefit = "I mob naturali possono cadere i trofei. Utilizzare uno per preparare un effetto di controllo contro quel tipo di mob."
burden = "Quel tipo di mob ti vede più facilmente e vede attraverso la mutazione furtiva."
perfect = "Il rilevamento extra viene rimosso. È ancora possibile memorizzare un solo effetto trofeo."
tell = "Una maschera che mostra il tipo di mob memorizzato appare dietro di te."
control = "Fai clic a destra su un tavolo di lavoro mentre tieni in mano un trofeo naturale."

[mutation.type.umbral_echo]
name = "Echo Umbral"
benefit = "Attacco da un nuovo angolo o con un nuovo tipo di arma per ripetere un effetto di controllo più debole dopo un ritardo."
burden = "Ripetire lo stesso approccio ti rivela e chiudere brevemente la stealth."
perfect = "Ripetere un approccio non vi rivela più. Sono ancora necessari nuovi angoli o tipi di armi."
tell = "Un dopoimage viola scuro ripete l'effetto di controllo."
control = "Cambia l'angolo di attacco o il tipo di arma tra colpi."

[mutation.type.living_lattice]
name = "Living Lattice"
benefit = "La raccolta e il riplanto guadagna la carica della radice."
burden = "Fuoco e lava possono pulire la vostra carica, e un crollo forzato costa fame."
perfect = "Fuoco e lava non pulire più la carica. I sentieri ancora scompaiono."
tell = "Le radici verdi girano marrone prima che il sentiero sparisca."
control = "Vendemmia e ripianta, quindi fai clic su di giri mentre tieni un linfatico."

[mutation.type.masterwork_bond]
name = "Masterwork Bond"
benefit = "Bind uno strumento che hai realizzato. Si ferma ad una durata invece di rottura e deve essere riparato prima dell'uso."
burden = "Solo lo strumento legato ottiene protezione. Se è perso, devi aspettare prima di legare un altro."
perfect = "Altri strumenti funzionano normalmente con effetti Mutation. Solo il Masterwork evita la rottura."
tell = "Corre sulla fessura dello strumento mentre si avvicina a rottura."
control = "in uno scaffale di libri Adapt, tenere un'utensione che hai creato e scegliere l'utensile legato tenuto."

[mutation.type.deepblood]
name = "Sangue profondo"
benefit = "L'estrazione di blocchi naturali in profondità sotterranea crea una carica profonda, alimenta la guarigione e salva uno strumento legato."
burden = "La guarigione sotterranea spende la carica profonda, e la carica si scarica lentamente sopra il suolo."
perfect = "La guarigione sotterranea funziona a zero carica. Salvare lo strumento limitato costa ancora carica."
tell = "Le crepe rosse si diffondono su di voi e lo strumento legato come la carica costruisce."
control = "Mine blocchi profondi naturali e legare uno strumento a un Adapt libreria."

[mutation.type.mycelial_nerve]
name = "Mycelial Nerve"
benefit = "Effetti utili si danno diffusione in forma più debole per i giocatori e gli animali preferiti nelle vicinanze."
burden = "Il tuo effetto dura meno tempo, e prendere danni al fuoco rompe il link."
perfect = "Il vostro effetto mantiene il suo tempo pieno e il fuoco non rompe più il link."
tell = "Percorsi Spore portano effetti copiati agli alleati vicini."
control = "Fate un effetto utile vicino ai giocatori che vi hanno scelto o agli animali domestici."

[mutation.type.gravebloom]
name = "Gravebloom"
benefit = "Uccidere una folla ostile naturale può creare una fioritura di breve durata che cresce colture e guarisce i vostri animali domestici."
burden = "Le fioriture attive indeboliscono la vostra guarigione naturale, e le fioriture più vecchie attirano mob ostili."
perfect = "I fiori non indeboliscono più la vostra guarigione. Scompaiono ancora dopo poco tempo."
tell = "I fiori pallidi e le particelle dell'anima risalgono dal punto di morte."
control = "Uccidere una folla ostile naturale a terra naturale."

[mutation.type.resonant_formula]
name = "Formula di risonanza"
benefit = "Artigianato, birra e incantare una volta per preparare una combo. Il tuo prossimo effetto anomalia non danneggiato si ripete a metà forza."
burden = "Ripetere lo stesso passo di preparazione rompe la combo e rimuove il più antico effetto utile."
perfect = "Ripetere un passo non rompe più la combo. Hai ancora bisogno di tutti e tre i passaggi diversi."
tell = "Tre simboli si uniscono quando la combo è pronta."
control = "Artigianato, birra e incantare una volta ogni, in qualsiasi ordine."

