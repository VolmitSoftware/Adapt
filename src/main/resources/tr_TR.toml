[mutation.type.gale_lung]
name = "Gale Lung"
benefit = "Hareket Momentum'u doldurur ve bir sonraki darbe hedefi itirir veya yeniden yerleştirir."
burden = "Enemies sizi daha zor itiyor, Momentum doluyken. Selam olsun."
perfect = "Enemies artık seni daha zor itmiyor. Bloklama hala boşluklar Momentum."
tell = "Teal rüzgar ayaklarınızın ve silahınızın etrafında toplanır."
control = "Momentum'u doldurmaya devam et, sonra bir hit toprak."

[mutation.type.bastion_spine]
name = "Bastion Spine"
benefit = "Ayak hala Stability inşa ediyor. Bir sonraki kalkanınız, axe veya silahsız vuruş kısa bir darbe gönderir."
burden = "Braced iken, sprint veya atlayamazsın. Arkadan bir vuruş, duruşu kırıyor."
perfect = "Yavaşlayabilir ve bracederken atabilirsiniz. Arkadan gelen Hits hala kırabilir."
tell = "Stone kaburgalar ve parlak çatlaklar, depolanmış kuvvetinizi gösteriyor."
control = "Hala zeminde dur, sonra bir kalkan, axe veya boş el ile grev."

[mutation.type.verdant_molt]
name = "Verdant Molt"
benefit = "Sneak, zararlı etkileri temizlemek için doğal zeminde hareket etmeden."
burden = "Ayrıca yararlı etkiler, açlık maliyeti ve kısa bloklar yeni etkiler."
perfect = "Yardım edici etkiler ve açlık artık kaybolmaz. Kısa etki bloğu kalır."
tell = "Leaves, ölçekler veya sporlar sizden uzaklaşır."
control = "Gizli tutun ve hala doğal zeminde kal."

[mutation.type.temperbound]
name = "Temperbound"
benefit = "Bir zırh kurdu, böylece parçaları dayanıklılık paylaşır. Bir parça kıracak, yerine Cracked olurdu."
burden = "Bağlantılı bir parça yüklemek veya takas etmek kısa süre için seti devre dışı bırakır."
perfect = "Swapping zırhı artık seti devre dışı bırakmıyor. Sadece bir set bağlantılı kalabilir."
tell = "Glowing hatları bağlantılı zırh parçalarına bağlanır."
control = "Bir anda Adapt Kitaplarhelf, dört adet zırhlı zırh parçaları giymek ve Link Şimdiki Zırh seçin."

[mutation.type.paradox_scar]
name = "Paradoks"
benefit = "Uzun bir hareket veya telgraf geri dönüş noktası bırakır. Bir kez geri atabilirsiniz."
burden = "Geri dönüş noktası görünür, oluşturmaktan başka bir tane bloklar ve düşmanları kırabilir."
perfect = "Artık diğer Mutasyon geri dönüş etkilerini engeller. Enemies hala kırabilir."
tell = "Parlak bir sonraki imaj geri dönüş noktası işaret eder."
control = "Uzun bir hareket veya telgraftan sonra, gizlice ve elleri geri döndürün."

[mutation.type.arsenal_cortex]
name = "Arsenal Cortex"
benefit = "hit arasındaki değişen silah veya araç türleri bir sonraki vuruşa tek kontrol etkisi taşır."
burden = "Aynı türü kullanarak kısa bir süre için açılan pencereyi iki kez kilitler."
perfect = "Bir türü tekrarlamak artık açılanı kilitlemiyor. Anahtarlama türleri hala inşa etmek için gereklidir."
tell = "Kayıtlı öğe etrafında değişen bir sembolü döndürür."
control = "Arazi farklı silah veya araç türleri ile vurur."

[mutation.type.packmind]
name = "Packmind"
benefit = "İlk vuruşunuz bir hedeftir. Evcil hayvanlar ve tercih edilen müttefikleri Tempo'yu da vurarak inşa etti."
burden = "Başka biri katılana kadar hasarınız daha az. Solo tempo hızla söner."
perfect = "Hasarınız artık daha düşük değilken. Tempo hala başka bir katılımcıya ihtiyacı var."
tell = "Amber hatları grubu işaretli hedefe bağlar."
control = "Hedefleri vur, sonra evcil hayvanını ya da seçilmiş müttefikini de saldır."

[mutation.type.trophy_crucible]
name = "Trophy Crucible"
benefit = "Doğal çeteler trophies düşebilir. Bu çete türüne karşı bir kontrol etkisi hazırlamak için birini kullanın."
burden = "O kalabalık seni daha kolay fark eder ve Mutasyon gizlileri aracılığıyla görür."
perfect = "Ekstra algılama kaldırıldı. Hala sadece bir trophy etkisi saklayabilirsiniz."
tell = "Depolamalı çete türü gösteren bir maske arkanızda görünür."
control = "Doğal bir ödül tuturken, sağ tıklayarak bir masa yapın."

[mutation.type.umbral_echo]
name = "Umbral Echo"
benefit = "Yeni bir açıdan saldırı veya yeni bir silah türü ile gecikmeden sonra daha zayıf bir kontrol etkisini tekrarlamak için."
burden = "Aynı yaklaşımı tekrarlamak sizi ortaya çıkarır ve kısa bir şekilde kapatılır."
perfect = "Bir yaklaşımı tekrarlamak artık sizi açığa çıkarmaz. Yeni açılar veya silah türleri hala gereklidir."
tell = "Daha karanlık bir mor kontrol etkisini tekrarlar."
control = "Saldırı açınızı veya silah tipini hitler arasında değiştirin."

[mutation.type.living_lattice]
name = "Yaşamak Lattice"
benefit = "Hasat etmek ve yeniden dikmek Kök Şarji kazanır. Kısa bir geçici yol büyümek için onu harcayın."
burden = "Ateş ve lava sizin sorumluluğunuz yok edebilir ve zorla bir çöküntü açlık maliyeti."
perfect = "Ateş ve lava artık şarj edilemez. Yollar hala yok."
tell = "Yeşil kökler yol yok etmeden önce kahverengi döndürür."
control = "Hasat ve replant, sonra bir filing yaparken gizlice tıklanır."

[mutation.type.masterwork_bond]
name = "Masterwork Bond"
benefit = "Bind tek bir alet,. kırılma yerine bir dayanıklılıkta durur ve kullanımdan önce tamir edilmelidir."
burden = "Sadece sınır aracı koruma alır. Kaybedilirse, başka birini bağlamadan önce beklemeniz gerekir."
perfect = "Diğer araçlar normalde Mutasyon etkileri ile çalışır. Sadece Ustalık kırılmadan kaçınır."
tell = "Atışın yakınında olduğu gibi alet çatlakları çalıştırın."
control = "Adapt kitap rafında, kendi yaptığın bir alet tut ve tutulan bir araç seç."

[mutation.type.deepblood]
name = "Derin kanlı"
benefit = "Yeraltında doğal blokları madencilik ederek derin yük oluşturur. İyileşmeyi güçlendirir ve bir bağlanmış alet kurtarır."
burden = "Yeraltı iyileşmesi Deep Charge'u geçirir ve sorumlu yavaşça zeminin üstünden çıkarır."
perfect = "Yeraltı şifası sıfır şarjda çalışır. Sınır aracı kurtarmak hala maliyetlerden sorumlu."
tell = "Kırmızı çatlaklar sizinle ve sorumlu inşa olarak sınırlı araç yayıldı."
control = "Doğal derin bloklar ve bir aracı bir anda bağlar Adapt Kitaplarhelf."

[mutation.type.mycelial_nerve]
name = "Mycelial Nerve"
benefit = "Kendinize verdiğiniz faydalı etkileri, yakınlarda bulunan oyuncular ve evcil hayvanlara daha zayıf şekilde yayılır."
burden = "Kendi etkiniz daha az zaman sürer ve yangın hasarını almak bağlantıyı bozar."
perfect = "Etkisiniz tam zamanını tutar ve artık bağlantıyı kırmayın."
tell = "Spor izleri yakındaki müttefiklere kopyalanan etkileri taşır."
control = "Kendine, seçilmiş oyuncular veya evcil hayvanların yanında yararlı bir etki yap."

[mutation.type.gravebloom]
name = "Tavşan"
benefit = "Doğal düşmanca bir kalabalığı öldürmek, bitkiler yetiştiren ve evcil hayvanlarınızı iyileştiren kısa süreli bir çiçek oluşturabilir."
burden = "Aktif çiçekler doğal şifanızı zayıflatır ve eski çiçekleri düşman çeteleri çekiyor."
perfect = "Blooms artık şifanızı zayıflatmıyor. Kısa bir süre sonra hala kaybolurlar."
tell = "Pale çiçekleri ve ruh parçacıkları ölümden yükselir."
control = "Doğal zeminde doğal düşmanca bir çete öldür."

[mutation.type.resonant_formula]
name = "Resonant Formula"
benefit = "Craft, bira ve her biri bir kez daha bir combo hazırlamak. Bir sonraki anomali etkisi yarı güçte tekrarlanır."
burden = "Aynı prep adımını tekrarlayın ve en eski yararlı etkinizi ortadan kaldırır."
perfect = "Bir adımı tekrarlamak artık combo kırmıyor. Hala üç farklı adıma ihtiyacınız var."
tell = "Üç sembol kombinasyon hazır olduğunda bir araya gelir."
control = "Craft, bira ve her seferinde enchant."

