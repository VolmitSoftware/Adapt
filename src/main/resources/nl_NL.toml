# Adapt language overlay: nl_NL

[mutation.domain]
body = "Lichaam"
hunt = "Hunt"
industry = "Industrie"
wild = "Wild"
craft = "Ambacht"
anomaly = "Anomalie"

[mutation.type.gale_lung]
name = "Gale Lung"
benefit = "Bij volle momentum duwt je volgende hit het doel op of zet het weer in."
burden = "Vijanden duwen je harder terwijl Momentum vol is. Blokkeren leegt het."
perfect = "Vijanden duwen je niet langer harder. Blokkeren nog steeds leeg Momentum."
tell = "Teale wind verzamelt rond je voeten en wapen."
control = "Blijf bewegen om Momentum te vullen, dan een hit landen."

[mutation.type.bastion_spine]
name = "Bastion Spine"
benefit = "Staande bouwt stabiliteit. Uw volgende schild, bijl of ongewapende hit stuurt een korte duw."
burden = "Als je op de rug staat, kun je niet springen of springen."
perfect = "Je kunt sprinten en springen terwijl je vastzit. Hits van achteren kan nog steeds breken."
tell = "Stenen ribben en heldere scheuren tonen uw opgeslagen kracht."
control = "Sta stil op de grond en sla dan met een schild, bijl of lege hand."

[mutation.type.verdant_molt]
name = "Verdant Molt"
benefit = "Sluipen zonder zich op natuurlijke grond te verplaatsen om schadelijke effecten duidelijk te maken."
burden = "Het maakt ook nuttige effecten duidelijk, kost honger en blokkeert kort nieuwe effecten."
perfect = "Hulpzame effecten en honger gaan niet langer verloren. Het korte effect blok blijft."
tell = "Bladeren, schaal of sporen ontploffen van je af."
control = "Houd stiekem en blijf stil op natuurlijke grond."

[mutation.type.temperbound]
name = "Temperbound"
benefit = "Koppel één harnas set zodat de stukken delen duurzaamheid. Een stuk dat zou breken wordt gebarsten in plaats daarvan."
burden = "Verwijderen of ruilen van een gekoppeld stuk schakelt de set voor korte tijd uit."
perfect = "Swapping harnas schakelt de set niet langer uit. Slechts één set kan gekoppeld blijven."
tell = "Gloeilijnen verbinden de gekoppelde pantserstukken."
control = "op een Adapt boekrak, vier gecreëerde ruststukken dragen en linkstroomtank kiezen."

[mutation.type.paradox_scar]
name = "Paradox Scar"
benefit = "Een lange beweging of teleport verlaat een terugkeerpunt. Je kunt er één keer weer naar toe springen."
burden = "Het terugkeerpunt is zichtbaar, blokkeert een andere van de vorming en vijanden kunnen het breken."
perfect = "Het blokkeert geen andere mutatie-terugkeer effecten meer."
tell = "Een helder nabeeld markeert het terugkeerpunt."
control = "Na een lange beweging of teleporteer, sluip en ruil handen om terug te keren."

[mutation.type.arsenal_cortex]
name = "Arsenal Cortex"
benefit = "Het veranderen van wapen of gereedschapstypen tussen hits draagt een controle effect in de volgende hit."
burden = "Met hetzelfde type twee keer sluit de combo voor een korte tijd."
perfect = "Het herhalen van een type sluit de combinatie niet meer op."
tell = "Een veranderend symbool draait rond het vastgehouden item."
control = "Landtreffen met verschillende soorten wapen of gereedschap."

[mutation.type.packmind]
name = "Packmind"
benefit = "Je eerste schot treft een doelwit, huisdieren en geacht-in bondgenoten bouwen Tempo op door hem ook te raken."
burden = "Je schade is lager tot iemand anders bij je komt."
perfect = "De schade is niet meer afgenomen terwijl je wacht."
tell = "Amberlijnen verbinden de groep met het gemarkeerde doel."
control = "Hit een doel, dan heb je een huisdier of option-in bondgenoot aanvallen het ook."

[mutation.type.trophy_crucible]
name = "Trophy Crucible"
benefit = "Natuurlijke mob kan trofeeën laten vallen. Gebruik er één om een controle effect tegen dat mob type voor te bereiden."
burden = "Die mob-type ziet je makkelijker en kan door de mutatie zien."
perfect = "De extra detectie wordt verwijderd. U kunt nog steeds slechts één trofee effect opslaan."
tell = "Achter u verschijnt een masker met het opgeslagen mobtype."
control = "Sla op een handwerkstafel terwijl je een natuurlijke trofee houdt."

[mutation.type.umbral_echo]
name = "Umbral Echo"
benefit = "Aanvallen vanuit een nieuwe hoek of met een nieuw wapentype om een zwakker controle-effect na vertraging te herhalen."
burden = "Het herhalen van dezelfde aanpak onthult u en kort sluit stealth."
perfect = "Het herhalen van een benadering onthult je niet meer."
tell = "Een donker paars nabeeld herhaalt het controle-effect."
control = "Verander uw aanvalshoek of wapentype tussen hits."

[mutation.type.living_lattice]
name = "Living Lattice"
benefit = "De oogst en herplanting verdienen de wortellading. Gebruik het om een korte tijdelijke weg te laten groeien."
burden = "Vuur en lava kunnen je lading wissen, en een gedwongen instorting kost honger."
perfect = "Vuur en lava wissen de lading niet meer weg."
tell = "Groene wortels worden bruin voordat het pad verdwijnt."
control = "Haal en planten, klik dan met de rechterkliek terwijl je een struik vasthoudt."

[mutation.type.masterwork_bond]
name = "Masterwork Bond"
benefit = "Bind één gereedschap dat je gemaakt hebt. Het stopt bij één duurzaamheid in plaats van breken en moet worden gerepareerd voor gebruik."
burden = "Alleen het gebonden gereedschap krijgt bescherming. Als het verloren gaat, moet u wachten voordat een andere."
perfect = "Andere gereedschappen werken normaal met mutatie effecten. Alleen het meesterwerk voorkomt breken."
tell = "Runen op het gereedschap scheur als het bijna breekt."
control = "op een Adapt boekrak, hou een gereedschap dat u hebt gemaakt en kies bind gehandeld gereedschap."

[mutation.type.deepblood]
name = "Diepbloed"
benefit = "De natuurlijke blokken die diep onder de grond zijn, worden in staat gesteld om te genezen en een gebonden hulpmiddel te redden."
burden = "Ondergrondse genezing besteedt diepe lading, en de lading langzaam afvoert boven grond."
perfect = "Ondergrondse genezing werkt bij nul lading. Het opslaan van het gebonden gereedschap kost nog steeds kosten."
tell = "Rode scheuren verspreid over u en het gebonden gereedschap als lading bouwt."
control = "Mijn natuurlijke diepe blokken en binden één gereedschap aan een Adapt boekhandel."

[mutation.type.mycelial_nerve]
name = "Mycelial nerve"
benefit = "Handige effecten die je jezelf verspreid in zwakkere vorm naar nabijgelegen opt-in spelers en huisdieren."
burden = "Uw eigen effect duurt minder tijd, en het nemen van brandschade breekt de link."
perfect = "Je effect houdt zijn volle tijd en vuur breekt de verbinding niet meer."
tell = "Spore paden dragen gekopieerde effecten naar nabijgelegen bondgenoten."
control = "Geef jezelf een nuttig effect in de buurt van gekozen spelers of eigendom huisdieren."

[mutation.type.gravebloom]
name = "Gravebloom"
benefit = "Het doden van een natuurlijke vijandige mob kan zorgen voor een korte bloei die gewassen kweekt en uw huisdieren geneest."
burden = "Actieve bloemen verzwakken uw natuurlijke genezing, en oudere bloeien trekken vijandige mobs."
perfect = "Bloemen verzwakken je genezing niet meer. Ze verdwijnen nog na een korte tijd."
tell = "Bleke bloemen en zielendeeltjes stijgen uit de dood spot."
control = "Dood een natuurlijke vijandige menigte op natuurlijke grond."

[mutation.type.resonant_formula]
name = "Resonantformule"
benefit = "Craft, brouwen en betoveren één keer om een combinatie te bereiden. Uw volgende niet beschadigende anomalie effect herhaalt zich op halve kracht."
burden = "Het herhalen van dezelfde voorbereiding stap breekt de combo en verwijdert uw oudste nuttig effect."
perfect = "Een stap herhalen breekt de combinatie niet langer. Je hebt nog steeds alle drie de stappen nodig."
tell = "Drie symbolen samen als de combinatie klaar is."
control = "Craft, brouwen en betoveren een keer elk, in welke volgorde dan ook."

