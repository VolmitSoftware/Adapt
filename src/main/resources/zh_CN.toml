# Adapt — zh_CN
#
# === 编辑文件 ===
# plugins/Adapt/languages/zh_CN.toml
# 可直接编辑此文件。本地修改会保留；缺失或无效条目使用内置英语文本。
# /adapt language server edit zh_CN
#
# === 前缀 ===
# {prefix} 是统计值的前缀。命令前缀会自动添加。
#
# === 格式 ===
# MiniMessage: <green>...</green>.
# &0-&f 为颜色，&k-&r 为格式，&#RRGGBB 为十六进制颜色；automatic-gradients 表示自动渐变。
#
# === 变量 ===
# 请勿更改变量名，仅使用各消息中原有的变量。
#   {adaptation}  适应能力名称
#   {after}  编辑后的值
#   {amount}  货币、知识或经验的数量
#   {argument}  意外的命令参数
#   {available}  可用的力量或知识
#   {before}  编辑前的值
#   {block}  进度指引中指定的方块
#   {bonus}  精工加成数量
#   {category}  配置分类名称
#   {chance}  触发概率
#   {combo}  瞬间回溯的触发条件组合
#   {command}  完整命令路径
#   {cost}  所需知识数量
#   {count}  项目、文件或消息数量
#   {damage}  额外伤害量
#   {danger}  通过传送门时的危险警告
#   {description}  进度说明
#   {direction}  结构所在方向
#   {distance}  到结构的距离（方块）
#   {duration}  格式化后的持续时间或冷却时间
#   {effect}  药水效果名称
#   {enchantment}  附魔名称
#   {environment}  影响能力的环境
#   {error}  配置错误详情
#   {experience}  经验球中存储的经验
#   {file}  配置文件名称
#   {first}  第一个技能组或触发条件组成部分
#   {from}  页面中首个条目的序号
#   {group}  语言编辑器分类
#   {hits}  缓存命中次数
#   {instruction}  解锁进度的指引
#   {key}  消息或配置键
#   {knowledge}  知识数量
#   {label}  设置或统计值的标签
#   {level}  技能、适应能力或效果等级
#   {levels}  节省的经验等级数量
#   {line}  语言消息的行号
#   {locale}  语言代码
#   {maximum}  允许的最大值或力量上限
#   {message}  冷却时间详情前的状态消息
#   {microsPerCheck}  每次能力检查耗时（微秒）
#   {millisPerSecond}  每秒用于能力检查的时间（毫秒）
#   {minimum}  允许的最小值
#   {misses}  缓存未命中次数
#   {multiplier}  经验加成倍率
#   {needed}  所需的力量或知识
#   {newValue}  新的配置值
#   {nextLevel}  下一个技能等级的显示内容
#   {oldValue}  之前的配置值
#   {page}  当前页码
#   {pages}  总页数
#   {parameter}  命令参数名称
#   {parameters}  被忽略的命令参数
#   {particle}  粒子类型名称
#   {path}  配置路径
#   {perMinute}  每分钟能力检查次数
#   {perSecond}  每秒能力检查次数
#   {percent}  耗时预算占比或经验加成百分比
#   {permission}  所需权限节点
#   {personal}  个人语言代码
#   {player}  操作所作用的玩家
#   {plugin}  插件名称
#   {power}  力量数量或消耗量
#   {prefix}  统计值前缀
#   {progress}  技能进度显示内容
#   {range}  搜索或能力范围（方块）
#   {ratio}  缓存命中率
#   {reason}  编辑器错误
#   {refund}  取消学习时返还的知识
#   {remaining}  省略显示的配置变更数量
#   {second}  第二个技能组或触发条件组成部分
#   {seconds}  时长（秒）
#   {section}  语言编辑器分区
#   {separator}  统计值与标签之间的分隔符
#   {skill}  技能名称
#   {slots}  背包槽位数量
#   {stacks}  效果叠加层数或背包可容纳的物品组数
#   {state}  启用状态
#   {steps}  已完成的合成、酿造或附魔步骤数
#   {strength}  额外护甲强度
#   {structure}  已定位的结构名称
#   {surface}  影响触发条件的地表
#   {symbol}  结构指示符号
#   {target}  目标玩家或要设置语言的插件
#   {timestamp}  配置归档时间戳
#   {to}  页面中最后一个条目的序号
#   {total}  条目或槽位总数
#   {trigger}  能力触发条件
#   {trophy}  已绑定的战利品状态
#   {type}  预期的参数或值类型
#   {used}  已用力量或占用的槽位数量
#   {value}  当前设置或统计值
#   {values}  允许的设置值
#   {variables}  消息允许使用的占位符
#   {window}  性能测量时间窗口（毫秒）
#   {world}  世界名称
#   {x}  目标 X 坐标
#   {xp}  经验数量
#   {z}  目标 Z 坐标

