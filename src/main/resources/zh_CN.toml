# Adapt language overlay: zh_CN

[mutation.domain]
body = "身体"
hunt = "狩猎"
industry = "工业"
wild = "荒野"
craft = "制作"
anomaly = "异常"

[mutation.type.gale_lung]
name = "疾风之肺"
benefit = "移动会积累动量。动量充满时，你的下一次攻击会推开目标或改变其位置。"
burden = "动量充满时，敌人对你的击退更强。格挡会清空动量。"
perfect = "敌人不再对你造成更强的击退。格挡仍会清空动量。"
tell = "青绿色的风在你的脚边和武器周围聚集。"
control = "持续移动以积累动量，然后命中一次攻击。"

[mutation.type.bastion_spine]
name = "堡垒之脊"
benefit = "原地站立会积累稳定度。接下来用盾牌、斧头或空手命中时，会产生一次短距离推击。"
burden = "蓄势时无法疾跑或跳跃。从背后受到攻击会打破架势。"
perfect = "蓄势时也可以疾跑和跳跃。从背后受到攻击仍可能打破架势。"
tell = "石质肋骨和明亮裂纹会显示你储存的力量。"
control = "在地面上原地站立，然后用盾牌、斧头或空手攻击。"

[mutation.type.verdant_molt]
name = "翠绿蜕皮"
benefit = "在自然地面上潜行且保持不动，可清除有害效果。"
burden = "这也会清除增益效果、消耗饥饿值，并暂时阻止你获得新效果。"
perfect = "不再失去增益效果或饥饿值。短暂的效果阻断仍然存在。"
tell = "树叶、鳞片或孢子会从你身上迸散。"
control = "在自然地面上保持潜行并原地不动。"

[mutation.type.temperbound]
name = "淬炼之契"
benefit = "连接一套护甲，让各部件共享耐久度。原本会损坏的部件会改为进入裂损状态。"
burden = "脱下或更换任一连接部件，会使整套护甲暂时失效。"
perfect = "更换护甲不再使整套护甲失效。仍然只能维持一套护甲的连接。"
tell = "发光的线条将已连接的护甲部件连在一起。"
control = "在 Adapt 书架前穿上四件亲手制作的护甲，然后选择“连接当前护甲”。"

[mutation.type.paradox_scar]
name = "悖论伤痕"
benefit = "进行长距离移动或传送后会留下返回点。你可以返回那里一次。"
burden = "返回点清晰可见，会阻止新返回点形成，而且敌人可以将其破坏。"
perfect = "它不再阻止其他变异的返回效果生效。敌人仍可以将其破坏。"
tell = "明亮的残影标示着返回点。"
control = "长距离移动或传送后，潜行并交换主副手即可返回。"

[mutation.type.arsenal_cortex]
name = "兵器皮层"
benefit = "在两次攻击之间切换武器或工具类型，可将一个控制效果延续到下一次攻击。"
burden = "连续使用两次同一类型，会使连击暂时锁定。"
perfect = "重复使用同一类型不再锁定连击。要积累连击仍需切换类型。"
tell = "不断变化的符号会绕着手持物品旋转。"
control = "使用不同类型的武器或工具命中目标。"

[mutation.type.packmind]
name = "群体心智"
benefit = "你的第一次攻击会标记目标。宠物和已选择参与的盟友也攻击该目标时，会积累节奏。"
burden = "在其他人加入前，你造成的伤害较低。独自积累的节奏会迅速消退。"
perfect = "等待其他人加入时，你的伤害不再降低。积累节奏仍需要另一名参与者。"
tell = "琥珀色线条将队伍与被标记的目标相连。"
control = "攻击一个目标，然后让宠物或已选择参与的盟友也攻击它。"

[mutation.type.trophy_crucible]
name = "战利品熔炉"
benefit = "自然生成的生物可能掉落战利品。使用一件战利品，可准备针对该类生物的控制效果。"
burden = "该类生物会更容易发现你，并能看穿变异提供的潜行效果。"
perfect = "额外的侦测效果会被移除。你仍然只能储存一种战利品效果。"
tell = "代表已储存生物类型的面具会出现在你身后。"
control = "手持自然战利品，在潜行时右击工作台。"

[mutation.type.umbral_echo]
name = "幽影回响"
benefit = "从新角度或用新武器类型攻击，会在短暂延迟后再次触发较弱的控制效果。"
burden = "重复使用同一种攻击方式会暴露你，并暂时禁用潜行效果。"
perfect = "重复攻击方式不再暴露你。仍需使用新角度或新武器类型。"
tell = "深紫色残影会重复触发控制效果。"
control = "在两次攻击之间改变攻击角度或武器类型。"

[mutation.type.living_lattice]
name = "生命网格"
benefit = "收获并补种会积累根系能量。消耗根系能量可长出一条短暂存在的路径。"
burden = "火焰和熔岩可能清空你的能量，路径被迫崩塌时还会消耗饥饿值。"
perfect = "火焰和熔岩不再清空能量。路径仍会消失。"
tell = "绿色根系会在路径消失前变成棕色。"
control = "收获并补种后，手持树苗潜行右击。"

[mutation.type.masterwork_bond]
name = "杰作之契"
benefit = "绑定一件亲手制作的工具。它不会损坏，而是停在 1 点耐久度，并且必须修复后才能继续使用。"
burden = "只有绑定的工具受到保护。如果工具遗失，必须等待一段时间才能绑定另一件。"
perfect = "其他工具仍可正常触发变异效果。只有杰作工具能免于损坏。"
tell = "工具接近损坏时，上面的符文会逐渐开裂。"
control = "在 Adapt 书架前手持亲手制作的工具，然后选择“绑定手持工具”。"

[mutation.type.deepblood]
name = "深血"
benefit = "在地下深处开采自然方块会积累深层能量。它可用于治疗，并在一次本应损坏时保住绑定工具。"
burden = "在地下治疗会消耗深层能量，而能量在地面上会缓慢流失。"
perfect = "深层能量为零时也能在地下获得治疗。保护绑定工具仍会消耗能量。"
tell = "随着能量积累，红色裂纹会蔓延到你和绑定的工具上。"
control = "开采地下深处的自然方块，并在 Adapt 书架前绑定一件工具。"

[mutation.type.mycelial_nerve]
name = "菌丝神经"
benefit = "你施加给自己的增益效果，会以较弱的形式扩散到附近已选择参与的玩家和宠物。"
burden = "你自己的效果持续时间会缩短，受到火焰伤害还会断开连接。"
perfect = "你自己的效果会保持完整持续时间，火焰也不再断开连接。"
tell = "孢子轨迹会将复制的效果传递给附近盟友。"
control = "在已选择参与的玩家或自己的宠物附近，给自己施加增益效果。"

[mutation.type.gravebloom]
name = "墓花"
benefit = "击杀自然生成的敌对生物时，可能产生短暂存在的花簇，用来催熟作物并治疗你的宠物。"
burden = "活跃的花簇会削弱你的自然治疗，存在较久的花簇还会吸引敌对生物。"
perfect = "花簇不再削弱你的治疗。它们仍会在短时间后消失。"
tell = "苍白花朵和灵魂粒子会从死亡地点升起。"
control = "在自然地面上击杀一只自然生成的敌对生物。"

[mutation.type.resonant_formula]
name = "共鸣公式"
benefit = "制作、酿造和附魔各进行一次即可准备连击。你下一个不造成伤害的异常效果会以一半强度再触发一次。"
burden = "重复同一个准备步骤会打断连击，并移除你持续时间最久的增益效果。"
perfect = "重复步骤不再打断连击。仍需完成三个不同的步骤。"
tell = "连击准备完成时，三个符号会结合在一起。"
control = "以任意顺序各完成一次制作、酿造和附魔。"

