# Adapt language overlay: ko_KR

[mutation.domain]
body = "신체"
hunt = "사냥"
industry = "산업"
wild = "야생"
craft = "제작"
anomaly = "변칙"

[mutation.type.gale_lung]
name = "질풍의 폐"
benefit = "움직이면 추진력이 차오릅니다. 추진력이 가득 찬 상태에서 다음 공격은 대상을 밀어내거나 위치를 바꿉니다."
burden = "추진력이 가득 차 있으면 적에게 더 강하게 밀려납니다. 방어하면 추진력이 사라집니다."
perfect = "더 이상 적에게 강하게 밀려나지 않습니다. 방어하면 추진력이 사라지는 효과는 유지됩니다."
tell = "청록색 바람이 발과 무기 주변에 모입니다."
control = "계속 움직여 추진력을 채운 뒤 공격을 적중시키세요."

[mutation.type.bastion_spine]
name = "요새의 척추"
benefit = "가만히 서 있으면 안정성이 쌓입니다. 다음 방패, 도끼 또는 맨손 공격이 짧은 밀치기 효과를 일으킵니다."
burden = "자세를 굳힌 동안에는 질주하거나 점프할 수 없습니다. 뒤에서 공격받으면 자세가 무너집니다."
perfect = "자세를 굳힌 동안에도 질주하고 점프할 수 있습니다. 뒤에서 공격받으면 여전히 자세가 무너질 수 있습니다."
tell = "돌로 된 갈비뼈와 밝은 균열이 비축된 힘을 드러냅니다."
control = "지상에서 가만히 선 뒤 방패, 도끼 또는 맨손으로 공격하세요."

[mutation.type.verdant_molt]
name = "녹음의 탈피"
benefit = "자연 지형에서 움직이지 않은 채 웅크리면 해로운 효과가 제거됩니다."
burden = "이때 이로운 효과도 제거되고 허기가 소모되며, 잠시 새 효과를 받을 수 없습니다."
perfect = "이로운 효과와 허기가 더 이상 사라지지 않습니다. 짧은 효과 차단은 유지됩니다."
tell = "나뭇잎, 비늘 또는 포자가 몸에서 터져 나옵니다."
control = "자연 지형에서 웅크린 채 움직이지 마세요."

[mutation.type.temperbound]
name = "단련의 결속"
benefit = "방어구 세트 하나를 연결해 모든 부위가 내구도를 공유하게 합니다. 파괴될 부위는 대신 금이 간 상태가 됩니다."
burden = "연결된 부위를 벗거나 교체하면 잠시 세트가 비활성화됩니다."
perfect = "방어구를 교체해도 더 이상 세트가 비활성화되지 않습니다. 한 세트만 연결된 상태로 유지할 수 있습니다."
tell = "빛나는 선이 연결된 방어구 부위들을 잇습니다."
control = "Adapt 책장에서 직접 제작한 방어구 네 부위를 착용하고 '현재 방어구 연결'을 선택하세요."

[mutation.type.paradox_scar]
name = "역설의 흉터"
benefit = "긴 거리를 이동하거나 순간이동하면 귀환 지점이 남습니다. 그곳으로 한 번 되돌아갈 수 있습니다."
burden = "귀환 지점이 눈에 보이고, 새 지점의 생성을 막으며, 적이 이를 파괴할 수 있습니다."
perfect = "다른 변이의 귀환 효과를 더 이상 막지 않습니다. 적은 여전히 귀환 지점을 파괴할 수 있습니다."
tell = "밝은 잔상이 귀환 지점을 표시합니다."
control = "긴 거리를 이동하거나 순간이동한 뒤, 웅크린 채 손을 바꾸면 돌아갑니다."

[mutation.type.arsenal_cortex]
name = "무기고 피질"
benefit = "공격 사이에 무기나 도구 종류를 바꾸면 하나의 제어 효과가 다음 공격으로 이어집니다."
burden = "같은 종류를 두 번 연속 사용하면 잠시 연계가 잠깁니다."
perfect = "같은 종류를 반복해도 더 이상 연계가 잠기지 않습니다. 연계를 쌓으려면 여전히 종류를 바꿔야 합니다."
tell = "모양이 변하는 문양이 손에 든 아이템 주위를 회전합니다."
control = "서로 다른 종류의 무기나 도구로 공격을 적중시키세요."

[mutation.type.packmind]
name = "무리의식"
benefit = "첫 공격이 대상을 표식합니다. 펫과 참여를 허용한 아군도 그 대상을 공격하면 템포가 쌓입니다."
burden = "다른 이가 합류하기 전까지 자신의 피해량이 감소합니다. 혼자 쌓은 템포는 빠르게 사라집니다."
perfect = "기다리는 동안 자신의 피해량이 더 이상 감소하지 않습니다. 템포를 쌓으려면 여전히 다른 참여자가 필요합니다."
tell = "호박색 선이 무리와 표식된 대상을 연결합니다."
control = "대상을 공격한 뒤 펫이나 참여를 허용한 아군도 공격하게 하세요."

[mutation.type.trophy_crucible]
name = "전리품 도가니"
benefit = "자연 생성 몹이 전리품을 떨어뜨릴 수 있습니다. 전리품 하나를 사용하면 해당 몹 종류를 상대할 제어 효과가 준비됩니다."
burden = "해당 몹 종류가 자신을 더 쉽게 발견하고 변이의 은신도 꿰뚫어 봅니다."
perfect = "추가 감지 효과가 사라집니다. 준비해 둘 수 있는 전리품 효과는 여전히 하나뿐입니다."
tell = "저장된 몹 종류를 나타내는 가면이 등 뒤에 나타납니다."
control = "자연 전리품을 든 채 웅크리고 제작대를 우클릭하세요."

[mutation.type.umbral_echo]
name = "그림자 메아리"
benefit = "새로운 각도나 새로운 무기 종류로 공격하면 잠시 뒤 더 약한 제어 효과가 한 번 더 발생합니다."
burden = "같은 방식으로 반복 공격하면 모습이 드러나고 잠시 은신할 수 없습니다."
perfect = "같은 방식을 반복해도 더 이상 모습이 드러나지 않습니다. 새로운 각도나 무기 종류는 여전히 필요합니다."
tell = "짙은 보라색 잔상이 제어 효과를 반복합니다."
control = "공격 사이에 공격 각도나 무기 종류를 바꾸세요."

[mutation.type.living_lattice]
name = "생명의 격자"
benefit = "작물을 수확하고 다시 심으면 뿌리 충전이 쌓입니다. 이를 소모해 짧은 임시 길을 자라게 할 수 있습니다."
burden = "불과 용암이 충전을 모두 없앨 수 있으며, 길이 강제로 붕괴하면 허기가 소모됩니다."
perfect = "불과 용암이 더 이상 충전을 없애지 않습니다. 길은 여전히 사라집니다."
tell = "초록색 뿌리가 갈색으로 변한 뒤 길이 사라집니다."
control = "작물을 수확하고 다시 심은 뒤, 묘목을 든 채 웅크리고 우클릭하세요."

[mutation.type.masterwork_bond]
name = "명작의 결속"
benefit = "직접 제작한 도구 하나를 결속합니다. 도구가 파괴되는 대신 내구도 1에서 멈추며, 수리하기 전에는 사용할 수 없습니다."
burden = "결속된 도구만 보호됩니다. 도구를 잃으면 다른 도구를 결속하기 전에 기다려야 합니다."
perfect = "다른 도구에도 변이 효과가 정상적으로 작동합니다. 파괴를 피하는 것은 명작 도구뿐입니다."
tell = "도구가 파괴될 때가 가까워지면 룬에 금이 갑니다."
control = "Adapt 책장에서 직접 제작한 도구를 들고 '든 도구 결속'을 선택하세요."

[mutation.type.deepblood]
name = "심층혈"
benefit = "깊은 지하에서 자연 블록을 채굴하면 심층 충전이 쌓입니다. 이 충전은 치유에 사용되며 결속된 도구 하나를 보호합니다."
burden = "지하에서 치유하면 심층 충전이 소모되고, 지상에서는 충전이 서서히 줄어듭니다."
perfect = "충전이 없어도 지하에서 치유됩니다. 결속된 도구를 보호할 때는 여전히 충전이 소모됩니다."
tell = "충전이 쌓일수록 자신과 결속된 도구에 붉은 균열이 퍼집니다."
control = "깊은 지하의 자연 블록을 채굴하고 Adapt 책장에서 도구 하나를 결속하세요."

[mutation.type.mycelial_nerve]
name = "균사 신경"
benefit = "자신에게 부여한 이로운 효과가 약해진 형태로 주변의 참여 허용 플레이어와 펫에게 퍼집니다."
burden = "자신이 받는 효과의 지속 시간이 짧아지고, 화염 피해를 받으면 연결이 끊어집니다."
perfect = "자신의 효과가 원래 지속 시간을 유지하며, 화염 피해로도 연결이 끊어지지 않습니다."
tell = "포자 흔적이 복제된 효과를 주변 아군에게 전달합니다."
control = "참여를 허용한 플레이어나 소유한 펫 근처에서 자신에게 이로운 효과를 부여하세요."

[mutation.type.gravebloom]
name = "무덤꽃"
benefit = "자연 생성 적대적 몹을 처치하면 잠시 피어나는 꽃이 생겨 작물을 성장시키고 펫을 치유할 수 있습니다."
burden = "활성화된 꽃은 자신의 자연 치유를 약화하며, 오래된 꽃은 적대적 몹을 끌어들입니다."
perfect = "꽃이 더 이상 자신의 치유를 약화하지 않습니다. 꽃은 여전히 잠시 뒤 사라집니다."
tell = "죽은 자리에서 창백한 꽃과 영혼 입자가 솟아오릅니다."
control = "자연 지형 위에서 자연 생성 적대적 몹을 처치하세요."

[mutation.type.resonant_formula]
name = "공명 공식"
benefit = "제작, 양조, 마법 부여를 각각 한 번씩 하면 연계가 준비됩니다. 다음 비피해 변칙 효과가 절반의 위력으로 반복됩니다."
burden = "같은 준비 단계를 반복하면 연계가 끊기고 가장 오래된 이로운 효과가 제거됩니다."
perfect = "단계를 반복해도 더 이상 연계가 끊기지 않습니다. 서로 다른 세 단계는 여전히 모두 필요합니다."
tell = "연계가 준비되면 세 문양이 하나로 합쳐집니다."
control = "순서에 상관없이 제작, 양조, 마법 부여를 각각 한 번씩 하세요."

