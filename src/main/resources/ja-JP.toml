[mutation.domain]
body = "ボディ"
hunt = "ハント"
industry = "産業"
wild = "ワイルド"
craft = "製作"
anomaly = "アノーマリー"

[mutation.type.gale_lung]
name = "ガレ・ルン"
benefit = "移動は勢いを満たします. 完全な勢いでは、次のヒットは、ターゲットをプッシュまたは再配置します."
burden = "勢い がいっぱいある間、敵 はより堅いです. それを空にする."
perfect = "敵はもはやあなたのより堅い押しません. ブロックはまだ空っぽ勢い."
tell = "あなたの足と兵器を囲むテール風が集まります."
control = "モメンタムを埋めるために移動し続け、ヒット."

[mutation.type.bastion_spine]
name = "ベーション・スピン"
benefit = "スタンディングはまだ安定性を構築. 次のシールド、軸、または未装のヒットが短いプッシュを送信."
burden = "手順中、スプリントやジャンプはできません. 後ろからヒットしたスタンス."
perfect = "あなたはスプリントし、編組しながらジャンプすることができます. 後ろからヒットしてもまだ壊れる."
tell = "石の肋骨および明るいひびはあなたの貯えられた力を示します."
control = "地面にまだ立ち、そして盾、車軸または空の手と殴って下さい."

[mutation.type.verdant_molt]
name = "新緑 フェルト"
benefit = "自然な地面に動くことのない漏出は有害な効果を取り除きます."
burden = "また、有用な効果をクリアします, 空腹コスト, そして簡単に新しいエフェクトをブロック."
perfect = "有用な効果と飢餓はもはや失われません. 短い効果ブロックは、."
tell = "あなたからバースト、スケール、または胞子を残します."
control = "自然な地面にスニークを握り、とどまって下さい."

[mutation.type.temperbound]
name = "テンパーバウンド"
benefit = "1つの装甲セットをリンクして、その部分は耐久性を共有します. 代わりに壊れてしまう作品."
burden = "リンクされた部分を取消または交換すると、セットが短時間で無効になります。."
perfect = "スワッピング鎧はもはやセットを無効にしません. 1つのセットだけはリンクを維持できます."
tell = "溝のラインは連結された装甲部分を接続します."
control = "Adapt の本棚で、作製した防具を4部位装備し、「現在の防具をリンク」を選択します。"

[mutation.type.paradox_scar]
name = "パラドックススカー"
benefit = "長い移動か港はリターン ポイントを残します. 一度にジャンプできる."
burden = "戻り点が見えるので、もう一つは成形からブロックし、敵を破壊することができます。."
perfect = "他の変異のリターン効果を妨げません. 敵 はまだそれを壊すことができます."
tell = "明るい残像はリターンポイントをマークします."
control = "長い移動やテレポートの後、手を差し伸べて戻す."

[mutation.type.arsenal_cortex]
name = "武器庫の皮質"
benefit = "ヒット間で武器やツールの種類を変更すると、次のヒットに1つのコントロール効果を運ぶ."
burden = "同じタイプの2回は短時間コンボを締めます."
perfect = "型を繰り返すと、コンボがロックされない. スイッチングタイプはまだビルドする必要があります."
tell = "開催されたアイテムの周りに変化するシンボルがスピン."
control = "異なる武器やツールの種類でヒットした土地."

[mutation.type.packmind]
name = "パックマインド"
benefit = "最初にヒットしたマークがターゲット. ペットとオプトインの同盟国は、あまりにもそれを打つことによってテンポを構築."
burden = "他の人が参加するまで、あなたのダメージは低下します. ソロ テンポ すぐに 消滅."
perfect = "待たずにダメージを下げる. テンポ はまだ別の参加者が必要です."
tell = "アンバーラインは、グループをマークされたターゲットに接続します."
control = "ターゲットをヒットし、ペットやオプトインを味方に攻撃する."

[mutation.type.trophy_crucible]
name = "トロフィ・クルーシブル"
benefit = "自然モブはトロフィーをドロップすることができます. そのモブタイプに対してコントロール効果を準備するために1つを使用."
burden = "そのモブ型スポットをもっと簡単にし、ミュテーションステルスを通して見ます."
perfect = "余分な検出は取除かれます. トロフィー効果を1つだけ保存できます。."
tell = "保存したモブタイプのマスクが後ろに現れます."
control = "自然なトロフィーを保持しながら、クラフトテーブルを右クリック."

[mutation.type.umbral_echo]
name = "ウンブラル・エコー"
benefit = "新しい角度から攻撃するか、新しい武器タイプで遅延後に弱い制御効果を繰り返す."
burden = "同じアプローチを繰り返すと、ステルスを短くシャットダウン."
perfect = "アプローチを繰り返すと、もはやあなたを明らかにしません. 新しい角度や武器の種類はまだ必要です."
tell = "濃い紫色の残像は制御効果を繰り返します."
control = "攻撃角度またはヒット間武器タイプを変更する."

[mutation.type.living_lattice]
name = "リビング格子"
benefit = "収穫と再植栽は、ルートチャージを獲得. 短い一時的なパスを育てる."
burden = "火と溶岩は充電を拭くことができ、強制的な崩壊コストが空腹."
perfect = "火と溶岩はもはや拭きません. パスはまだ消えます."
tell = "パスが消える前に緑の根は茶色に変わります."
control = "収穫および再植えて下さい、それからスニーク右かちりと言う音は苗を握ります."

[mutation.type.masterwork_bond]
name = "マスターワークボンド"
benefit = "あなたが作った1つのツールを結合. 故障の代わりに1つの耐久性で止まり、使用前に修理しなければなりません."
burden = "限界用具だけが保護を得ます. 失われた場合は、別の結合する前に待つ必要があります."
perfect = "他のツールは、変異効果で正常に動作. マスターワークだけは破壊を避けます."
tell = "ツールの亀裂に近づいているので、."
control = "Adapt の本棚で、自分が作製した道具を持ち、「手持ちの道具をバインド」を選択します。"

[mutation.type.deepblood]
name = "ディープブロンド"
benefit = "鉱山の自然なブロックの深い地下は深い充満を造ります. それは1つの限界用具を癒し、救います動力を与えます."
burden = "地下の治癒は深い充満を費やし、充満は地面の上にゆっくり排水します."
perfect = "地下の治癒はゼロ充満で働きます. 境界ツールの節約は、依然として費用がかかります."
tell = "レッドクラックは、あなたとバインドツールを充電ビルドとして広がります."
control = "鉱山の自然な深いブロックは1つの用具をで結合します Adapt 本棚."

[mutation.type.mycelial_nerve]
name = "菌糸 ネルブ"
benefit = "近くのオプトインプレーヤーやペットに弱いフォームで自分を広めるのに役立つ効果."
burden = "あなた自身の効果はより少ない時間持続し、火の損傷を取ることはリンクを壊します."
perfect = "あなたの効果は、そのフルタイムを維持し、もはやリンクを破らない."
tell = "スプーアトレイルは、近くの同盟にコピーされた効果を運ぶ."
control = "オプトインプレーヤーや所有ペットの近くに有用な効果をもたらす."

[mutation.type.gravebloom]
name = "グラベブロム"
benefit = "自然な敵対的なモブを殺すことは、作物を育て、あなたのペットを癒す短命の咲くことができます."
burden = "活動的な花は、あなたの自然治癒を弱めます, 古い咲きは敵対的なモブを引き付けます."
perfect = "ブルームはもはやあなたの癒しを弱まらない. 短時間で消えてしまう."
tell = "花と魂の粒子が死場から上昇します."
control = "自然の地面に自然な敵対的なモブを殺す."

[mutation.type.resonant_formula]
name = "共鳴式"
benefit = "工房、醸造所、そしてコンボを準備するためにそれぞれに一度エンチャント. あなたの次の非損傷の異常な効果は半強さで繰り返します."
burden = "同じ準備ステップを繰り返すと、コンボを破り、最も古い有用な効果を削除します。."
perfect = "ステップを繰り返すと、コンボがなくなる. あなたはまだすべての3つの異なるステップを必要とします."
tell = "コンボが準備できたら3つのシンボルが一緒に参加."
control = "毎回クラフト、ビール、そしてエンチャント."

