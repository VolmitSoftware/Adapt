# Adapt language overlay: zh_TW

[mutation.domain]
body = "身體"
hunt = "狩獵"
industry = "工業"
wild = "荒野"
craft = "製作"
anomaly = "異常"

[mutation.type.gale_lung]
name = "疾風之肺"
benefit = "移動會累積動量。動量充滿時，你的下一次攻擊會推開目標或改變其位置。"
burden = "動量充滿時，敵人對你的擊退更強。格擋會清空動量。"
perfect = "敵人不再對你造成更強的擊退。格擋仍會清空動量。"
tell = "藍綠色的風在你的腳邊和武器周圍聚集。"
control = "持續移動以累積動量，然後命中一次攻擊。"

[mutation.type.bastion_spine]
name = "堡壘之脊"
benefit = "原地站立會累積穩定度。接著用盾牌、斧頭或空手命中時，會產生一次短距離推擊。"
burden = "蓄勢時無法衝刺或跳躍。從背後受到攻擊會打破架勢。"
perfect = "蓄勢時也可以衝刺和跳躍。從背後受到攻擊仍可能打破架勢。"
tell = "石質肋骨和明亮裂紋會顯示你儲存的力量。"
control = "在地面上原地站立，然後用盾牌、斧頭或空手攻擊。"

[mutation.type.verdant_molt]
name = "翠綠蛻皮"
benefit = "在自然地面上潛行並保持不動，可清除有害效果。"
burden = "這也會清除增益效果、消耗飢餓值，並暫時阻止你獲得新效果。"
perfect = "不再失去增益效果或飢餓值。短暫的效果阻斷仍然存在。"
tell = "樹葉、鱗片或孢子會從你身上迸散。"
control = "在自然地面上保持潛行並原地不動。"

[mutation.type.temperbound]
name = "淬鍊之契"
benefit = "連結一套護甲，讓各部件共享耐久度。原本會損壞的部件會改為進入裂損狀態。"
burden = "脫下或更換任一連結部件，會使整套護甲暫時失效。"
perfect = "更換護甲不再使整套護甲失效。仍然只能維持一套護甲的連結。"
tell = "發光的線條將已連結的護甲部件連在一起。"
control = "在 Adapt 書架前穿上四件親手製作的護甲，然後選擇「連結目前護甲」。"

[mutation.type.paradox_scar]
name = "悖論傷痕"
benefit = "進行長距離移動或傳送後會留下返回點。你可以返回那裡一次。"
burden = "返回點清晰可見，會阻止新返回點形成，而且敵人可以將其破壞。"
perfect = "它不再阻止其他變異的返回效果生效。敵人仍可以將其破壞。"
tell = "明亮的殘影標示著返回點。"
control = "長距離移動或傳送後，潛行並交換主副手即可返回。"

[mutation.type.arsenal_cortex]
name = "兵器皮層"
benefit = "在兩次攻擊之間切換武器或工具類型，可將一個控制效果延續到下一次攻擊。"
burden = "連續使用兩次同一類型，會使連擊暫時鎖定。"
perfect = "重複使用同一類型不再鎖定連擊。要累積連擊仍需切換類型。"
tell = "不斷變化的符號會繞著手持物品旋轉。"
control = "使用不同類型的武器或工具命中目標。"

[mutation.type.packmind]
name = "群體心智"
benefit = "你的第一次攻擊會標記目標。寵物和已選擇參與的盟友也攻擊該目標時，會累積節奏。"
burden = "在其他人加入前，你造成的傷害較低。獨自累積的節奏會迅速消退。"
perfect = "等待其他人加入時，你的傷害不再降低。累積節奏仍需要另一名參與者。"
tell = "琥珀色線條將隊伍與被標記的目標相連。"
control = "攻擊一個目標，然後讓寵物或已選擇參與的盟友也攻擊它。"

[mutation.type.trophy_crucible]
name = "戰利品熔爐"
benefit = "自然生成的生物可能掉落戰利品。使用一件戰利品，可準備針對該類生物的控制效果。"
burden = "該類生物會更容易發現你，並能看穿變異提供的潛行效果。"
perfect = "額外的偵測效果會被移除。你仍然只能儲存一種戰利品效果。"
tell = "代表已儲存生物類型的面具會出現在你身後。"
control = "手持自然戰利品，在潛行時以右鍵點擊工作台。"

[mutation.type.umbral_echo]
name = "幽影迴響"
benefit = "從新角度或用新武器類型攻擊，會在短暫延遲後再次觸發較弱的控制效果。"
burden = "重複使用同一種攻擊方式會暴露你，並暫時停用潛行效果。"
perfect = "重複攻擊方式不再暴露你。仍需使用新角度或新武器類型。"
tell = "深紫色殘影會重複觸發控制效果。"
control = "在兩次攻擊之間改變攻擊角度或武器類型。"

[mutation.type.living_lattice]
name = "生命網格"
benefit = "收穫並補種會累積根系能量。消耗根系能量可長出一條短暫存在的路徑。"
burden = "火焰和熔岩可能清空你的能量，路徑被迫崩塌時還會消耗飢餓值。"
perfect = "火焰和熔岩不再清空能量。路徑仍會消失。"
tell = "綠色根系會在路徑消失前變成棕色。"
control = "收穫並補種後，手持樹苗潛行並按右鍵。"

[mutation.type.masterwork_bond]
name = "傑作之契"
benefit = "綁定一件親手製作的工具。它不會損壞，而是停在 1 點耐久度，並且必須修復後才能繼續使用。"
burden = "只有綁定的工具受到保護。如果工具遺失，必須等待一段時間才能綁定另一件。"
perfect = "其他工具仍可正常觸發變異效果。只有傑作工具能免於損壞。"
tell = "工具接近損壞時，上面的符文會逐漸裂開。"
control = "在 Adapt 書架前手持親手製作的工具，然後選擇「綁定手持工具」。"

[mutation.type.deepblood]
name = "深血"
benefit = "在地底深處開採自然方塊會累積深層能量。它可用於治療，並在一次本應損壞時保住綁定工具。"
burden = "在地底治療會消耗深層能量，而能量在地面上會緩慢流失。"
perfect = "深層能量為零時也能在地底獲得治療。保護綁定工具仍會消耗能量。"
tell = "隨著能量累積，紅色裂紋會蔓延到你和綁定的工具上。"
control = "開採地底深處的自然方塊，並在 Adapt 書架前綁定一件工具。"

[mutation.type.mycelial_nerve]
name = "菌絲神經"
benefit = "你施加給自己的增益效果，會以較弱的形式擴散到附近已選擇參與的玩家和寵物。"
burden = "你自己的效果持續時間會縮短，受到火焰傷害還會中斷連結。"
perfect = "你自己的效果會保持完整持續時間，火焰也不再中斷連結。"
tell = "孢子軌跡會將複製的效果傳遞給附近盟友。"
control = "在已選擇參與的玩家或自己的寵物附近，給自己施加增益效果。"

[mutation.type.gravebloom]
name = "墓花"
benefit = "擊殺自然生成的敵對生物時，可能產生短暫存在的花簇，用來催熟作物並治療你的寵物。"
burden = "活躍的花簇會削弱你的自然治療，存在較久的花簇還會吸引敵對生物。"
perfect = "花簇不再削弱你的治療。它們仍會在短時間後消失。"
tell = "蒼白花朵和靈魂粒子會從死亡地點升起。"
control = "在自然地面上擊殺一隻自然生成的敵對生物。"

[mutation.type.resonant_formula]
name = "共鳴公式"
benefit = "製作、釀造和附魔各進行一次即可準備連擊。你下一個不造成傷害的異常效果會以一半強度再觸發一次。"
burden = "重複同一個準備步驟會中斷連擊，並移除你持續時間最久的增益效果。"
perfect = "重複步驟不再中斷連擊。仍需完成三個不同的步驟。"
tell = "連擊準備完成時，三個符號會結合在一起。"
control = "以任意順序各完成一次製作、釀造和附魔。"

