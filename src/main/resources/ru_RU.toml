[mutation.domain]
body = "тело"
hunt = "охота"
industry = "промышленность"
wild = "Дикий"
craft = "ремесло"
anomaly = "аномалия"

[mutation.type.gale_lung]
name = "Гейл Лунг"
benefit = "При полном импульсе следующий удар толкает или перемещает цель."
burden = "Враги толкают тебя сильнее, пока Момент полный."
perfect = "Враги больше не толкают вас сильнее. Блокировка по-прежнему опустошает импульс."
tell = "Тильный ветер собирается вокруг ваших ног и оружия."
control = "Продолжайте двигаться, чтобы заполнить импульс, а затем нанести удар."

[mutation.type.bastion_spine]
name = "Бастион Спина"
benefit = "Следующий щит, топор или бесоруженный удар высылает короткий толчок."
burden = "В то время как пристегнутый, вы не можете спринт или прыжок. Удар сзади ломает позицию."
perfect = "Вы можете спрыгнуть и прыгнуть, будучи прикованным. Хиты сзади все еще могут разбить его."
tell = "Каменные ребра и яркие трещины показывают сохраненную силу."
control = "Стойте на земле, а затем ударите щитом, топкой или пустой рукой."

[mutation.type.verdant_molt]
name = "Вердант Мольт"
benefit = "Проникните, не двигаясь по естественной поверхности, чтобы устранить вредные последствия."
burden = "Он также очищает полезные эффекты, устраняет голод и на короткое время блокирует новые."
perfect = "Полезные эффекты и голод больше не исчезают. Блок короткого эффекта остается."
tell = "Листья, чешуйки или споры отрываются от вас."
control = "Держите кражу и оставайтесь на естественной почве."

[mutation.type.temperbound]
name = "закаленный"
benefit = "Свяжите один бронеряд, чтобы его части имели прочность."
burden = "Удаление или замена связанного фрагмента отключает набор на короткое время."
perfect = "Замена брони больше не отключает набор. Только один набор может оставаться связанным."
tell = "Светящиеся линии соединяют связанные части брони."
control = "На книжной полке Adapt наденьте четыре изготовленных бронежилетов и выберите \"Линк-коррент бронежилет\"."

[mutation.type.paradox_scar]
name = "Парадоксальный шрам"
benefit = "Длинный ход или телепорт покидает точку возврата. Вы можете вернуться к нему один раз."
burden = "Враги могут сломать его."
perfect = "Он больше не блокирует другие эффекты возврата мутаций."
tell = "Яркий послеснимок отмечает точку возврата."
control = "После длительного перемещения или телепорта, прокрадывайтесь и обменяйтесь руками, чтобы вернуться."

[mutation.type.arsenal_cortex]
name = "Арсенал Кортекс"
benefit = "Изменение типа оружия или инструмента между ударами приводит к одному эффекту управления в следующем ударе."
burden = "Использование одного и того же типа дважды закроет комбинацию на короткое время."
perfect = "Повторение типа больше не блокирует комбинацию."
tell = "Меняющийся символ вращается вокруг удерживаемого предмета."
control = "Наземные удары с различными типами оружия или инструментов."

[mutation.type.packmind]
name = "Пэкминд"
benefit = "Ваш первый удар указывает на цель. Домашние животные и избранные союзники строят Темпо, ударяя его тоже."
burden = "Ущерб уменьшится, пока не присоединится кто-то другой."
perfect = "Ваш ущерб больше не уменьшается во время ожидания. Темпе нужен еще один участник."
tell = "Янтарные линии соединяют группу с обозначенной целью."
control = "Поразить цель, затем иметь питомца или выбранного союзника атаковать его тоже."

[mutation.type.trophy_crucible]
name = "Трофей Crucible"
benefit = "Природные толпы могут бросить трофеи."
burden = "Этот тип мобов легко видит вас и видит через скрытую Мютацию."
perfect = "Дополнительное обнаружение удалено, и вы можете хранить только один эффект трофея."
tell = "За вами появилась маска, показывающая тип хранимой толпы."
control = "Нажмите на крафтовый стол, держа естественный трофей."

[mutation.type.umbral_echo]
name = "Умбральное эхо"
benefit = "Атака под новым углом или с новым типом оружия для повторения более слабого эффекта управления после задержки."
burden = "Повторяя тот же подход, вы обнаруживаете себя и на короткий срок отключаете скрытность."
perfect = "Повторение подхода больше не раскрывает вас. По-прежнему требуются новые углы или типы оружия."
tell = "Темно-фиолетовое изображение повторяет эффект контроля."
control = "Изменить угол атаки или тип оружия между ударами."

[mutation.type.living_lattice]
name = "Живая решетка"
benefit = "Сбор и пересадка зарабатывают на корневые заряды."
burden = "Огонь и лава могут стереть ваш заряд, а вынужденный коллапс обходится голодом."
perfect = "Огонь и лава больше не стирают заряд. Пути все еще исчезают."
tell = "Зеленые корни становятся коричневыми, прежде чем путь исчезнет."
control = "Сбор урожая и пересадка, затем щелкните правой кнопкой мыши, удерживая саженец."

[mutation.type.masterwork_bond]
name = "Мастер-класс Бонд"
benefit = "Привяжите один из ваших инструментов, который не сломается и должен быть отремонтирован до использования."
burden = "Если он потерялся, вы должны подождать, прежде чем привязать другой инструмент."
perfect = "Другие инструменты работают с эффектами мутации."
tell = "Руны на инструменте трескаются, когда он приближается к разрыву."
control = "на книжной полке Adapt, держите инструмент, который вы создали и выберите привязанный инструмент."

[mutation.type.deepblood]
name = "Глубокая кровь"
benefit = "Добыча природных блоков глубоко под землей создает \"Глубокий заряд\", способствует исцелению и сберегает один связанный инструмент."
burden = "Подземное исцеление затрачивает глубокий заряд, а заряд медленно вытекает над землей."
perfect = "Подземное исцеление работает с нулевым зарядом. Экономия связанного инструмента по-прежнему стоит затрат."
tell = "Красные трещины распространяются по вам и связанному инструменту, когда заряд накапливается."
control = "Разминируйте естественные глубокие блоки и свяжите один инструмент Adapt книжная полка."

[mutation.type.mycelial_nerve]
name = "Мицелиальный нерв"
benefit = "Полезные эффекты, которые вы даете себе, распространяются в более слабой форме на близлежащих игроков и домашних животных."
burden = "Твоё собственное действие длится меньше времени, и получение повреждений от пожара разрушает связь."
perfect = "Твое действие сохраняет свое полное время, а огонь больше не разрушает связь."
tell = "Споровые следы переносят копированные эффекты к близлежащим союзникам."
control = "Дайте себе полезный эффект рядом с выбранными игроками или домашними животными."

[mutation.type.gravebloom]
name = "Могильник"
benefit = "Убивая естественную враждебную толпу, можно создать короткожизненный цветок, который выращивает урожай и исцеляет ваших домашних животных."
burden = "Активные цветы ослабляют естественное исцеление, а старые цветения привлекают враждебную толпу."
perfect = "Цветки больше не ослабляют ваше исцеление. Они все равно исчезают через короткое время."
tell = "Бледные цветы и частицы души поднимаются из места смерти."
control = "Убей враждебную толпу на естественной почве."

[mutation.type.resonant_formula]
name = "Резонансная формула"
benefit = "Ремесло, варить и очаровывать один раз каждый, чтобы подготовить комбо. Следующий неповреждающий эффект аномалии повторяется с половинной силой."
burden = "Повторяя один и тот же подготовительный шаг, вы разрушаете комбинацию и удаляете свой самый старый полезный эффект."
perfect = "Повторить шаг больше не разрушает комбинацию. Вам все равно нужны три различных шага."
tell = "Три символа соединяются, когда комбинация готова."
control = "Ремесло, варить и очаровывать один раз каждый, в любом порядке."

