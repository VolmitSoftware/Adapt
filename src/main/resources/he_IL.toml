description = "צייר קשת בזמן שאתה מסתכל על יצורים כדי לחגור עליהם - היא זורחת אדומה בשבילך, וזרוק שלך מצעצץ ומטנף דרך האוויר כדי למצוא אותו לא משנה לאן אתה מכוון, מתפרק סביב מכשולים. רמות פריצה ויכולת הקפיצה הזמינה של ריקושה בולט מוסיפים פסים חיפוש: החץ חותך את המטרה שלו, יוצא מהצד השני, ואז עופף לכיוון מטרה קרובה חדשה; ללא מטרה חדשה הוא ממשיך לטוס קדימה. הפסקים של ריקושא שומרים את ההדגמה שלהם, המהירות, הנזק והכסים כאשר מחפשים בלוקים של כביסה של חצים. כל ירי חיפש שמים את הקשת שלך במורד קצר."
lore1 = "צייר קשת בעודו מסתכל על יצור לנעול"
lore2 = "עקבו אחרי a Seek Shot"
lore3 = "גרפיקה וריטוצ'ט בולסט קיבולת להוסיף מחפש חולות"
lore = ["צייר קשת בעודו מסתכל על יצור לנעול", "עקבו אחרי a Seek Shot", "גרפיקה וריטוצ'ט בולסט קיבולת להוסיף מחפש חולות"]

