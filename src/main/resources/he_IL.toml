control = "לעמוד על הקרקע, ואז להכות עם מגן, גרזן או יד ריקה."

[mutation.type.verdant_molt]
name = "המונחים:"
benefit = "Sneak מבלי לעבור על הקרקע הטבעית כדי לנקות השפעות מזיקות."
