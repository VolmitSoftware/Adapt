control = "להרוג אספסוף עוין טבעי על קרקע טבעית."

[mutation.type.resonant_formula]
name = "המונחים: formula"
benefit = "מלאכות, מבשלות וקסם אחת לכל אחת להכין קוביה. ההשפעה הלא שגרתית הבאה שלך חוזרת על חצי כוח."
