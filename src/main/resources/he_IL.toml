control = "תנעלו ותשארו על הקרקע הטבעית."

[mutation.type.temperbound]
name = "סבלנות"
benefit = "קישור לשריון אחד להגדיר כך שפיסותיו חולקות עמידות. חתיכה שפרצה הופכת להיות מקופצת במקום."
burden = "הסרת או החלפת חתיכה מקושרת מבטלת את המערכת לזמן קצר."
perfect = "שריון כבר לא מקלקל את הסט. רק קבוצה אחת יכולה להישאר מקושרת."
tell = "קווי גלינג מחברים את חתיכות השריון המקושרות."
control = "בתוך A Adapt ספרים מדף, ללבוש ארבעה חתיכות שריון לבנות ולבחור קישור הנוכחי Armor."

[mutation.type.paradox_scar]
name = "Paradox Scar"
benefit = "מהלך ארוך או טלפורט משאיר נקודת החזרה. אתה יכול לקפוץ בחזרה אליו פעם אחת."
burden = "נקודת ההחזרה נראית, מונעת אחת אחרת מהתהפוך, ואויבים יכולים לשבור אותה."
