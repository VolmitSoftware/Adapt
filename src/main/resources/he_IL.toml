tell = "תמונה בהירה מציינת את נקודת החזרה."
control = "לאחר מסע ארוך או טלפורט, נעלי ספורט והחלפת ידיים כדי לחזור."

[mutation.type.arsenal_cortex]
name = "ארסנל Cortex"
benefit = "שינוי נשק או סוגי כלי בין להיטים יש אפקט שליטה אחד לתוך הלהיט הבא."
burden = "שימוש באותו סוג פעמיים מנעול את הקובו לזמן קצר."
perfect = "חזור על סוג כבר לא מנעול את הקובו. סוגים של מעבר עדיין נדרשים לבנות אותו."
tell = "סמל משתנה מסתובב סביב הפריט מוחזק."
control = "להיטי קרקע עם סוגים שונים של נשק או כלי."

[mutation.type.packmind]
name = "ארוז"
benefit = "הלהיט הראשון שלך מסמל מטרה. חיות מחמד ובעלי ברית בוחרים לבנות טמפו על ידי להכות אותו גם."
burden = "הנזק שלך נמוך יותר עד שמישהו אחר מצטרף. סולו טמפו מתפוגג במהירות."
perfect = "הנזק כבר לא יורד בזמן ההמתנה. טמפו עדיין זקוק למשתתף אחר."
tell = "קווי אמבר מחברים את הקבוצה ליעד המסומן."
control = "להכות מטרה, לאחר מכן יש חיית מחמד או בת ברית בוחרים לתקוף אותה גם."

[mutation.type.trophy_crucible]
name = "המונחים: crcible"
benefit = "אספסוף טבעי יכול לרדת. השתמש אחד כדי להכין אפקט שליטה נגד סוג האספסוף."
burden = "סוג האספסוף הזה הופך אתכם בקלות רבה יותר ורואים דרך גניבת המוטציות."
perfect = "גילוי נוסף הוסר. אתה עדיין יכול לאחסן רק אפקט אחד."
tell = "מסכה המציגה את סוג האספסוף המאוחסן מופיעה מאחוריך."
control = "לחץ על שולחן עבודה תוך שמירה על גביע טבעי."

[mutation.type.umbral_echo]
name = "Umbral Echo"
benefit = "התקפה מזווית חדשה או עם סוג חדש של נשק לחזור על אפקט שליטה חלש לאחר עיכוב."
burden = "חזרה על אותה גישה חושפת אותך וקצרת את הגניבה."
perfect = "חזור על גישה כבר לא מגלה לך. זוויות חדשות או סוגי נשק נדרשים."
tell = "תמונת סגול כהה חוזרת על אפקט השליטה."
control = "שינוי זווית ההתקפה או סוג הנשק בין להיטים."

[mutation.type.living_lattice]
name = "לחיות Lattice"
benefit = "איסוף ושיקום מרוויחים האשמות שורש. נצלו אותו כדי לגדל נתיב זמני קצר."
burden = "אש ולובה יכולים למחוק את ההצלה שלך, והמומוטטות בכפייה עלולה להרוויח רעב."
perfect = "האש והלאבה כבר לא גובים. השבילים עדיין נעלמים."
tell = "שורשים ירוקים הופכים לחומים לפני שהנתיב נעלם."
control = "קציר ושינה, ולאחר מכן לחץ על נעלי ספורט תוך שמירה על ספלינג."

[mutation.type.masterwork_bond]
name = "Masterwork Bond"
benefit = "בתוך כלי אחד שיצרת. היא עוצרת בעמידות אחת במקום לפרוץ וצריכה להיות מתוקנת לפני השימוש."
burden = "רק כלי התווך מקבל הגנה. אם זה אבוד, אתה צריך לחכות לפני שאתה מחייב עוד."
perfect = "כלים אחרים עובדים בדרך כלל עם אפקטים של מוטציות. רק המאסטרים נמנעים מהתמוטטות."
tell = "לרוץ על הכלי סדק כפי שהוא מתקרב."
control = "במלון ספרים של Adapt, תחזיקו את הכלים שקיבלת ולבחרו את כלים החזקת."

[mutation.type.deepblood]
name = "דם עמוק"
benefit = "מינוס בלוקים טבעיים עמוק מתחת לאדמה בונה מטען עמוק. הוא מאלץ ריפוי וחוסך כלי אחד."
