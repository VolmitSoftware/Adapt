control = "בלוקים עמוקים טבעיים וקשורים כלי אחד Adapt ספרים."

[mutation.type.mycelial_nerve]
name = "עצבנות"
benefit = "השפעות מועילות שאתה נותן לעצמך מתפשטות בצורה חלשה יותר לשחקנים הסובבים בסביבה ובני חיות מחמד."
burden = "ההשפעה שלך נמשכת פחות זמן, ונזקי אש שוברים את הקישור."
perfect = "ההשפעה שלך שומרת על הזמן שלה, והאש לא שובר את הקשר."
tell = "שבילי ספארי נושאים אפקטים מועתקים לבעלי ברית קרובים."
control = "תן לעצמך אפקט מועיל ליד שחקנים או חיות מחמד בבעלות."

[mutation.type.gravebloom]
name = "קבר"
benefit = "הריגת ההמון עוין טבעי יכולה ליצור פרח קצר ימים שמגדל גידול וריפוי חיות המחמד שלך."
burden = "פעיל פורח מחליש את הריפוי הטבעי שלך, ופורחים מבוגרים מושכים המון עוין."
perfect = "בלום כבר לא מחליש את הריפוי. הם עדיין נעלמים לאחר זמן קצר."
