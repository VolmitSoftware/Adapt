# Adapt language overlay: pl_PL

[mutation.domain]
body = "Ciało"
hunt = "Hunt"
industry = "Przemysł"
wild = "Dzikie"
craft = "Rzemiosło"
anomaly = "Anomalia"

[mutation.type.gale_lung]
name = "Gale Lung"
benefit = "Przeprowadzka wypełnia Momentum. W pełni Momentum, następny hit pchnie lub przestawia cel."
burden = "Wróg cię wypycha, gdy Momentum jest pełne."
perfect = "Wrogowie nie będą cię już mocniej wypychać."
tell = "Wiatr z płytek gromadzi się wokół twoich stóp i broni."
control = "Nie zatrzymuj się, aby wypełnić Momentum, a następnie wylądować hit."

[mutation.type.bastion_spine]
name = "Bastion Spine"
benefit = "Stała wciąż buduje stabilność. Twoja następna tarcza, siekiera lub nieuzbrojone uderzenie wysyła krótki impuls."
burden = "Kiedy jesteś uwiązany, nie możesz biegać ani skakać. Uderzenie z tyłu łamie pozycję."
perfect = "Możesz spryntować i skakać, gdy jesteś podłączony."
tell = "Żeberka kamienne i jasne pęknięcia pokazują swoją zachowaną siłę."
control = "Stań nieruchomo na ziemi, a następnie uderzyć tarczą, siekierą lub pustą ręką."

[mutation.type.verdant_molt]
name = "Verdant Molt"
benefit = "Sneak bez poruszania się po naturalnym gruncie w celu usunięcia szkodliwych skutków."
burden = "Wyczyszcza również pomocne efekty, kosztuje głód i krótko blokuje nowe skutki."
perfect = "Pomocne efekty i głód nie są już stracone. Krótki blok efektu pozostaje."
tell = "Liście, łuski lub zarodniki odrywają się od ciebie."
control = "Trzymaj się i nie ruszaj na naturalnej ziemi."

[mutation.type.temperbound]
name = "Temperatura"
benefit = "Link jeden pancerz zestaw więc jego kawałki dzielą trwałość. Kawałek, który by się złamał staje się pęknięty zamiast."
burden = "Usuwanie lub wymiana połączonego elementu wyłącza zestaw na krótki czas."
perfect = "Zamiana pancerza nie wyłącza już zestawu. Tylko jeden zestaw może pozostać połączony."
tell = "Promieniowanie łączy połączone elementy pancerza."
control = "w półce książkowej Adapt, nosić cztery wykonane części zbroi i wybrać złącza bieżąca."

[mutation.type.paradox_scar]
name = "Paradox Blizna"
benefit = "Długość lub teleport zostawia punkt powrotu."
burden = "Punkt zwrotny jest widoczny, blokuje inny z formowania, a wrogowie mogą go złamać."
perfect = "Nie blokuje już innych efektów mutacyjnych."
tell = "Jasny obraz wtórny oznacza punkt zwrotny."
control = "Po długim ruchu lub teleportacji, przemycić i wymienić ręce do powrotu."

[mutation.type.arsenal_cortex]
name = "Kora arsenalna"
benefit = "Zmiana typu broni lub narzędzia pomiędzy uderzeniami przenosi jeden efekt kontroli do następnego trafienia."
burden = "Korzystanie z tego samego typu dwukrotnie zamyka combo na krótki czas."
perfect = "Powtarzanie typu nie blokuje już połączenia. Do zbudowania tego nadal potrzebne są typy przełączania."
tell = "Zmieniający się symbol obraca się wokół utrzymywanego elementu."
control = "Uderzenia ziemi z różnych rodzajów broni lub narzędzi."

[mutation.type.packmind]
name = "Packmind"
benefit = "Twoje pierwsze uderzenie trafi na cel."
burden = "/Szkodzenie jest mniejsze, /dokąd dołączy ktoś inny."
perfect = "Twoje uszkodzenia nie są już obniżane podczas oczekiwania. Tempo nadal potrzebuje kolejnego uczestnika."
tell = "Linie Amber łączą grupę z zaznaczonym celem."
control = "Uderz cel, a potem niech atak zwierzęcia lub zaangażowany sojusznik."

[mutation.type.trophy_crucible]
name = "Trophy Crucible"
benefit = "Naturalne moby mogą zrzucać trofea. Użyj jednego do przygotowania efektu kontroli przeciwko temu typu mafii."
burden = "Ten typ mafii widzi cię łatwiej i widzi przez ukrywanie Mutacji."
perfect = "Dodatkowa detekcja jest usuwana. Nadal można przechowywać tylko jeden efekt trofeum."
tell = "Maska pokazująca rodzaj mafii pojawia się za tobą."
control = "Prześlizgnij prawym kliknięciem na stolik, trzymając naturalny trofeum."

[mutation.type.umbral_echo]
name = "Echo brzuszne"
benefit = "Atak z nowego kąta lub z nowym typem broni, aby powtórzyć słabszy efekt kontroli po opóźnieniu."
burden = "Powtarzanie tego samego podejścia ujawnia cię i krótko zamyka w ukryciu."
perfect = "Powtarzanie podejścia nie pokazuje już, że jesteś w stanie."
tell = "Ciemny fioletowy obraz wtórny powtarza efekt kontroli."
control = "Zmień kąt ataku lub typ broni pomiędzy uderzeniami."

[mutation.type.living_lattice]
name = "Żywa Lattice"
benefit = "Zbieranie i ponowne sadzenie zarabiają na korzeniową opłatę."
burden = "Ogień i lawa mogą wytrzeć twój ładunek, a wymuszony upadek kosztuje głód."
perfect = "Ogień i lava nie wytrzymują już ładunku."
tell = "Zielone korzenie stają się brązowe zanim ścieżka zniknie."
control = "Zbierz i załóż ponownie, a następnie kliknij prawym przyciskiem myszy podczas trzymania saplinki."

[mutation.type.masterwork_bond]
name = "Masterwork Bond"
benefit = "Zawiąż jedno narzędzie, które wykonałeś. Zatrzymuje się przy jednej trwałości zamiast pęknięcia i musi być naprawiony przed użyciem."
burden = "Tylko związane narzędzie otrzymuje ochronę. Jeśli jest zgubiony, należy poczekać przed związaniem innego."
perfect = "Inne narzędzia działają normalnie z efektem mutacji. Tylko arcydzieło unika łamania."
tell = "Biegnie na pęknięcie narzędzia, gdy zbliża się do złamania."
control = "w półce książkowej Adapt, trzymaj narzędzie, które stworzyłeś i wybierz urządzenie do wiązania."

[mutation.type.deepblood]
name = "Deepblood"
benefit = "Górnictwo naturalne bloki głęboko podziemne buduje głębokie ładowanie. To wzmacnia uzdrowienie i oszczędza jedno związane narzędzie."
burden = "Podziemne uzdrowienie wydaje głębokie ładowanie, a ładunek powoli wysysa się nad ziemią."
perfect = "Pod ziemią gojenie działa przy zerowym naładowaniu. Zapisywanie związanego narzędzia nadal koszty opłaty."
tell = "Czerwone pęknięcia rozprzestrzeniają się na Ciebie i związane narzędzie jako ładunek buduje."
control = "Kopalnia naturalnych bloków głębokich i wiązać jedno narzędzie w Adapt półka na książki."

[mutation.type.mycelial_nerve]
name = "Mycelial Nerve"
benefit = "Pomocne efekty można dać się rozprzestrzeniać w słabszej formie do pobliskich opted- w graczach i zwierząt domowych."
burden = "Twój własny efekt trwa mniej czasu, a branie zniszczeń pożarowych przerywa połączenie."
perfect = "Twój efekt utrzymuje swój pełny czas i ogień nie przełamuje połączenia."
tell = "Ścieżka zarodkowa przenosi skopiowane efekty do pobliskich sojuszników."
control = "Daj sobie pomocny efekt w pobliżu opted- w graczach lub własnością zwierząt domowych."

[mutation.type.gravebloom]
name = "Gravebloom"
benefit = "Zabijanie naturalnego wrogo nastawionego tłumu może stworzyć krótkotrwałe kwitnienie, które uprawia i leczy zwierzęta domowe."
burden = "Aktywne kwiaty osłabiają naturalne uzdrawianie, a starsze kwitnie przyciągają wrogie tłumy."
perfect = "Kwiaty nie osłabiają już uzdrawiania, ale wciąż znikają po krótkim czasie."
tell = "Blade kwiaty i cząstki duszy rosną z miejsca śmierci."
control = "Zabić naturalny, wrogi tłum na naturalnym gruncie."

[mutation.type.resonant_formula]
name = "Wzory wzorcowe"
benefit = "Zrób, zaparz, i oczaruj raz każdy do przygotowania combo. Twój kolejny nieniszczący efekt anomalii powtarza się z połową siły."
burden = "Powtarzanie tego samego etapu przygotowania łamie kombinację i usuwa najstarszy pomocny efekt."
perfect = "Powtórzenie kroku nie rozbija już kombinacji. Nadal potrzebujesz wszystkich trzech różnych kroków."
tell = "Trzy symbole łączą się razem, gdy kombinacja jest gotowa."
control = "Zrób, zaparz i oczaruj raz w każdej kolejności."

