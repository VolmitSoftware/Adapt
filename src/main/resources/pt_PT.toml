# Adapt language overlay: pt_PT

[mutation.domain]
body = "Corpo"
hunt = "Caça"
industry = "Indústria"
wild = "Selvagem"
craft = "Artesanato"
anomaly = "Anomalias"

[mutation.type.gale_lung]
name = "Gale Lung"
benefit = "Momento de preenchimentos em movimento. No Momentum completo, sua próxima batida empurra ou reposiciona o alvo."
burden = "Os inimigos empurram mais enquanto o Momentum está cheio."
perfect = "Os inimigos já não te empurram mais. Bloqueamento ainda vazio Momentum."
tell = "Vento Teal se junta em torno de seus pés e arma."
control = "Continuem a avançar para preencher o Momentum, depois atiram um golpe."

[mutation.type.bastion_spine]
name = "Bastion Spine"
benefit = "Estar ainda constrói estabilidade. Seu próximo escudo, machado ou golpe desarmado envia um pequeno empurrão."
burden = "Enquanto estás preparado, não podes correr ou saltar. Um golpe por trás quebra a postura."
perfect = "Você pode correr e saltar enquanto está preparado. Ataques por trás ainda podem quebrá-lo."
tell = "Costelas de pedra e rachaduras brilhantes mostram sua força armazenada."
control = "Fique parado no chão, depois ataque com um escudo, machado ou mão vazia."

[mutation.type.verdant_molt]
name = "Verdant Molt"
benefit = "Esgueirar-se sem se mover em terreno natural para limpar efeitos nocivos."
burden = "Esclarece também efeitos úteis, custa a fome e bloqueia brevemente novos efeitos."
perfect = "Efeitos úteis e fome já não se perdem. O bloco de efeito curto permanece."
tell = "Folhas, escamas ou esporos explodem longe de você."
control = "Segurem-se e fiquem quietos em terreno natural."

[mutation.type.temperbound]
name = "Temperada"
benefit = "Ligar um conjunto de armadura para que suas peças compartilhem durabilidade. Uma peça que quebraria torna-se rachada em vez."
burden = "Remover ou trocar uma peça ligada desactiva o conjunto por um curto período de tempo."
perfect = "Trocar armadura não desativa mais o conjunto. Apenas um conjunto pode permanecer ligado."
tell = "Linhas brilhantes conectam as peças de armadura ligadas."
control = "Em uma Adapt estante, usar quatro peças de armadura artesanais e escolher Link Armor atual."

[mutation.type.paradox_scar]
name = "Cicatriz Paradox"
benefit = "Um movimento longo ou teletransporte deixa um ponto de retorno. Você pode voltar para ele uma vez."
burden = "O ponto de retorno é visível, bloqueia outro da formação, e os inimigos podem quebrá-lo."
perfect = "Não impede mais outros efeitos de retorno da mutação."
tell = "Uma afterimage brilhante marca o ponto de retorno."
control = "Depois de um longo movimento ou teletransporte, esgueirar e trocar as mãos para retornar."

[mutation.type.arsenal_cortex]
name = "Cortex Arsenal"
benefit = "Mudar os tipos de arma ou ferramenta entre as batidas leva um efeito de controle para o próximo hit."
burden = "Usando o mesmo tipo duas vezes bloqueia a combinação por um curto período de tempo."
perfect = "Repetindo um tipo já não bloqueia a combinação. Os tipos de mudança ainda são necessários para compilar."
tell = "Um símbolo em mudança gira em torno do item mantido."
control = "Terra bate com diferentes tipos de arma ou ferramenta."

[mutation.type.packmind]
name = "Packmind"
benefit = "Seu primeiro golpe marca um alvo. Animais de estimação e aliados optados construir Tempo batendo-lhe também."
burden = "Os danos são menores até que alguém se junte."
perfect = "O seu dano não é mais reduzido enquanto espera."
tell = "Linhas Amber ligam o grupo ao alvo marcado."
control = "Acertar um alvo, em seguida, ter um animal de estimação ou optar-em aliado atacá-lo também."

[mutation.type.trophy_crucible]
name = "Crucible Troféu"
benefit = "Mobs naturais podem derrubar troféus. Use um para preparar um efeito de controle contra esse tipo de mob."
burden = "Esse tipo de multidão vê você mais facilmente e vê através Mutação furtivo."
perfect = "A detecção extra é removida. Você ainda pode armazenar apenas um efeito troféu."
tell = "Uma máscara mostrando o tipo de mob armazenado aparece atrás de você."
control = "Sneak-direita-clique em uma mesa de artesanato enquanto segurando um troféu natural."

[mutation.type.umbral_echo]
name = "Eco Umbral"
benefit = "Ataque de um novo ângulo ou com um novo tipo de arma para repetir um efeito de controle mais fraco após um atraso."
burden = "Repetindo a mesma abordagem revela você e brevemente fecha furtivo."
perfect = "Repetir uma abordagem já não te revela. Novos ângulos ou tipos de armas ainda são necessários."
tell = "Uma afterimage roxo escuro repete o efeito de controle."
control = "Altere o ângulo de ataque ou tipo de arma entre os hits."

[mutation.type.living_lattice]
name = "Lattice vivo"
benefit = "Colheita e replantação ganha Carga Raiz. Gastá-lo para crescer um curto caminho temporário."
burden = "Fogo e lava podem limpar sua carga, e um colapso forçado custa fome."
perfect = "Fogo e lava já não limpam carga. Os caminhos ainda desaparecem."
tell = "As raízes verdes tornam-se castanhas antes que o caminho desapareça."
control = "Colheita e replanta, em seguida, sneake-direita-clique enquanto segurando uma muda."

[mutation.type.masterwork_bond]
name = "Obrigação de trabalho principal"
benefit = "Ligar uma ferramenta que você crafted. Ele pára com uma durabilidade em vez de quebrar e deve ser reparado antes de usar."
burden = "Somente a ferramenta vinculada obtém proteção. Se estiver perdido, você deve esperar antes de vincular outro."
perfect = "Outras ferramentas funcionam normalmente com efeitos de mutação. Apenas o trabalho de mestre evita quebrar."
tell = "Runas na rachadura da ferramenta à medida que se aproxima de quebrar."
control = "Em uma prateleira de livros Adapt, segurar uma ferramenta que você criou e escolher a ferramenta ligada."

[mutation.type.deepblood]
name = "Sangue profundo"
benefit = "Mineração blocos naturais profundo subterrâneo constrói carga profunda. Ele pode curar e salva uma ferramenta ligada."
burden = "Cura subterrânea gasta carga profunda, e a carga lentamente drena acima do solo."
perfect = "Obras de cura subterrânea a carga zero. Salvar a ferramenta vinculada ainda custa carga."
tell = "As rachaduras vermelhas espalham-se por você e pela ferramenta ligada enquanto a carga é construída."
control = "Mina blocos profundos naturais e ligar uma ferramenta em um Adapt estante."

[mutation.type.mycelial_nerve]
name = "Nervo Micelial"
benefit = "Os efeitos úteis que se dão espalham-se em forma mais fraca para os jogadores e animais de estimação próximos."
burden = "Seu próprio efeito dura menos tempo, e tomar fogo quebra a ligação."
perfect = "Seu efeito mantém seu tempo integral e fogo já não quebra o link."
tell = "Esporas levam efeitos copiados para aliados próximos."
control = "Dê-se um efeito útil perto de jogadores ou animais de estimação."

[mutation.type.gravebloom]
name = "Gravebloom"
benefit = "Matar uma multidão hostil natural pode criar uma flor de curta duração que cresce colheitas e cura seus animais de estimação."
burden = "Flores ativas enfraquecem sua cura natural, e flores mais velhas atraem multidões hostis."
perfect = "As flores não enfraquecem mais a cura, mas desaparecem depois de pouco tempo."
tell = "Flores pálidas e partículas de alma sobem do ponto da morte."
control = "Matar uma multidão hostil natural em terreno natural."

[mutation.type.resonant_formula]
name = "Fórmula Ressonante"
benefit = "Artesanato, cerveja e encantamento uma vez cada um para preparar uma combinação. O seu próximo efeito Anomalia não prejudicial repete- se com metade da força."
burden = "Repetindo o mesmo passo de preparação quebra a combinação e remove seu mais antigo efeito útil."
perfect = "Repetindo um passo não mais quebra a combinação. Você ainda precisa dos três passos diferentes."
tell = "Três símbolos se unem quando a combinação estiver pronta."
control = "Artesanato, cerveja e encantamento uma vez cada um, em qualquer ordem."

