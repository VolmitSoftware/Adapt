lore1 = "Slowed fall per airtime"

[mutated.signature.ranged.chronos.convergence]
name = "Replayed Shot"
description = "A fully drawn bow shot fires again 1.5 s later from where it left, on the same path, without using an arrow. The replay sets off no Ranged effects."
lore1 = "Replay damage"

[mutated.signature.blocking.unarmed.convergence]
name = "Iron Guard"
description = "Right-click a block or mob with both hands empty just before a hit to parry it without a shield: the hit is negated, half of it goes back to the attacker, the attacker staggers, and your next bare-hand hit within 3 s hits harder."
lore1 = "Parry window"
lore2 = "Damage sent back"
lore3 = "Counter damage"

[mutated.signature.blocking.taming.convergence]
name = "Shieldbearer's Pack"
description = "Your own pets behind your raised shield or your Planted Bulwark take no projectile damage and slowly heal."
lore1 = "Cover depth"
lore2 = "Pet healing per second"

[mutated.signature.stealth.swords.convergence]
name = "Shadow Riposte"
description = "While you sneak and no other mob hunts you, a melee hit you take is partly parried and a free Shadow Step puts you behind the attacker, where your next hit on it is a Death Mark opening. Needs Shadow Step ready and room behind it. 15 s cooldown."
lore1 = "Parried"

[mutated.signature.stealth.rift.convergence]
name = "Void Step"
description = "Soon after a blink, right-click a creature that cannot see you with an empty hand to Shadow Step behind it without a Smoke Pellet, at your Shadow Step's range and cooldown. While no mob hunts you, Phase Step blinks leave no particles or sound."
lore1 = "Time after a blink"

[mutated.signature.hunter.ranged.convergence]
