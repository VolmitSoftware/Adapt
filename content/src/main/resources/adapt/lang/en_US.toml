lore2 = "Lock range"

[mutated.signature.hunter.taming.convergence]
name = "Pack Hunt"
description = "Your pets take up your blood trail or your Tracker's Compass species on their own, never past 32 blocks from you, and their bites on that quarry build and use your Apex Predator ramp."
lore1 = "Hunt range"
lore2 = "Pets per hunt"
lore3 = "Pet damage per ramp stack"

[mutated.signature.tragoul.unarmed.convergence]
