import org.gradle.api.artifacts.Dependency
import org.gradle.api.artifacts.ExternalModuleDependency
import org.gradle.api.artifacts.FileCollectionDependency
import org.gradle.api.tasks.compile.JavaCompile
import org.gradle.api.services.BuildService
import org.gradle.api.services.BuildServiceParameters
import org.gradle.jvm.tasks.Jar

// Paper 1.21.1 and 1.20.1 jars: the :bukkit sources compiled against the older Paper API, with whole-file
// replacements from bukkit/src/versions/<mc> (the 1.20.1 chain also takes the 1.21.1 replacements), downgraded to the
// server's Java level after shading.
Map<String, Map<String, Object>> legacyTargets = [
    '1.21.1': [
        paperApi: 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT',
        apiVersion: '1.21',
        java: JavaVersion.VERSION_21,
        overlays: ['1.21.1'],
        advancementNms: 'v1_21_R1',
        advancementArtifact: 'com.frengor:ultimateadvancementapi-shadeable:2.7.2:mojang-mapped',
        mojangMapped: true,
        devBundle: '1.21.1-R0.1-SNAPSHOT'
    ],
    '1.20.1': [
        paperApi: 'io.papermc.paper:paper-api:1.20.1-R0.1-SNAPSHOT',
        apiVersion: '1.20',
        java: JavaVersion.VERSION_17,
        overlays: ['1.21.1', '1.20.1'],
        advancementNms: 'v1_20_R1',
        advancementArtifact: 'com.frengor:ultimateadvancementapi-shadeable:2.7.2',
        mojangMapped: false,
        devBundle: '1.20.1-R0.1-SNAPSHOT'
    ]
]

// JvmDowngrader keeps static state; two of its tasks running at once in one build time out.
abstract class JvmDowngraderSlot implements BuildService<BuildServiceParameters.None> {
}
Provider<JvmDowngraderSlot> jvmDowngraderSlot = gradle.sharedServices.registerIfAbsent('jvmDowngraderSlot', JvmDowngraderSlot) {
    maxParallelUsages = 1
}

// Server code (packets, chunk structure data) compiled against the Mojang-named Paper server of each version. Paper
// 1.21.1 runs Mojang names and loads the plugin unmapped (the jar declares the mojang namespace); Paper 1.20.1 runs
// Spigot names, so that jar carries the reobfuscated classes.
legacyTargets.each { String minecraftVersion, Map<String, Object> target ->
    project(":bukkit-${minecraftVersion}-native") {
        layout.buildDirectory.set(rootProject.layout.buildDirectory.dir("bukkit-${minecraftVersion}-native"))
        apply plugin: 'java-library'
        apply plugin: 'io.papermc.paperweight.userdev'

        File versionSources = project(':bukkit').file('src/versions')
        List<File> roots = ((List<String>) target.overlays).collect { String overlay -> new File(versionSources, "${overlay}/native/java") }
        sourceSets.main.java.setSrcDirs(roots)
        sourceSets.main.java.exclude { FileTreeElement entry ->
            for (int index = roots.size() - 1; index >= 0; index--) {
                File replacement = new File(roots[index], entry.relativePath.pathString)
                if (replacement.isFile()) {
                    return entry.file.canonicalFile != replacement.canonicalFile
                }
            }
            false
        }
        sourceSets.main.resources.setSrcDirs([])
        sourceSets.test.java.setSrcDirs([])
        sourceSets.test.resources.setSrcDirs([])

        tasks.withType(JavaCompile).configureEach {
            options.release.set(((JavaVersion) target.java).majorVersion as int)
        }

        Object paperweightExtension = extensions.getByName('paperweight')
        Class<?> reobfConfiguration = Class.forName('io.papermc.paperweight.userdev.ReobfArtifactConfiguration', true,
                paperweightExtension.getClass().classLoader)
        paperweightExtension.reobfArtifactConfiguration.set(target.mojangMapped
                ? reobfConfiguration.getMOJANG_PRODUCTION() : reobfConfiguration.getREOBF_PRODUCTION())

        dependencies {
            paperweight.paperDevBundle(target.devBundle)
            compileOnly('com.github.VolmitSoftware.VolmLib:native-api:master-SNAPSHOT') {
                transitive = false
            }
        }
    }
}

legacyTargets.each { String minecraftVersion, Map<String, Object> target ->
    project(":bukkit-${minecraftVersion}") {
        evaluationDependsOn(':bukkit')
        Project bukkit = project(':bukkit')
        File bukkitSources = bukkit.file('src')
        List<File> overlayRoots = ((List<String>) target.overlays).collect { String overlay -> new File(bukkitSources, "versions/${overlay}") }

        // Before the plugins: slimjar resolves its resource directory from the build directory when applied.
        layout.buildDirectory.set(rootProject.layout.buildDirectory.dir("bukkit-${minecraftVersion}"))
        apply plugin: 'java-library'
        apply plugin: 'io.freefair.lombok'
        apply plugin: 'com.gradleup.shadow'
        apply plugin: 'de.crazydev22.slimjar'
        apply plugin: 'xyz.wagyourtail.jvmdowngrader'
        apply plugin: 'art.arcane.volmit-packaging'

        version = bukkit.version
        base.archivesName.set('Adapt')
        ext.bukkitMinecraftRange = minecraftVersion

        tasks.withType(JavaCompile).configureEach {
            options.debugOptions.debugLevel = 'none'
            options.compilerArgs.addAll(['-Xmaxerrs', '10000'])
        }

        Closure<Void> overlay = { SourceDirectorySet directories, File base, String kind ->
            directories.setSrcDirs([base])
            List<File> replacements = overlayRoots.collect { File root -> new File(root, kind) }
            replacements.each { File replacement -> directories.srcDir(replacement) }
            directories.exclude { FileTreeElement entry ->
                for (int index = replacements.size() - 1; index >= 0; index--) {
                    File replacement = new File(replacements[index], entry.relativePath.pathString)
                    if (replacement.isFile()) {
                        return entry.file.canonicalFile != replacement.canonicalFile
                    }
                }
                false
            }
        }

        sourceSets {
            gameplayFixture
        }
        overlay(sourceSets.main.java, new File(bukkitSources, 'main/java'), 'java')
        overlay(sourceSets.main.resources, new File(bukkitSources, 'main/resources'), 'resources')
        overlay(sourceSets.test.java, new File(bukkitSources, 'test/java'), 'test')
        sourceSets.test.resources.setSrcDirs([new File(bukkitSources, 'test/resources')])
        overlay(sourceSets.gameplayFixture.java, new File(bukkitSources, 'test/gameplay/fixture/java'), 'fixture')
        sourceSets.gameplayFixture.java.srcDir(rootProject.file('core/src/gameplayFixture/java'))
        sourceSets.gameplayFixture.resources.setSrcDirs([new File(bukkitSources, 'test/gameplay/fixture/resources')])
        sourceSets.gameplayFixture.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath

        Configuration platformUtilsConfiguration = configurations.create('platformUtilsLibrary')
        Configuration advancementConfiguration = configurations.create('advancementLibrary')

        TaskProvider<Jar> strippedAdvancementLibrary = tasks.register('strippedAdvancementLibrary', Jar) {
            archiveClassifier = 'advancement-library'
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
            inputs.files(advancementConfiguration)
            from({ advancementConfiguration.collect { File dependency -> zipTree(dependency) } })
            exclude { FileTreeElement entry ->
                String path = entry.path
                path.startsWith('com/fren_gor/ultimateAdvancementAPI/nms/v')
                        && !path.startsWith("com/fren_gor/ultimateAdvancementAPI/nms/${target.advancementNms}/")
            }
            exclude('com/fren_gor/ultimateAdvancementAPI/database/impl/MySQL.class')
        }

        // native-api carries 26.x replacements of the advancement library's ReflectionUtil and Versions; these jars
        // keep the library's own, which pick its bundled NMS wrappers.
        Configuration nativeApiConfiguration = configurations.create('nativeApiLibrary')
        TaskProvider<Jar> strippedNativeApi = tasks.register('strippedNativeApi', Jar) {
            archiveClassifier = 'native-api'
            inputs.files(nativeApiConfiguration)
            from({ nativeApiConfiguration.collect { File dependency -> zipTree(dependency) } })
            exclude('com/fren_gor/**')
        }

        TaskProvider<Jar> strippedPlatformUtils = tasks.register('strippedPlatformUtils', Jar) {
            archiveClassifier = 'platform-utils'
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
            inputs.files(platformUtilsConfiguration)
            from({ platformUtilsConfiguration.collect { File dependency -> zipTree(dependency) } })
            exclude('net/kyori/**')
            exclude('META-INF/services/net.kyori.**')
            exclude('com/google/gson/**')
        }

        // Everything the 26.x jar declares, minus what is bound to the 26.x server: the Paper API, the 26.x native
        // adapters and the 26.x advancement bridge, and the jars :bukkit builds from its own sources.
        Closure<Boolean> versionBound = { Dependency dependency ->
            if (dependency instanceof ExternalModuleDependency) {
                return dependency.group == 'io.papermc.paper'
                        || dependency.group == 'com.frengor'
                        || (dependency.group == 'com.github.VolmitSoftware.VolmLib'
                            && dependency.name.startsWith('native-'))
            }
            if (dependency instanceof FileCollectionDependency) {
                return !dependency.files.buildDependencies.getDependencies(null).isEmpty()
            }
            false
        }
        ['api', 'implementation', 'compileOnly', 'compileOnlyApi', 'slim', 'slimApi', 'platformUtilsLibrary',
         'testImplementation', 'testRuntimeOnly'].each { String configurationName ->
            bukkit.configurations.getByName(configurationName).dependencies.each { Dependency dependency ->
                if (!versionBound(dependency)) {
                    dependencies.add(configurationName, dependency.copy())
                }
            }
        }

        dependencies {
            add('nativeApiLibrary', 'com.github.VolmitSoftware.VolmLib:native-api:master-SNAPSHOT') {
                transitive = false
            }
            implementation(files(strippedNativeApi.flatMap { Jar task -> task.archiveFile }))
            implementation(files(strippedPlatformUtils.flatMap { Jar task -> task.archiveFile }))
            // The production jar of the server code: Mojang names on 1.21.1, the reobfuscated jar on 1.20.1.
            implementation(files(rootProject.project(":bukkit-${minecraftVersion}-native").tasks.named(target.mojangMapped ? 'jar' : 'reobfJar')))
            compileOnly(target.paperApi)
            add('advancementLibrary', target.advancementArtifact) {
                transitive = false
            }
            compileOnly(target.advancementArtifact) {
                transitive = false
            }
            api(files(strippedAdvancementLibrary.flatMap { Jar task -> task.archiveFile }))
            testImplementation(target.paperApi)
            testImplementation(sourceSets.gameplayFixture.output)
        }

        tasks.named('slimJar').get()
        tasks.named('slimJar') {
            doFirst { new File(outputDirectory, 'slimjar-resolutions.dat').delete() }
        }

        tasks.named('processResources').configure {
            TaskProvider<Task> languageSourceManifest = bukkit.tasks.named('generateLanguageSourceManifest')
            dependsOn(languageSourceManifest)
            exclude('*.toml')
            from(languageSourceManifest)

            Map<String, Object> pluginProperties = [
                name      : rootProject.name,
                version   : project.version,
                main      : 'art.arcane.adapt.Adapt',
                apiVersion: target.apiVersion,
            ]
            inputs.properties(pluginProperties)
            filesMatching('**/plugin.yml') {
                expand(pluginProperties)
            }
        }

        tasks.named('processGameplayFixtureResources', ProcessResources).configure { ProcessResources task ->
            String fixtureApiVersion = target.apiVersion
            task.inputs.property('apiVersion', fixtureApiVersion)
            task.filesMatching('plugin.yml') { FileCopyDetails details ->
                details.filter { String line -> line.startsWith('api-version:') ? "api-version: '${fixtureApiVersion}'" : line }
            }
        }

        String lib = 'art.arcane.adapt.util'
        slimJar {
            mirrors = bukkit.slimJar.mirrors
            relocate('art.arcane.volmlib', "${lib}.arcane.volmlib")
            relocate('com.fren_gor.ultimateAdvancementAPI', "${lib}.advancements")
            relocate('net.byteflux.libby', "${lib}.libby")
            relocate('org.bstats', "${lib}.bstats")
        }

        tasks.named('jar', Jar).configure {
            archiveClassifier.set('thin')
        }

        File wovenCoreJar = layout.buildDirectory.file('tmp/apiCompat/core-bukkit.jar').get().asFile
        TaskProvider<JavaExec> weaveApiBridges = tasks.register('weaveApiBridges', JavaExec) {
            group = 'build'
            description = 'Adds the pre-port Bukkit-typed API bridges to the core classes packed into the plugin jar.'
            dependsOn(tasks.named('compileJava'))
            Configuration coreJar = bukkit.configurations.getByName('apiCompatCore')
            inputs.files(coreJar).withPathSensitivity(PathSensitivity.NONE)
            inputs.files(sourceSets.main.java.classesDirectory).withPathSensitivity(PathSensitivity.RELATIVE)
            outputs.file(wovenCoreJar)
            classpath = bukkit.sourceSets.apiCompat.runtimeClasspath
            mainClass = 'art.arcane.adapt.apicompat.ApiBridgeWeaver'
            argumentProviders.add({
                [coreJar.singleFile.path, sourceSets.main.java.classesDirectory.get().asFile.path, wovenCoreJar.path]
            } as CommandLineArgumentProvider)
        }

        TaskProvider<Jar> shadowJarTask = tasks.named('shadowJar', Jar)
        shadowJarTask.configure {
            dependsOn(weaveApiBridges)
            archiveClassifier.set('shadow')
            if (target.mojangMapped) {
                manifest.attributes('paperweight-mappings-namespace': 'mojang')
            }
            minimize {
                exclude(dependency('de.crazydev22.slimjar.helper:.*:.*'))
                exclude(dependency('com.github.VolmitSoftware.VolmLib:.*:.*'))
                exclude(project(':core'))
            }
            dependencies {
                exclude(project(':core'))
            }
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
            exclude('net/kyori/**')
            exclude('com/google/gson/**')
            exclude { FileTreeElement entry ->
                String nativePrefix = 'art/arcane/volmlib/nativelib/'
                String path = entry.path
                if (!path.startsWith(nativePrefix) || !path.endsWith('.class')) {
                    return false
                }
                String relative = path.substring(nativePrefix.length())
                return relative.contains('/') && !relative.matches('(?:player|entity|advancement)/.*|chunk/(?:GeneratedChunkStructures|ChunkPosition).*')
            }
            from({ zipTree(wovenCoreJar) }) {
                exclude('META-INF/MANIFEST.MF')
            }
        }

        jvmdg.downgradeTo = (JavaVersion) target.java

        tasks.named('downgradeJar').configure {
            inputFile.set(shadowJarTask.flatMap { task -> task.archiveFile })
            archiveClassifier.set('downgraded')
        }

        tasks.named('shadeDowngradedApi', Jar).configure {
            inputFile.set(tasks.named('downgradeJar', Jar).flatMap { Jar task -> task.archiveFile })
            shadePath.set('art/arcane/adapt/util/jvmdg/')
            archiveClassifier.set('')
            archiveFileName.set("Adapt v${project.version} [CraftBukkit] ${minecraftVersion}.jar")
        }

        // The fixture runs beside the plugin on the same server Java, so it is downgraded the same way, with the
        // JvmDowngrader API under its own package.
        Class<? extends Task> shadowJarType = (Class<? extends Task>) Class.forName(
                'com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar', true, shadowJarTask.get().getClass().classLoader)
        Class<? extends Task> downgradeType = (Class<? extends Task>) tasks.named('downgradeJar').get().getClass().getSuperclass()
        Class<? extends Task> shadeType = (Class<? extends Task>) tasks.named('shadeDowngradedApi').get().getClass().getSuperclass()
        TaskProvider<Jar> compiledFixtureJar = tasks.register('compiledGameplayFixtureJar', shadowJarType) { Jar task ->
            dependsOn(tasks.named('gameplayFixtureClasses'))
            task.from(sourceSets.gameplayFixture.output)
            task.configurations = []
            task.relocate('art.arcane.volmlib', 'art.arcane.adapt.util.arcane.volmlib')
            task.archiveFileName.set('AdaptGameplayFixture-compiled.jar')
        } as TaskProvider<Jar>
        TaskProvider<Jar> downgradedFixtureJar = tasks.register('downgradeGameplayFixtureJar', downgradeType) { Jar task ->
            task.inputFile.set(compiledFixtureJar.flatMap { Jar jar -> jar.archiveFile })
            task.classpath = sourceSets.gameplayFixture.compileClasspath
            task.archiveFileName.set('AdaptGameplayFixture-downgraded.jar')
        } as TaskProvider<Jar>
        TaskProvider<Jar> gameplayFixtureJar = tasks.register('gameplayFixtureJar', shadeType) { Jar task ->
            group = 'verification'
            description = "Builds the isolated Paper ${minecraftVersion} gameplay observer and arena fixture."
            task.inputFile.set(downgradedFixtureJar.flatMap { Jar jar -> jar.archiveFile })
            task.shadePath.set('art/arcane/adapt/gameplay/jvmdg/')
            task.archiveFileName.set('AdaptGameplayFixture.jar')
        } as TaskProvider<Jar>

        tasks.named('build').configure {
            dependsOn(tasks.named('shadeDowngradedApi'), gameplayFixtureJar)
        }

        [tasks.named('downgradeJar'), tasks.named('shadeDowngradedApi'), downgradedFixtureJar, gameplayFixtureJar].each { TaskProvider<? extends Task> task ->
            task.configure { usesService(jvmDowngraderSlot) }
        }

        pluginPackaging {
            nativeImplementationPackages.add('art.arcane.adapt.bukkit.packet')
            loggingPolicy {
                allowlistFile = bukkit.file('logging-policy-allowlist.txt')
            }
            artifacts {
                create('distribution') {
                    stripDirectories = true
                    stripLocalVariables = true
                    releaseCompression = bukkit.pluginPackaging.artifacts.getByName('distribution').releaseCompression
                    packed = true
                    packedJarAccessors = ['art/arcane/adapt/Adapt#getJarFile']
                    taskName = 'shadeDowngradedApi'
                    policyName = 'Adapt'
                    prunePrefixes = ['art/arcane/adapt/util/arcane/volmlib/']
                    keepPrefixes = ['art/arcane/adapt/util/arcane/volmlib/util/matter/slices/',
                                    'art/arcane/adapt/util/arcane/volmlib/nativelib/',
                                    // Server classes extending server types the shrinker cannot see (recipes).
                                    'art/arcane/adapt/bukkit/natives/']
                    shrinkRules = [bukkit.file('packaging/shrink.pro')]
                    shrinkDontwarn = ['org.sqlite.**', 'net.minecraft.**', 'org.bukkit.craftbukkit.**', 'com.mojang.authlib.**',
                                      'com.mojang.datafixers.**', 'art.arcane.adapt.bukkit.natives.**',
                                      'xyz.wagyourtail.jvmdg.version.**', 'de.crazydev22.platformutils.paper.PaperPlatform']
                    shrinkRelocations = [
                        'net.byteflux.libby': "${lib}.libby",
                        'org.bstats': "${lib}.bstats"
                    ]
                }
            }
        }

        Configuration serverApi = configurations.create('serverApi') {
            canBeConsumed = false
        }
        dependencies.add('serverApi', target.paperApi)
        File linkageReport = layout.buildDirectory.file('reports/server-linkage.txt').get().asFile
        TaskProvider<JavaExec> verifyServerLinkage = tasks.register('verifyServerLinkage', JavaExec) {
            group = 'verification'
            description = "Links the plugin jar's server API references against the Paper ${minecraftVersion} API."
            TaskProvider<Jar> producer = tasks.named('shadeDowngradedApi', Jar)
            dependsOn(producer)
            inputs.files(producer.flatMap { Jar task -> task.archiveFile }).withPathSensitivity(PathSensitivity.NONE)
            inputs.files(serverApi).withPathSensitivity(PathSensitivity.NONE)
            outputs.file(linkageReport)
            classpath = bukkit.sourceSets.apiCompat.runtimeClasspath
            mainClass = 'art.arcane.adapt.apicompat.ServerLinkageCheck'
            argumentProviders.add({
                [producer.get().archiveFile.get().asFile.path, linkageReport.path, serverApi.asPath]
            } as CommandLineArgumentProvider)
        }
        tasks.named('check').configure {
            dependsOn(verifyServerLinkage)
        }

        tasks.named('test', Test) {
            inputs.dir(rootProject.file('../docs/adapt'))
                    .withPropertyName('skillDocumentation')
                    .withPathSensitivity(PathSensitivity.RELATIVE)
            workingDir = bukkit.projectDir
            useJUnitPlatform {
                excludeTags('media-export')
            }
            jvmArgs('-Dnet.bytebuddy.experimental=true')
            maxParallelForks = Math.max(1, Runtime.runtime.availableProcessors().intdiv(2))
            timeout = java.time.Duration.ofMinutes(10)
            testLogging {
                events('failed')
                showStandardStreams = false
                exceptionFormat = 'full'
            }
        }
    }
}
