afterEvaluate {
    Jar distribution = tasks.named('shadowJar', Jar).get()
    File packedArchive = new File(distribution.destinationDirectory.get().asFile,
            distribution.archiveFileName.get().replaceFirst(/\.jar$/, '-packed.jar'))
    rootProject.ext.multiplexor = [
        schema: 1,
        id: 'adapt',
        name: 'Adapt',
        sandbox: 'per-target',
        parallelTargets: true,
        sourceDependencies: ['volmlib', 'iris', 'hiddenore'],
        sourceInputs: ['docs/adapt'],
        targets: [[
            id: 'bukkit',
            tasks: ['build'],
            arguments: [],
            java: 25,
            memoryMiB: 6144,
            workers: 2,
            dependsOn: [],
            artifacts: [[
                path: relativePath(packedArchive),
                role: 'runtime',
                platforms: ['plugin'],
                minecraftVersions: [bukkitMinecraftRange.toString()]
            ]]
        ]]
    ]
}
