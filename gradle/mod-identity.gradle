import groovy.json.JsonSlurper
import java.util.regex.Matcher

File adaptRoot = (File) project.ext.adaptRoot

Closure<String> declaredVersion = { ->
    String override = providers.gradleProperty('adaptVersion').orNull
    if (override != null) {
        return override
    }
    File properties = new File(adaptRoot, 'gradle.properties')
    if (properties.isFile()) {
        Properties values = new Properties()
        properties.withInputStream { InputStream stream -> values.load(stream) }
        for (String key : ['adaptVersion', 'projectVersion', 'version']) {
            if (values.getProperty(key)) {
                return values.getProperty(key)
            }
        }
    }
    for (String script : ['build.gradle', 'bukkit/build.gradle']) {
        File candidate = new File(adaptRoot, script)
        if (candidate.isFile()) {
            Matcher match = (candidate.getText('UTF-8') =~ /(?m)^\s*version\s*=\s*['"]([^'"]+)['"]/)
            if (match.find()) {
                return match.group(1)
            }
        }
    }
    throw new GradleException('No Adapt version found; pass -PadaptVersion or declare version in the root build')
}

Map<String, Map<String, Object>> targets = (Map<String, Map<String, Object>>) new JsonSlurper().parse(new File(adaptRoot, 'gradle/targets.json'))
targets.each { String target, Map<String, Object> properties ->
    if (!(properties.forge instanceof String) || properties.forge.isBlank() || !properties.forgeLoaderRange) {
        throw new GradleException("Minecraft ${target} must declare Forge support")
    }
    boolean neoForgeDeclared = properties.neoforge instanceof String ^ properties.neoforgeUsesForge == true
    if (!neoForgeDeclared || !(properties.fabricLoader instanceof String) || !(properties.fabricApi instanceof String) || !(properties.fabricModules instanceof List)) {
        throw new GradleException("Minecraft ${target} must declare NeoForge (a version or neoforgeUsesForge) and Fabric support")
    }
    if (!((String) properties.fabricApi).endsWith("+${target}") || !((List<String>) properties.fabricModules).contains('fabric-transitive-access-wideners-v1')) {
        throw new GradleException("Minecraft ${target} must name the Fabric API release built for it and nest fabric-transitive-access-wideners-v1, whose widened access the other Fabric API modules use at runtime")
    }
    if (!(properties.javaVersion in [17, 21, 25]) || !(properties.dataPackFormat instanceof Integer)) {
        throw new GradleException("Minecraft ${target} must declare its Java runtime and data pack format")
    }
    if (!(properties.obfuscated instanceof Boolean) || !(properties.forgeRuntimeMappings in ['srg', 'official'])) {
        throw new GradleException("Minecraft ${target} must declare whether it is obfuscated and its Forge runtime mappings")
    }
    if (!properties.obfuscated && properties.forgeRuntimeMappings != 'official') {
        throw new GradleException("Minecraft ${target} is unobfuscated and must use official Forge runtime mappings")
    }
}
String minecraftVersion = providers.gradleProperty('minecraftVersion').getOrElse(targets.keySet().last())
if (!targets.containsKey(minecraftVersion)) {
    throw new GradleException("Unsupported Minecraft target ${minecraftVersion}; choose ${targets.keySet().join(', ')}")
}
String adaptVersion = declaredVersion()
if (!(adaptVersion ==~ /[0-9]+\.[0-9]+\.[0-9]+(?:[-+][A-Za-z0-9.-]+)?/)) {
    throw new GradleException("Adapt version ${adaptVersion} is not a semantic version")
}

ext.adapt = [
    projectId: 'adapt',
    projectName: 'Adapt',
    projectGroup: 'art.arcane.adapt',
    projectVersion: adaptVersion,
    minecraftVersion: minecraftVersion
]
ext.minecraftTargets = targets
group = 'art.arcane.adapt'
version = adaptVersion
